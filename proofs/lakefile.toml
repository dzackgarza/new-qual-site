name = "qual_proofs"
version = "0.1.0"
packagesDir = ".lake/packages"
keywords = ["math"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false

# Standing rule: this project pins the latest Mathlib. The require is `master`;
# lake-manifest.json records the master head this tree was last moved to.
# Run `lake update mathlib` to move the manifest to the current master head,
# then `lake exe cache get` to fetch the oleans for that revision.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"
