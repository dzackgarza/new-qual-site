name: Deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    needs: qc-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f
        with:
          packages: scheme-full
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: true
      - name: Install pdf2svg
        run: |
          sudo apt-get update
          sudo apt-get install -y pdf2svg
      - name: Checkout pandoc-config (tikzcd filter, templates, styles)
        run: 'git clone https://github.com/dzackgarza/pandoc-config.git ~/.pandoc

'
      - name: Install Python and project deps
        run: uv sync --frozen
      - name: Build catalog and static site
        run: uv run qualc build
      - name: Crawl every reachable internal link
        run: uv run python tools/crawl.py --links-only
      - name: Stamp the revision the deployed site was built from
        run: echo "$GITHUB_SHA" > build/quarto/_site/revision.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/quarto/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f
        with:
          packages: scheme-full
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install pdf2svg
        run: |
          sudo apt-get update
          sudo apt-get install -y pdf2svg
      - name: Checkout pandoc-config (tikzcd filter, templates, styles)
        run: 'git clone https://github.com/dzackgarza/pandoc-config.git ~/.pandoc

'
      - name: Install Python and project deps
        run: uv sync --frozen
      - name: Record report revision
        run: git rev-parse HEAD > corpus-reports-revision.txt
      - name: Generate corpus reports
        run: just _reports-ci
      - name: Upload corpus reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-reports
          path: 'BACKLOG.md

            queues/C-unsolved-cards.md

            corpus-reports-revision.txt'
          if-no-files-found: error
  qc-ci:
    uses: dzackgarza/ai-review-ci/.github/workflows/_qc.yml@main
    permissions:
      contents: read
      issues: read
    with:
      tier: test-ci
      enforcement: correctness
      profile: python
      infra_ref: main
      setup_recipe: _ci-setup
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
