name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # The corpus's invariants were unchecked in CI: this workflow ran `qualc build`
  # and nothing else, so a pushed violation deployed. Tests gate the build now.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          pandoc-version: 3.10.2
      - name: Install LaTeX and pdf2svg
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures pdf2svg
      - name: Checkout pandoc-config (tikzcd filter, templates, styles)
        run: |
          git clone https://github.com/dzackgarza/pandoc-config.git ~/.pandoc
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - name: Install Python and project deps
        run: uv sync --frozen
      - name: Run the test suite
        run: uv run --group dev pytest -q
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          pandoc-version: 3.10.2
      - name: Install LaTeX and pdf2svg
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures pdf2svg
      - name: Checkout pandoc-config (tikzcd filter, templates, styles)
        run: |
          git clone https://github.com/dzackgarza/pandoc-config.git ~/.pandoc
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - name: Install Python and project deps
        run: uv sync --frozen
      - name: Build catalog and static site
        run: uv run qualc build
      - name: Crawl every reachable internal link
        run: uv run python tools/crawl.py --links-only
      - name: Stamp the revision the deployed site was built from
        run: echo "$GITHUB_SHA" > build/quarto/_site/revision.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/quarto/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
