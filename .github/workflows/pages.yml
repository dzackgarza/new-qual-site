name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    # Quarto bundles pandoc, which qualc build also needs.
    - uses: quarto-dev/quarto-actions/setup@v2

    - name: Install Python and project deps
      run: uv sync --frozen

    - name: Build catalog and Quarto inputs
      run: uv run qualc build

    - name: Render site
      run: quarto render build/quarto

    - name: Copy wiki into rendered site
      run: |
        cp -r site/_site/wiki build/quarto/_site/wiki
        cp -r site/_site/vendor build/quarto/_site/vendor

    - uses: actions/upload-pages-artifact@v3
      with:
        path: build/quarto/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
