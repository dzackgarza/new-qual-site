[project]
name = "qualc"
version = "0.1.0"
description = "Compiler: markdown card corpus -> semantic index -> renderer inputs"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "panflute>=2.3"]

[project.scripts]
qualc = "qualc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/qualc"]

[dependency-groups]
dev = ["pytest>=8", "types-PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` holds the importers as scripts, not a package. Most tests shell out
# to them; a test that imports one directly needs them importable, and this is
# pytest's own way to say so -- a `sys.path.insert` would need an import below
# it and trip E402.
pythonpath = ["tools"]
markers = [
  "needs_source_clones: reads the source repos on disk; CI deselects it by name because it has no clones, and G9's archive gate runs it against fresh ones",
]
