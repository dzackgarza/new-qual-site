[project]
name = "qualc"
version = "0.1.0"
description = "Compiler: markdown card corpus -> semantic index -> renderer inputs"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "panflute>=2.3",
    "httpx>=0.28.1",
    "pagefind[bin]==1.5.2",
    "psutil>=7",
]

[project.scripts]
qualc = "qualc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/qualc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "types-psutil>=7.2.2.20260906",
    "types-PyYAML>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` is not a package. Tests that import `sync_macros` need that
# directory on the path; pytest's `pythonpath` is the way to say so -- a
# `sys.path.insert` would need an import below it and trip E402.
pythonpath = ["tools"]
# Whole files per worker: a module fixture builds its site once, on the worker
# that runs every test reading it.
addopts = ["-n", "auto", "--dist", "loadfile"]
