# Cited textbooks. A registry, not a schema enum: a new book is an entry here,
# never a change to the source union.
#
# This registry says which books a card may name as its source. It does not
# resolve citations: `[@key]` is resolved by citeproc against
# `references.bib`, whose keys are the ones the authored wiki writes.
