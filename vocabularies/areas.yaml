# Exam areas. Open-ended set, so it is a registry — adding one is a data change,
# not a schema change.
- id: algebra
  name: Algebra
- id: real-analysis
  name: Real Analysis
- id: complex-analysis
  name: Complex Analysis
- id: topology
  name: Topology
# UGA's preliminary exam is its own sitting, not a slice of the four quals: it
# ranges over calculus, analysis, and algebra in one paper. 29 source cards
# already carry `source.area: prelim`, which no registry entry matched, so
# every card downstream of them was unclassifiable. The wiki has carried a
# `Prelims` subject branch all along.
- id: prelim
  name: Prelim
# UCSD Math 202 Applied Algebra is a separate exam track from Math 200 Algebra.
# Same institution and term, different paper; sitting identity is
# institution + area + date, so it needs its own area id (not a topic under
# algebra). Matrix analysis / representation theory / combinatorial algebra —
# not numerical analysis.
- id: applied-algebra
  name: Applied Algebra
