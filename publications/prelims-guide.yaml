      - ref: P-FBY23
  - slug: counterexamples
    title: Counterexamples
    parent: GUIDE-PRELIM
    lede: 'Examples distinguish group-theoretic properties, prime and maximal ideals, torsion-free
      and free modules, and continuity and differentiability. Each question asks for an object
      satisfying specified conditions or an argument that no such object exists.'
