  - slug: integration-techniques
    title: Integration Techniques
    parent: limits-and-continuity
    lede: 'Substitution, integration by parts, trigonometric substitution, and partial fractions
      give methods for evaluating the integrals in this section. Polynomial division separates
      the polynomial part of a rational function before partial-fraction decomposition. Trigonometric
      identities can simplify an integrand before integration. Improper integrals require
      limits and convergence analysis.'
