  - slug: multivariable-calculus
    title: Multivariable calculus
    parent: integration-techniques
    lede: >-
      A map $f\colon U\to\RR^m$ on an open set $U\subseteq\RR^n$ is differentiable at $a\in U$
      if there is a linear map $Df(a)\colon\RR^n\to\RR^m$ with
      $\lim_{h\to0}\abs{f(a+h)-f(a)-Df(a)h}/\abs{h}=0$. The function equal to
      $\frac{xy}{x^2+y^2}$ away from the origin and to $0$ at the origin has both partial
      derivatives at the origin and is not continuous there. The chain rule $D(g\circ
      f)(a)=Dg(f(a))\circ Df(a)$ multiplies Jacobian matrices. For $F\colon\RR^n\to\RR$
      continuously differentiable with $\nabla F(a)\ne0$, the gradient $\nabla F(a)$ is
      orthogonal to the tangent space at $a$ of the level set $\{F=F(a)\}$. A line integral
      $\int_CP\,dx+Q\,dy$ is computed from a parametrization of $C$. Green's theorem: for a
      positively oriented, piecewise smooth, simple closed curve $C$ bounding a region $D$,
      and $P,Q$ continuously differentiable on an open set containing $D\cup C$,
      $\oint_CP\,dx+Q\,dy=\iint_D(Q_x-P_y)\,dA$. A continuous vector field on a connected open
      set has path-independent line integrals if and only if it is the gradient of a function.
