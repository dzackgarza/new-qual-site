  - slug: complex-numbers
    title: Complex numbers
    parent: fields-and-galois
    lede: >-
      A nonzero complex number is $z=re^{i\theta}$ with $r=\abs{z}$, and its $n$th roots are
      $r^{1/n}e^{i(\theta+2\pi k)/n}$ for $k=0,\ldots,n-1$: one root multiplied by the $n$th
      roots of unity. The primitive $n$th roots of unity generate the cyclotomic field
      $\QQ(e^{2\pi i/n})$, of degree $\varphi(n)$ over $\QQ$. Cauchy's integral formula: if
      $f$ is holomorphic on an open set containing the closed disc $\abs{z-z_0}\le r$, then
      $f(a)=\frac{1}{2\pi i}\oint_{\abs{z-z_0}=r}\frac{f(z)}{z-a}\,dz$ for $\abs{a-z_0}<r$.
