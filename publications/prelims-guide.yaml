  - slug: linear-algebra
    title: Linear Algebra
    parent: GUIDE-PRELIM
    lede: "Subspaces, bases, and the rank-nullity theorem give dimension calculations. An
      operator is diagonalizable when its vector space has an eigenbasis, equivalently when
      its minimal polynomial splits into distinct linear factors. Rational canonical form
      expresses the invariant factors of the associated polynomial-ring module. When the characteristic
      polynomial splits, Jordan form expresses its elementary divisors. A nilpotent operator
      has minimal polynomial a power of the variable."
