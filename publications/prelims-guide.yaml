  - slug: rings-and-modules
    title: Rings and Modules
    parent: groups
    lede: >-
      A ring question on this paper is usually a question about its ideals: which are prime,
      which are maximal, and what the quotient looks like. The chain of domains is what
      organizes the rest — every Euclidean domain is principal and every principal ideal domain
      is a unique factorization domain, and the exam asks for the examples separating each
      containment. Modules generalize both vector spaces and abelian groups, and the structure
      theorem over a principal ideal domain is the single result that pays for itself three
      times: it classifies finitely generated abelian groups, it produces the rational canonical
      form of the previous section, and it answers the module questions here directly.
