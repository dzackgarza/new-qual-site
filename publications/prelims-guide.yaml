  - slug: groups
    title: Groups
    parent: logic-and-proof
    lede: >-
      Group theory on this paper is almost entirely about finite groups and about one question:
      given an order, what are the groups of that order? Lagrange bounds the possible subgroup
      orders and its converse fails, which the exam asks for by counterexample. Sylow's
      theorems supply what Lagrange cannot — existence, conjugacy, and a congruence on the
      count — and the standard argument of order pq is the exam's favourite application. The
      abelian case is settled completely by the structure theorem, which is why listing the
      abelian groups of a given order is a routine question and listing all groups of that
      order is not. Automorphism groups and semidirect products are how the nonabelian
      examples get built once the abelian ones are exhausted.
