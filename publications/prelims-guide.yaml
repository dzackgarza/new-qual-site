  - slug: linear-algebra
    title: Linear Algebra
    parent: GUIDE-PRELIM
    lede: >-
      The exam's linear algebra runs from the subspace test to canonical forms in a single
      arc, and the later algebra sections assume all of it. A subspace is checked by closure, a
      span is cut down to a basis by discarding dependent vectors, and the rank-nullity theorem
      is what converts either into a dimension count. Eigenvalues come from the characteristic
      polynomial and diagonalizability from whether the eigenvectors span, which is the same
      question as whether the minimal polynomial is squarefree — the exam asks it both ways.
      The canonical forms close the section: rational canonical form is the invariant-factor
      statement about a linear operator, Jordan form is the elementary-divisor statement over a
      field with enough roots, and nilpotence is the case where the only eigenvalue is zero.
