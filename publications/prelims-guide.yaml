  - slug: limits-and-continuity
    title: Limits and Continuity
    parent: logic-and-proof
    lede: >-
      With quantifiers in hand the epsilon-delta definition is readable, and the exam asks for
      it in the strict form: state the definition, then produce a delta for a specific function
      and limit. The deltas wanted here are the ones a candidate can find by bounding the
      offending factor on a small interval first, which is why the answers so often look like
      the minimum of a constant and a root of epsilon. Continuity is the same definition with
      the value of the limit pinned to the value of the function, and the counterexamples asked
      for — continuous but not differentiable, differentiable but not continuously so — are how
      the exam checks that the definitions are held apart rather than blurred.
    items:
