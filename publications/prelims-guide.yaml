  - slug: rings-and-modules
    title: Rings and modules
    parent: groups
    lede: >-
      For an ideal $I$ of a commutative ring $R$ with $1$, $I$ is prime if and only if $R/I$
      is an integral domain, and maximal if and only if $R/I$ is a field. Every Euclidean
      domain is a principal ideal domain, and every principal ideal domain is a unique
      factorization domain. $\ZZ[(1+\sqrt{-19})/2]$ is a principal ideal domain that is not
      Euclidean, and $\ZZ[x]$ is a unique factorization domain that is not a principal ideal
      domain. A module over a field is a vector space, and a $\ZZ$-module is an abelian group.
      The structure theorem for finitely generated modules over a principal ideal domain
      classifies the finitely generated abelian groups for $R=\ZZ$; for $R=F[x]$, acting on a
      finite-dimensional vector space through an operator $T$, it gives the rational canonical
      form of $T$ ([linear algebra](linear-algebra.html)).
