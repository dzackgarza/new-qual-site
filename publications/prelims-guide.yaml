  - slug: sequences-and-series
    title: Sequences and Series
    parent: limits-and-continuity
    lede: >-
      A series is a sequence of partial sums, so the convergence tests are the section's whole
      content and the exam asks which one applies and why. The recurring question is the set of
      real numbers for which a power series converges, which is the ratio test followed by a
      separate argument at each endpoint — the endpoints are where the marks are. Taylor series
      appear both as an expansion to be computed and as an approximation whose error must be
      bounded. Uniform convergence is the one idea here that is not about numbers: it is the
      negation exercise of the first section applied to a sequence of functions, and it is what
      makes the interchange of a limit with an integral legitimate.
