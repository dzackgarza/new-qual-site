  - slug: linear-algebra
    title: Linear algebra
    parent: GUIDE-PRELIM
    lede: >-
      A nonempty subset of a vector space $V$ over a field $F$ is a subspace if it is closed
      under addition and scalar multiplication. Every finite spanning set of $V$ contains a
      basis, and for a linear map $T\colon V\to W$ with $V$ finite-dimensional, $\dim\ker
      T+\dim\im T=\dim V$. The eigenvalues of an operator $T$ on $V$ are the roots in $F$ of
      its characteristic polynomial $\det(xI-T)$. The operator $T$ is diagonalizable if and
      only if $V$ has a basis of eigenvectors of $T$, if and only if the minimal polynomial of
      $T$ is a product of distinct monic linear factors in $F[x]$. The rational canonical form
      of $T$ is the block diagonal matrix of the companion matrices of its invariant factors
      and exists over every field; the Jordan form is determined by the elementary divisors
      and exists when the characteristic polynomial splits over $F$. A nilpotent operator on
      an $n$-dimensional space has characteristic polynomial $x^n$, and its Jordan form is
      determined by the ranks of its powers.
