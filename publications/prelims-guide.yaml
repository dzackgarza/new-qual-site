  - slug: sequences-and-series
    title: Sequences and Series
    parent: limits-and-continuity
    lede: "A series converges when its sequence of partial sums converges. Comparison, ratio,
      and root tests give convergence criteria. For power series, endpoints of the interval
      of convergence require separate analysis. Taylor polynomials provide approximations
      with remainder estimates. Uniform convergence is a property of sequences of functions
      and, on compact intervals, permits passage of a limit through a Riemann integral."
