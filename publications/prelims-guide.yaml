  - slug: limits-and-continuity
    title: Limits and continuity
    parent: logic-and-proof
    lede: >-
      For $f\colon D\to\RR$ with $D\subseteq\RR$ and $a$ a limit point of $D$, $\lim_{x\to
      a}f(x)=L$ means that for every $\varepsilon>0$ there exists $\delta>0$ such that
      $\abs{f(x)-L}<\varepsilon$ for all $x\in D$ with $0<\abs{x-a}<\delta$. For a polynomial
      $f$, write $f(x)-f(a)=(x-a)g(x)$ with $g$ a polynomial; if $\abs{g}\le C$ on
      $\abs{x-a}<1$, then $\delta=\min(1,\varepsilon/C)$ works. The function $f$ is continuous
      at $a\in D$ if for every $\varepsilon>0$ there exists $\delta>0$ such that
      $\abs{f(x)-f(a)}<\varepsilon$ for all $x\in D$ with $\abs{x-a}<\delta$. The function
      $\abs{x}$ is continuous and not differentiable at $0$, and the function equal to
      $x^2\sin(1/x)$ for $x\ne0$ and to $0$ at $0$ is differentiable on $\RR$ with derivative
      discontinuous at $0$.
