  - slug: multivariable-calculus
    title: Multivariable Calculus
    parent: integration-techniques
    lede: >-
      In several variables differentiability stops being the existence of a limit of difference
      quotients and becomes the existence of a linear map approximating the increment; the exam
      asks for that definition and then for the standard example whose partials both exist at
      the origin while the function is not even continuous there. The chain rule, the Jacobian,
      and the fact that the gradient is orthogonal to a level set are the computational
      consequences it asks to see derived. Line integrals are the section's other half, and the
      three questions asked about them are the same three every time: compute it by
      parametrizing, compute it again by Green's theorem, and decide whether it is
      path-independent — which is to ask whether the field is conservative.
