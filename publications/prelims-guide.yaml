  - slug: limits-and-continuity
    title: Limits and Continuity
    parent: logic-and-proof
    lede: 'The epsilon-delta definition specifies how a bound on the input controls a bound
      on the output. Estimates on a fixed neighborhood can give an explicit delta. Continuity
      at a point requires the limit to equal the function value there. Examples distinguish
      continuity, differentiability, and continuity of the derivative.'
