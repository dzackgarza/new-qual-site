  - slug: groups
    title: Groups
    parent: logic-and-proof
    lede: "Lagrange's theorem constrains subgroup orders but its converse need not hold. Sylow's
      theorems give existence and conjugacy of subgroups of maximal prime-power order, together
      with constraints on their number. The structure theorem classifies finite abelian groups.
      Actions by automorphisms define semidirect products and provide nonabelian examples."
