schema: qual/publication@2
id: GUIDE-PRELIM
kind: study-guide
title: Prelim
lede: >-
  UGA's preliminary exam is one paper, not a slice of the four quals: it asks for the
  calculus, linear algebra, and algebra a first-year student is expected to have before any
  qual is attempted. This guide follows that paper's own order — first what a proof is and
  how a statement is negated, then limits and the two operations built on them, then the
  linear algebra the algebra sections quietly assume, and finally groups, rings, and fields.
  Every item is a problem that was actually set or worked; there is no theory layer here,
  because the exam does not test one.
sections:
  - slug: logic-and-proof
    title: Logic and Proof
    parent: GUIDE-PRELIM
    lede: >-
      The paper opens on the mechanics of mathematical statements rather than on any subject,
      and that is deliberate: a candidate who cannot negate a quantified sentence cannot state
      what a limit failing to exist means. Negation of nested quantifiers is asked directly and
      repeatedly, along with the converse and contrapositive, which are the two ways a true
      implication is most often misremembered. Injectivity and surjectivity are the first place
      those quantifiers get used on an object rather than a sentence, and equivalence relations
      are where they get used on a set. Induction closes the section as the one proof technique
      the exam expects by name, usually on a sum or a divisibility claim, and the counting
      formulas are its most common companion.
