  - slug: complex-numbers
    title: Complex Numbers
    parent: fields-and-galois
    lede: "Polar form expresses multiplication and extraction of roots through moduli and
      arguments. The roots of a nonzero complex number differ by roots of unity, connecting
      these calculations with cyclotomic extensions. The section also includes a Cauchy-integral-formula
      problem."
