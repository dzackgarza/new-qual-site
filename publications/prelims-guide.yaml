  by subject."
sections:
  - slug: logic-and-proof
    title: Logic and Proof
    parent: GUIDE-PRELIM
    lede: 'Logical negation interchanges universal and existential quantifiers. An implication
      is equivalent to its contrapositive, but need not imply its converse. The problems apply
      quantifiers to injectivity, surjectivity, and equivalence relations, and use induction
      in identities and divisibility arguments.'
