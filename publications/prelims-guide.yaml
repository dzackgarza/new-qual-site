  - slug: complex-numbers
    title: Complex Numbers
    parent: fields-and-galois
    lede: >-
      The paper's complex content is small and computational: put a complex number in polar
      form, take its roots, and write them back as a plus bi. Those roots are the roots of
      unity scaled and rotated, which is where this section meets the cyclotomic extensions of
      the previous one. One question goes further and asks for the Cauchy integral formula and
      a contour integral evaluated both by the formula and by direct parametrization, which is
      the only place the exam touches complex analysis proper.
    items:
