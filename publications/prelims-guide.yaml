      - ref: P-OQW4B
      - ref: P-Q5LN7
      - ref: P-FBY23
  - slug: counterexamples
    title: Counterexamples
    parent: GUIDE-PRELIM
    lede: >-
      A recurring instruction on this paper is "give an example or explain why none exists",
      and it is the most efficient question on it: one line of an answer distinguishes a
      candidate who knows a definition from one who knows what the definition rules out. These
      are collected here because they belong to no single subject — the same instruction is
      applied to a non-abelian group whose proper subgroups are all normal, to a prime ideal
      that is not maximal, to a module that is torsion-free and not free, and to a function
      that is continuous at a point and differentiable nowhere near it. Reading them together
      is the fastest revision the archive supports.
    items:
      - query:
          kind: problem
          topics:
            - counterexamples
          limit: 16
          review:
            mode: any
