  - slug: rings-and-modules
    title: Rings and Modules
    parent: groups
    lede: 'Prime and maximal ideals are characterized by their quotient rings being domains
      and fields, respectively. Every Euclidean domain is a principal ideal domain, and every
      principal ideal domain is a unique factorization domain. Examples distinguish the converse
      implications. The structure theorem for finitely generated modules over a principal
      ideal domain specializes to finitely generated abelian groups and to [canonical forms
      of linear operators](linear-algebra.html).'
