  - slug: sequences-and-series
    title: Sequences and series
    parent: limits-and-continuity
    lede: >-
      A series $\sum a_n$ converges when its sequence of partial sums $s_N=\sum_{n\le N}a_n$
      converges, and convergence forces $a_n\to0$. The comparison, limit comparison, ratio,
      root, integral, and alternating series tests decide convergence for the standard
      examples. A power series $\sum c_n(x-a)^n$ converges absolutely for $\abs{x-a}<R$ and
      diverges for $\abs{x-a}>R$, where $1/R=\limsup_n\abs{c_n}^{1/n}$; the ratio test gives
      $R=\lim_n\abs{c_n/c_{n+1}}$ when that limit exists, and each endpoint $x=a\pm R$ is
      decided separately. Taylor's theorem: if $f$ has $n+1$ derivatives on an interval
      containing $a$ and $x$, then
      $f(x)=\sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-a)^{n+1}$
      for some $\xi$ between $a$ and $x$, which bounds the error of the Taylor polynomial. A
      sequence $f_n\colon D\to\RR$ converges uniformly to $f$ if $\sup_{x\in
      D}\abs{f_n(x)-f(x)}\to0$; if each $f_n$ is Riemann integrable on $[a,b]$ and $f_n\to f$
      uniformly on $[a,b]$, then $f$ is Riemann integrable and $\int_a^bf_n\to\int_a^bf$.
