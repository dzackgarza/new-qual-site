  - slug: fields-and-galois
    title: Fields and Galois Theory
    parent: rings-and-modules
    lede: The degree of a field extension is its vector-space dimension, and degrees
      multiply in finite towers. Splitting fields and their automorphisms describe
      polynomial roots. Finite-field Galois groups are cyclic and generated by
      Frobenius. Factorization over finite fields can be studied using greatest common
      divisors with polynomials of the form $x^{q^n}-x$.
