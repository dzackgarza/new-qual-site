  - slug: fields-and-galois
    title: Fields and Galois Theory
    parent: rings-and-modules
    lede: >-
      A field extension is a vector space over the base field, so the degree is a dimension and
      the tower law is multiplicativity of dimension — that one observation answers a large
      share of these questions. The splitting field of an explicit cubic or quartic is asked
      for repeatedly, together with its degree and its Galois group, and the group is pinned
      down by how the roots may be permuted rather than by computing anything. Finite fields
      are the case where the whole theory collapses to one cyclic Galois group generated by
      Frobenius, which is why irreducibility over a finite field can be tested by a greatest
      common divisor. Number-theoretic questions sit here because they are the same arguments
      run in a ring of integers.
    items:
