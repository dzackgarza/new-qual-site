  - slug: integration-techniques
    title: Integration Techniques
    parent: limits-and-continuity
    lede: >-
      The largest single block of the archive is indefinite and definite integrals, and it is
      drilled rather than reasoned: the exam expects the technique to be recognized on sight.
      Four techniques cover nearly all of them. Substitution handles any integrand carrying its
      own derivative as a factor. Parts handles a product where one factor differentiates down
      to nothing, and the same computation run twice recovers the integral of the secant cube
      and of the exponential against a sine. Trigonometric substitution handles the three
      quadratic radicals, and partial fractions handles a proper rational function once long
      division has made it proper. The trigonometric identities are listed alongside because
      half of these integrals are an identity applied before any technique at all, and the
      improper cases are separated out because they need a limit the others do not.
