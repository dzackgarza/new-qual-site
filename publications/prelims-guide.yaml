  - slug: fields-and-galois
    title: Fields and Galois theory
    parent: rings-and-modules
    lede: >-
      For fields $K\subseteq L$, $L$ is a vector space over $K$ and $[L:K]=\dim_KL$; for
      $K\subseteq L\subseteq M$, $[M:K]=[M:L][L:K]$. For $\alpha$ algebraic over $K$ with
      minimal polynomial $m_\alpha$, $[K(\alpha):K]=\deg m_\alpha$. For a separable polynomial
      $f\in K[x]$ of degree $n$ with splitting field $L$, the Galois group $\Gal(L/K)$ acts
      faithfully on the roots of $f$, so it embeds in $S_n$, and it acts transitively when $f$
      is irreducible. The extension $\FF_{p^n}/\FF_p$ is Galois, with cyclic Galois group of
      order $n$ generated by the Frobenius map $x\mapsto x^p$. The polynomial $x^{p^n}-x$ is
      the product of the monic irreducible polynomials over $\FF_p$ whose degree divides $n$;
      hence a polynomial $f\in\FF_p[x]$ of degree $n$ is irreducible if and only if $f$
      divides $x^{p^n}-x$ and $\gcd\big(f,x^{p^{n/q}}-x\big)=1$ for every prime $q$ dividing
      $n$.
