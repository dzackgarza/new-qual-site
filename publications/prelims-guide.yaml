schema: qual/publication@2
id: GUIDE-PRELIM
kind: study-guide
title: Prelim
lede: >-
  Preliminary-exam problems in calculus, linear algebra, and abstract algebra: logic and
  proof, limits and continuity, integration, sequences and series, multivariable calculus,
  linear algebra, groups, rings and modules, fields and Galois theory, complex numbers,
  and counterexamples.
sections:
  - slug: logic-and-proof
    title: Logic and proof
    parent: GUIDE-PRELIM
    lede: >-
      The negation of $\forall x\,\exists y\,P(x,y)$ is $\exists x\,\forall y\,\neg P(x,y)$.
      An implication $P\Rightarrow Q$ is equivalent to its contrapositive $\neg
      Q\Rightarrow\neg P$, and in general not to its converse $Q\Rightarrow P$. A map $f\colon
      X\to Y$ is injective if $f(x)=f(x')$ implies $x=x'$ for all $x,x'\in X$, and surjective
      if for every $y\in Y$ there exists $x\in X$ with $f(x)=y$. An equivalence relation on a
      set $X$ determines the partition of $X$ into its equivalence classes, and every
      partition of $X$ arises from exactly one equivalence relation. Induction proves $P(n)$
      for all integers $n\ge n_0$ from $P(n_0)$ and the implications $P(n)\Rightarrow P(n+1)$;
      the problems apply it to summation identities, divisibility statements, and counting
      formulas such as $\binom{n}{k}=\binom{n-1}{k-1}+\binom{n-1}{k}$.
