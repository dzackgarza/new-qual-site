  - slug: multivariable-calculus
    title: Multivariable Calculus
    parent: integration-techniques
    lede: "Differentiability requires a linear approximation to the increment of a function;
      existence of partial derivatives alone does not suffice. The chain rule describes compositions
      of derivatives, and gradients are normal to regular level sets. Line integrals can be
      evaluated by parametrization. Green's theorem relates a planar boundary integral to
      an integral over its interior. Conservative vector fields give path-independent integrals."
