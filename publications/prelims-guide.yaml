  - slug: groups
    title: Groups
    parent: logic-and-proof
    lede: >-
      Lagrange's theorem: for a subgroup $H$ of a finite group $G$, $\abs{H}$ divides
      $\abs{G}$. The converse fails: $A_4$ has order $12$ and no subgroup of order $6$. Let
      $\abs{G}=p^km$ with $p$ prime and $p\nmid m$. The Sylow theorems state that $G$ has a
      subgroup of order $p^k$, that any two such subgroups are conjugate, and that their
      number $n_p$ divides $m$ and satisfies $n_p\equiv1\pmod{p}$; a Sylow $p$-subgroup is
      normal if and only if $n_p=1$. For primes $p<q$ with $p\nmid q-1$, these conditions make
      every group of order $pq$ cyclic. By the structure theorem, a finite abelian group is a
      direct product of cyclic groups of prime-power order, unique up to the order of the
      factors, so the abelian groups of order $\prod_ip_i^{e_i}$ correspond to choices of a
      partition of each $e_i$. For groups $H$ and $K$ and a homomorphism $\varphi\colon
      K\to\Aut(H)$, the semidirect product $H\rtimes_\varphi K$ is nonabelian whenever
      $\varphi$ is nontrivial.
