  - slug: integration-techniques
    title: Integration techniques
    parent: limits-and-continuity
    lede: >-
      Substitution, $\int f(g(x))g'(x)\,dx=\int f(u)\,du$ with $u=g(x)$, applies when the
      integrand contains the derivative of an inner function as a factor. Integration by
      parts, $\int u\,dv=uv-\int v\,du$, applies to products such as $x^ne^x$ and $x^n\sin x$;
      applied twice to $\int e^{ax}\sin bx\,dx$, or once to $\int\sec^3x\,dx$, it returns a
      multiple of the original integral, which is then solved for. The substitutions
      $x=a\sin\theta$, $x=a\tan\theta$, and $x=a\sec\theta$ remove the radicals
      $\sqrt{a^2-x^2}$, $\sqrt{a^2+x^2}$, and $\sqrt{x^2-a^2}$. A rational function is
      integrated by polynomial division followed by the partial fraction decomposition of the
      proper remainder. Identities such as $\sin^2x=\frac{1-\cos 2x}{2}$ reduce powers of sine
      and cosine. An improper integral is a limit of proper integrals, such as $\int_a^\infty
      f=\lim_{b\to\infty}\int_a^bf$, and $\int_1^\infty x^{-p}\,dx$ converges if and only if
      $p>1$.
