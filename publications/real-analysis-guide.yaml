  - slug: measure-and-measurable-functions
    title: Measure and Measurable Functions
    parent: GUIDE-REAL-ANALYSIS
    lede: 'The Carathéodory condition defines a sigma-algebra on which an outer measure restricts
      to a measure. For Lebesgue measure, approximation by open and closed sets gives criteria
      for measurability. Measurable real-valued functions can be characterized by measurable
      sublevel sets, and pointwise limits of measurable functions are measurable. Egorov''s
      theorem gives almost-uniform convergence on finite-measure spaces; Lusin''s theorem
      gives continuous restrictions outside sets of small measure under regularity hypotheses.
      The first Borel–Cantelli lemma turns a summable sequence of event measures into an almost-everywhere
      finiteness statement.'
    topics:
      - Measure Theory
      - Borel-Cantelli
      - Egorov
      - Continuity of Measure
      - Absolute Continuity
      - Radon-Nikodym
