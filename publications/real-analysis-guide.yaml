  - slug: lp-spaces
    title: Lp Spaces and Convolution
    parent: the-lebesgue-integral
    lede: 'For $1\leq p\leq\infty$, Minkowski''s inequality gives the triangle inequality
      and the Riesz–Fischer theorem gives completeness of $L^p$. Hölder''s inequality controls
      products. On a finite-measure space, $L^q$ embeds in $L^p$ for $p\leq q$, and for bounded
      $f$ on a nonzero finite-measure space, $\|f\|_p$ tends to $\|f\|_\infty$ as $p\to\infty$.
      For Lebesgue measure on Euclidean space, Young''s inequality controls convolution and
      translations are continuous in $L^p$ for $p<\infty$. Approximate identities converge
      in these spaces.'
    topics:
      - Lp Spaces
      - L¹
      - L²
      - L∞
      - Norms
      - Function Spaces
      - Convolution
      - Approximations to the Identity
