lede: 'Real analysis: metric spaces, differentiation, integration, measure theory, functional
  analysis, and Fourier analysis.'
sections:
  - slug: sequences-and-series-of-numbers
    title: Sequences and Series of Numbers
    parent: GUIDE-REAL-ANALYSIS
    lede: 'The limit superior and inferior always exist in the extended reals, so an argument
      can record asymptotic upper and lower bounds before ordinary convergence is known. For
      series, convergence forces the terms to zero and the tails to vanish, the comparison,
      root, ratio, and condensation tests all decide convergence by bounding one tail against
      another, and the $p$-test fixes the scale against which those comparisons are made.'
    topics:
      - Sequences of Numbers
      - Series of Numbers
      - Limits
      - Convergence of Numbers
      - Convergence Tests
      - Bernoulli
      - Countability
