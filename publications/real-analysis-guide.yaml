  - slug: continuity
    title: Continuity
    parent: metric-spaces
    lede: 'For maps between metric spaces, continuity can be expressed through sequences,
      inverse images of open sets, or epsilon-delta estimates. A continuous real-valued function
      on a compact space attains its extrema; a continuous map from a compact metric space
      to a metric space is uniformly continuous. On noncompact domains, continuity need not
      imply uniform continuity.'
    topics:
      - Continuity
      - Uniform Continuity
      - Fixed Points
