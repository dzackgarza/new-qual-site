  - slug: continuity
    title: Continuity
    parent: metric-spaces
    lede: >-
      For metric spaces $X$, $Y$ and $f\colon X\to Y$, the following are equivalent: for every
      $x\in X$ and $\varepsilon>0$ there exists $\delta>0$ with $d(f(x),f(y))<\varepsilon$
      whenever $d(x,y)<\delta$; $f(x_n)\to f(x)$ whenever $x_n\to x$; the preimage of every
      open set is open; the preimage of every closed set is closed. If $X$ is compact and $f$
      is continuous, then $f$ is uniformly continuous, $f(X)$ is compact, and for $Y=\RR$, $f$
      attains its maximum and minimum. The functions $x\mapsto x^2$ on $\RR$ and $x\mapsto1/x$
      on $(0,1)$ are continuous and not uniformly continuous.
    topics:
      - Continuity
      - Uniform Continuity
      - Fixed Points
