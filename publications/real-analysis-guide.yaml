  - slug: measure-and-measurable-functions
    title: Measure and measurable functions
    parent: GUIDE-REAL-ANALYSIS
    lede: >-
      Lebesgue outer measure $m^*$ is defined on every subset of $\RR$ and is countably
      subadditive. A set $E$ is measurable if $m^*(A)=m^*(A\cap E)+m^*(A\setminus E)$ for
      every $A\subseteq\RR$ (Carathéodory's condition); the measurable sets form a
      $\sigma$-algebra on which $m^*$ is countably additive. A set $E$ is measurable if and
      only if for every $\varepsilon>0$ there is an open $U\supseteq E$ with $m^*(U\setminus
      E)<\varepsilon$, if and only if for every $\varepsilon>0$ there is a closed $F\subseteq
      E$ with $m^*(E\setminus F)<\varepsilon$. A function $f\colon E\to[-\infty,\infty]$ is
      measurable if $\{x:f(x)>a\}$ is measurable for every $a\in\RR$; suprema, infima, and
      pointwise limits of sequences of measurable functions are measurable. Egorov's theorem:
      if $m(E)<\infty$ and measurable $f_n$ converge almost everywhere on $E$ to a
      finite-valued $f$, then for every $\varepsilon>0$ the convergence is uniform off a set
      of measure less than $\varepsilon$. Lusin's theorem: if $m(E)<\infty$ and $f$ is
      measurable and finite almost everywhere on $E$, then for every $\varepsilon>0$ there is
      a closed $F\subseteq E$ with $m(E\setminus F)<\varepsilon$ and $f|_F$ continuous. The
      Borel--Cantelli lemma: if $\sum_nm(E_n)<\infty$, then almost every $x$ lies in only
      finitely many $E_n$.
    topics:
