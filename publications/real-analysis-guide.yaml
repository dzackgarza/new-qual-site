  - slug: metric-spaces
    title: Metric Spaces, Compactness and Completeness
    parent: sequences-and-series-of-numbers
    lede: 'For metric spaces, compactness is equivalent to sequential compactness and to completeness
      together with total boundedness. The Heine–Borel theorem identifies compact subsets
      of $\mathbb R^n$ as the closed bounded subsets. Closed bounded subsets of $\mathbb Q$
      or of $C([0,1])$ with the uniform norm need not be compact. Baire''s theorem states
      that a countable intersection of open dense subsets of a complete metric space is dense.'
    topics:
      - Metric Spaces
      - Compactness
      - Completeness
      - Closure
      - Connectedness
      - Euclidean Spaces
      - Cantor Set
      - Density
