  - slug: riemann-stieltjes-integration
    title: Riemann-Stieltjes Integration
    parent: differentiation
    lede: >-
      The Stieltjes integral is stated against a general integrator, so the criterion for
      integrability is a statement about upper and lower sums rather than about the
      integrand alone. Integration by parts and the reduction to a Riemann integral are the
      two tools that make it computable; the fundamental theorem and the integral mean value
      theorem then connect it back to the derivative. Lebesgue's criterion closes the section
      by naming exactly which bounded functions are Riemann integrable, which is the sentence
      the measure-theoretic half of the guide is built to prove.
    items:
