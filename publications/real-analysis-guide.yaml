  - slug: fourier-analysis
    title: Fourier Analysis
    parent: hilbert-spaces-and-duality
    lede: >-
      The Fourier transform is the one operator that uses every preceding section: it is
      defined by an integral, bounded on $L^1$, an isometry on $L^2$ by Plancherel, and it
      turns convolution into multiplication. Riemann-Lebesgue is the statement that the
      transform of an $L^1$ function has small tails, which is what forbids an identity for
      convolution. The inversion formula is stated where it holds, and the standard exercises
      ask for the transform of a Gaussian, which is its own eigenfunction, and for the
      failure cases where $\hat f$ leaves $L^1$.
