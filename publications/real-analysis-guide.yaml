  - slug: fourier-analysis
    title: Fourier analysis
    parent: hilbert-spaces-and-duality
    lede: >-
      For $f\in L^1(\RR)$, $\hat f(\xi)=\int_\RR f(x)e^{-2\pi ix\xi}\,dx$ is continuous with
      $\norm{\hat f}_\infty\le\norm{f}_1$, and $\widehat{f*g}=\hat f\,\hat g$ for $f,g\in
      L^1(\RR)$. The Riemann--Lebesgue lemma: $\hat f(\xi)\to0$ as $\abs{\xi}\to\infty$; since
      the transform of a convolution identity would be the constant $1$, $L^1(\RR)$ has no
      convolution identity. Plancherel's theorem: the Fourier transform on $L^1\cap L^2$
      extends to a unitary operator on $L^2(\RR)$. The inversion theorem: if $f\in L^1$ and
      $\hat f\in L^1$, then $f(x)=\int_\RR\hat f(\xi)e^{2\pi ix\xi}\,d\xi$ for almost every
      $x$. The Gaussian $e^{-\pi x^2}$ is its own Fourier transform, and the transform of
      $\chi_{[-1,1]}$ is $\frac{\sin 2\pi\xi}{\pi\xi}$, which is not in $L^1$.
    topics:
      - Fourier Analysis
