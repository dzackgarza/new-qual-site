id: GUIDE-REAL-ANALYSIS
kind: study-guide
title: Real Analysis
lede: 'The qualifying exam syllabus in real analysis: metric topology, sequences, continuity, differentiation, Riemann-Stieltjes integration, Lebesgue measure, convergence theorems, $L^p$ spaces and duality, and Fourier analysis.'
sections:
  - slug: sequences-and-series-of-numbers
    title: Sequences and series of numbers
    parent: GUIDE-REAL-ANALYSIS
    lede: >-
      For a real sequence $(a_n)$, $\limsup_na_n$ and $\liminf_na_n$ exist in
      $[-\infty,\infty]$, and $(a_n)$ converges if and only if they are equal and finite. If
      $\sum_na_n$ converges, then $a_n\to0$ and the tails $\sum_{n>N}a_n$ tend to $0$. The
      comparison, root, and ratio tests, and for nonincreasing nonnegative terms the Cauchy
      condensation test, decide convergence by comparison with a series of known behaviour,
      and $\sum_nn^{-p}$ converges if and only if $p>1$.
    topics:
      - Sequences of Numbers
      - Series of Numbers
      - Limits
      - Convergence of Numbers
      - Convergence Tests
      - Bernoulli
      - Countability
