  - slug: riemann-stieltjes-integration
    title: Riemann-Stieltjes Integration
    parent: differentiation
    lede: Riemann–Stieltjes upper and lower sums depend on both the integrand and the
      integrator. Integration by parts and, for a continuously differentiable
      integrator, reduction to a Riemann integral give methods of evaluation. The
      fundamental theorem of calculus relates integration and differentiation.
      Lebesgue's criterion characterizes Riemann integrability of a bounded function on
      a compact interval by the measure of its discontinuity set.
    topics:
      - Riemann Integrability
