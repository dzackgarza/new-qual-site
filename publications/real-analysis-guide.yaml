  - slug: differentiation
    title: Differentiation
    parent: continuity
    lede: At an interior local extremum, a differentiable real-valued function has
      derivative zero. The Mean Value Theorem relates a difference quotient to a
      derivative at an intermediate point. Taylor's theorem expresses a function as a
      polynomial plus a remainder. Functions of bounded variation have derivatives
      almost everywhere, but recovering the function by integrating its derivative
      requires absolute continuity. The related integration results appear in
      [Riemann-Stieltjes Integration](riemann-stieltjes-integration.html) and [Sequences
      and Series of Functions](sequences-and-series-of-functions.html).
    topics:
      - Differentiation
      - Mean Value Theorem
      - Variation
      - Calculus
