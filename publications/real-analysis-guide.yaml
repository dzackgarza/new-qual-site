- slug: hilbert-spaces-and-duality
  title: Hilbert Spaces and Duality
  parent: lp-spaces
  lede: '$L^2$ is the one $L^p$ whose norm comes from an inner product, and that single
    fact supplies orthogonal projection, Bessel''s inequality, and the identification
    of the space with $\ell^2$ through any complete orthonormal set. Riesz representation
    makes the dual of a Hilbert space the space itself, and for $L^p$ with $p$ finite
    it makes the dual $L^q$; the failure at $p=\infty$ is worth knowing precisely.
    The four standard theorems of Banach space theory -- Hahn-Banach, uniform boundedness,
    open mapping, closed graph -- are collected here because the exam problems that
    use them state their hypotheses in $L^p$ or $\ell^p$ terms. Weak convergence appears
    last: the unit ball is not norm-compact in infinite dimensions, and weak convergence
    is what replaces the missing subsequence.'
