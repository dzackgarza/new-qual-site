  - slug: fourier-analysis
    title: Fourier Analysis
    parent: hilbert-spaces-and-duality
    lede: 'The Fourier transform combines [Lebesgue integration](the-lebesgue-integral.html),
      [convolution](lp-spaces.html), and [Hilbert-space methods](hilbert-spaces-and-duality.html).
      It is bounded from $L^1$ to bounded continuous functions, and Riemann–Lebesgue states
      that these transforms vanish at infinity. With the corresponding normalization, Plancherel
      extends the transform to an isometry on $L^2$. Fourier inversion requires its stated
      integrability hypotheses. Examples include Gaussians and functions whose transforms
      are not integrable.'
    topics:
      - Fourier Analysis
