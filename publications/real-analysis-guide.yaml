  - slug: the-lebesgue-integral
    title: The Lebesgue Integral
    parent: measure-and-measurable-functions
    lede: "The integral of a nonnegative measurable function is the supremum of the integrals
      of simple functions below it. Monotone convergence, Fatou's lemma, and dominated convergence
      give conditions for passing limits through integrals or comparing their values. Tonelli's
      theorem applies to nonnegative functions; Fubini's theorem applies to integrable functions,
      with the hypotheses on the measure spaces stated in each theorem. Chebyshev's inequality
      bounds level-set measures in terms of integrals."
    topics:
      - Integrals
      - Convergence of Integrals
      - Fatou
      - Fubini-Tonelli
      - Small Tails
      - Maximal Functions
