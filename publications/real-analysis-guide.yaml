  - slug: differentiation
    title: Differentiation
    parent: continuity
    lede: >-
      Differentiation is where attained extrema become a computational tool. Fermat turns an
      interior extremum into a vanishing derivative, the Mean Value Theorem turns that into
      control of the function across an interval, and Taylor's theorem makes the control
      quantitative by naming the remainder. Almost every exam problem in this section is the
      Mean Value Theorem applied once and then estimated. Bounded variation appears here
      because it is the class on which a derivative can still be integrated back, which is
      what the next two sections need.
