  - slug: the-lebesgue-integral
    title: The Lebesgue Integral
    parent: measure-and-measurable-functions
    lede: >-
      The integral is defined by supremum over simple functions below the integrand, so
      monotone convergence is nearly a restatement of the definition, and Fatou and dominated
      convergence follow from it. These three are the section's whole content: essentially
      every exam problem asking for a limit of integrals is an application of one of them,
      and the counterexamples show what happens when the dominating hypothesis is dropped.
      Fubini and Tonelli exchange the order of a double integral under integrability and
      non-negativity respectively, and the distinction between those hypotheses is itself
      examined. Chebyshev's inequality and the vanishing of small tails are the two estimates
      that make the rest quantitative.
