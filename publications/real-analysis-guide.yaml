schema: qual/publication@2
id: GUIDE-REAL-ANALYSIS
kind: study-guide
title: Real Analysis
lede: 'Follow one dependency-ordered path across the subject as the qualifying exams
  pose it. The first half is the single-variable core: what a sequence of numbers
  can do, what compactness buys a continuous function, what differentiation extracts
  from it, what the Riemann-Stieltjes integral accumulates, and which of those properties
  survive a limit of functions. The second half rebuilds the integral on a measure
  and asks the same questions again, where the answers are the convergence theorems,
  the $L^p$ spaces and their duals, and the Fourier transform.'
sections:
- slug: sequences-and-series-of-numbers
  title: Sequences and Series of Numbers
  parent: GUIDE-REAL-ANALYSIS
  lede: 'Everything later is a limit of something, so the path starts where limits
    are only about numbers. The limit superior and inferior always exist in the extended
    reals, which is what lets an argument name a limit before proving it exists. For
    series the subject is really a subject about the tails: convergence forces the
    terms to zero and the tails to vanish, the comparison, root, ratio, and condensation
    tests all decide convergence by bounding one tail against another, and the $p$-test
    fixes the scale against which those comparisons are made.'
  items:
  - ref: D-HOKQD
  - ref: PR-IGVTV
  - ref: PR-6C3GQ
  - ref: PR-P6NHI
  - ref: PR-4EVYE
  - ref: PR-6OHTJ
