  - slug: hilbert-spaces-and-duality
    title: Hilbert Spaces and Duality
    parent: lp-spaces
    lede: 'The $L^2$ inner product gives orthogonal projections, Bessel''s inequality, and
      expansion in an orthonormal basis. Riesz representation identifies continuous linear
      functionals on a Hilbert space. On a sigma-finite measure space, the dual of $L^p$ for
      $1\leq p<\infty$ is represented by $L^q$, where $1/p+1/q=1$; the dual of $L^\infty$
      need not be represented by $L^1$. Hahn–Banach, uniform boundedness, the open mapping
      theorem, and the closed graph theorem apply to Banach spaces. In an infinite-dimensional
      Hilbert space the closed unit ball is weakly compact but not norm-compact.'
    topics:
      - Hilbert Spaces
      - Inner Product Spaces
      - Bases
      - Riesz Representation
      - Dual Spaces
      - Functional Analysis
      - Weak Convergence
      - Open Mapping Theorem
