- slug: sequences-and-series-of-functions
  title: Sequences and Series of Functions
  parent: riemann-stieltjes-integration
  lede: 'Every property established so far is a property of one function, and the
    question here is which of them a limit inherits. Separating pointwise from uniform
    convergence is what makes that question answerable. Uniform convergence preserves
    continuity and commutes with the integral, differentiability needs the stronger
    hypothesis on the derivatives, and the Weierstrass M-test is how uniform convergence
    is usually established in practice. Arzela-Ascoli and Stone-Weierstrass close
    the section from opposite directions, one saying which families are compact and
    the other which are dense. The counterexample cards are load-bearing here: the
    four standard modes of convergence are pairwise incomparable, and each failure
    has a standard witness.'
  items:
