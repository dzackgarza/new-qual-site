  - slug: lp-spaces
    title: Lp Spaces and Convolution
    parent: the-lebesgue-integral
    lede: >-
      Holder and Minkowski make $\|\cdot\|_p$ a norm and the Riesz-Fischer theorem makes it
      complete, so the integral has finally produced a Banach space. Which $L^p$ contains
      which depends on whether the measure is finite, and the $p$-test decides the model
      cases. The essential supremum is the right endpoint at $p=\infty$, and the limit of
      $\|f\|_p$ recovers it. Convolution is the multiplication these spaces carry: Young's
      inequality says which exponents it lands in, and an approximate identity is a family of
      convolvers converging to the identity that $L^1$ itself does not contain. Continuity of
      translation in $L^p$ is the lemma underneath most of these proofs.
    items:
      - ref: D-3PVRB
      - ref: D-MFDEJ
