- slug: measure-and-measurable-functions
  title: Measure and Measurable Functions
  parent: GUIDE-REAL-ANALYSIS
  lede: 'This section opens the second half of the guide and depends on the whole
    of the first: it exists because the Riemann integral of the fifth section fails
    on the limits of the sixth. That dependence is stated here rather than in the
    study-path tree, which indents by depth and becomes unreadable past about seven
    levels. The repair is to replace the partition of the domain by a measure on it.
    Outer measure is defined for every set and is only countably subadditive; the
    Caratheodory condition selects the subfamily on which it is additive, and that
    family is the one closed under the countable operations every later argument performs.
    Measurability of a set is then equivalent to approximation by an open, closed,
    or compact set, which is the form actually used in proofs. A measurable function
    is one whose sublevel sets are measurable, a condition preserved by sups, infs,
    and pointwise limits -- exactly the failure the Riemann theory had. Egorov and
    Lusin bound how far measurable behaviour is from uniform and continuous behaviour,
    and Borel-Cantelli converts a convergent sum of measures into an almost-everywhere
    statement.'
  items:
