  - slug: lp-spaces
    title: $L^p$ spaces and convolution
    parent: the-lebesgue-integral
    lede: >-
      For $1\le p\le\infty$ and $1/p+1/q=1$, Hölder's inequality
      $\norm{fg}_1\le\norm{f}_p\norm{g}_q$ and Minkowski's inequality
      $\norm{f+g}_p\le\norm{f}_p+\norm{g}_p$ make $L^p$ a normed space, and by the
      Riesz--Fischer theorem it is complete. On a finite measure space $L^q\subseteq L^p$ for
      $p\le q$; on $\RR$ there is no inclusion between $L^p$ and $L^q$ for $p\ne q$, as
      $x^{-a}\chi_{(0,1)}$ and $x^{-a}\chi_{(1,\infty)}$ show for suitable $a>0$. The norm
      $\norm{f}_\infty$ is the essential supremum of $\abs{f}$, and if $f\in L^r$ for some
      $r<\infty$, then $\norm{f}_p\to\norm{f}_\infty$ as $p\to\infty$. Young's inequality:
      $\norm{f*g}_r\le\norm{f}_p\norm{g}_q$ for $1\le p,q,r\le\infty$ with $1+1/r=1/p+1/q$.
      For an approximate identity $(\varphi_\varepsilon)$ in $L^1(\RR^n)$ and $f\in
      L^p(\RR^n)$ with $1\le p<\infty$, $\varphi_\varepsilon*f\to f$ in $L^p$, while no $g\in
      L^1(\RR^n)$ satisfies $g*f=f$ for all $f\in L^1(\RR^n)$. For $1\le p<\infty$ and $f\in
      L^p(\RR^n)$, $\norm{f(\cdot+h)-f}_p\to0$ as $h\to0$.
    topics:
