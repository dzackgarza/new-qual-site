  - slug: sequences-and-series-of-functions
    title: Sequences and series of functions
    parent: riemann-stieltjes-integration
    lede: >-
      A sequence $f_n\colon E\to\RR$ converges uniformly to $f$ if $\sup_{x\in
      E}\abs{f_n(x)-f(x)}\to0$. A uniform limit of continuous functions is continuous, and if
      Riemann integrable $f_n$ converge uniformly to $f$ on $[a,b]$, then $f$ is Riemann
      integrable and $\int_a^bf_n\to\int_a^bf$. If the $f_n$ are differentiable on $[a,b]$,
      $(f_n(x_0))$ converges for some $x_0\in[a,b]$, and $(f_n')$ converges uniformly, then
      $(f_n)$ converges uniformly to a differentiable $f$ with $f'=\lim_nf_n'$. The
      Weierstrass M-test: if $\abs{f_n}\le M_n$ on $E$ and $\sum_nM_n<\infty$, then
      $\sum_nf_n$ converges uniformly on $E$. The Arzelà--Ascoli theorem: for a compact metric
      space $K$, a subset of $C(K)$ has compact closure if and only if it is bounded and
      equicontinuous. The Stone--Weierstrass theorem: a subalgebra of $C(K,\RR)$ that contains
      the constants and separates points is dense for the supremum norm. On $[0,1]$, $x^n$
      converges pointwise and not uniformly; $n\chi_{(0,1/n)}$ converges to $0$ at every point
      and not in $L^1$; and the typewriter sequence of indicator functions of dyadic intervals
      converges to $0$ in $L^1$ and at no point.
    topics:
