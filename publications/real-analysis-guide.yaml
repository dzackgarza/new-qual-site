  - slug: riemann-stieltjes-integration
    title: Riemann--Stieltjes integration
    parent: differentiation
    lede: >-
      For $\alpha$ increasing on $[a,b]$, a bounded $f$ is Riemann--Stieltjes integrable with
      respect to $\alpha$ if and only if for every $\varepsilon>0$ there is a partition $P$ of
      $[a,b]$ with $U(P,f,\alpha)-L(P,f,\alpha)<\varepsilon$. If $f$ is integrable with
      respect to $\alpha$, and $\alpha$ is differentiable with $\alpha'$ Riemann integrable,
      then $\int_a^bf\,d\alpha=\int_a^bf(x)\alpha'(x)\,dx$. Integration by parts: if $f$ is
      integrable with respect to $\alpha$, then $\alpha$ is integrable with respect to $f$ and
      $\int_a^bf\,d\alpha=f(b)\alpha(b)-f(a)\alpha(a)-\int_a^b\alpha\,df$. The fundamental
      theorem of calculus: if $f$ is Riemann integrable on $[a,b]$ and $F$ is differentiable
      on $[a,b]$ with $F'=f$, then $\int_a^bf=F(b)-F(a)$; and if $f$ is continuous, then
      $x\mapsto\int_a^xf$ is differentiable with derivative $f$. For continuous $f$,
      $\int_a^bf=f(c)(b-a)$ for some $c\in[a,b]$. Lebesgue's criterion: a bounded function on
      $[a,b]$ is Riemann integrable if and only if its set of discontinuities has Lebesgue
      measure zero.
    topics:
      - Riemann Integrability
