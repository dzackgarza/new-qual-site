- slug: metric-spaces
  title: Metric Spaces, Compactness and Completeness
  parent: sequences-and-series-of-numbers
  lede: 'A metric is the least structure under which the previous section''s arguments
    still run, and the point of the abstraction is that two different-looking hypotheses
    become the same one. Compactness has three faces here -- open covers, sequential
    compactness, and complete plus totally bounded -- and they agree in a metric space,
    which is why an exam problem may hand you any of the three. Heine-Borel says which
    subsets of $\mathbb R^n$ qualify, and the counterexamples say why the theorem
    needs $\mathbb R^n$: closed and bounded is not enough in $\mathbb Q$ or in $C([0,1])$.
    Completeness is the hypothesis Baire needs, and Baire is what makes the nowhere
    dense sets and the Cantor set into tools rather than curiosities.'
  items:
  - ref: D-TVKFM
  - ref: D-G5N6I
  - ref: T-QPTHZ
  - ref: PR-25GM2
