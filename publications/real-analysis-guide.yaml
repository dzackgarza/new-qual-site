  - slug: hilbert-spaces-and-duality
    title: Hilbert spaces and duality
    parent: lp-spaces
    lede: >-
      $L^2$ is a Hilbert space with inner product $\inner{f}{g}=\int f\bar g$. In a Hilbert
      space $H$, every nonempty closed convex set has a unique element of least norm, so
      $H=M\oplus M^\perp$ for every closed subspace $M$; every orthonormal family $(e_i)$
      satisfies Bessel's inequality $\sum_i\abs{\inner{x}{e_i}}^2\le\norm{x}^2$; and a
      complete orthonormal family $(e_i)_{i\in I}$ gives an isometric isomorphism
      $H\cong\ell^2(I)$. The Riesz representation theorem: every bounded linear functional on
      $H$ is $x\mapsto\inner{x}{y}$ for a unique $y\in H$. For $1\le p<\infty$ on a
      $\sigma$-finite measure space, the dual of $L^p$ is $L^q$ with $1/p+1/q=1$; the dual of
      $L^\infty([0,1])$ strictly contains $L^1([0,1])$. The Hahn--Banach, uniform boundedness,
      open mapping, and closed graph theorems apply to Banach spaces such as $L^p$ and
      $\ell^p$. The closed unit ball of an infinite-dimensional Hilbert space is not
      norm-compact, and every bounded sequence in a Hilbert space has a weakly convergent
      subsequence.
    topics:
