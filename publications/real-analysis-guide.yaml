  - slug: sequences-and-series-of-functions
    title: Sequences and Series of Functions
    parent: riemann-stieltjes-integration
    lede: 'Uniform limits of continuous functions are continuous. On a compact interval, uniform
      convergence permits passage of a limit through a Riemann integral. Passing a limit through
      differentiation requires additional hypotheses on derivatives. The Weierstrass M-test
      gives a sufficient condition for uniform convergence of a series. Arzelà–Ascoli characterizes
      compact families of continuous functions, and Stone–Weierstrass gives conditions for
      a subalgebra to be uniformly dense. Examples distinguish pointwise, uniform, almost-everywhere,
      and norm convergence under their respective hypotheses.'
    topics:
      - Uniform Convergence
      - Convergence of Functions
      - Sequences of Functions
      - Series of Functions
