  - slug: differentiation
    title: Differentiation
    parent: continuity
    lede: >-
      Fermat's theorem: if $f\colon(a,b)\to\RR$ has a local extremum at $c$ and is
      differentiable at $c$, then $f'(c)=0$. The mean value theorem: if $f$ is continuous on
      $[a,b]$ and differentiable on $(a,b)$, then $f(b)-f(a)=f'(c)(b-a)$ for some $c\in(a,b)$.
      Taylor's theorem: if $f^{(n)}$ is continuous on $[a,b]$ and $f^{(n+1)}$ exists on
      $(a,b)$, then
      $f(b)=\sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(b-a)^k+\frac{f^{(n+1)}(c)}{(n+1)!}(b-a)^{n+1}$
      for some $c\in(a,b)$. A function of bounded variation on $[a,b]$ is the difference of
      two increasing functions, and is therefore differentiable almost everywhere; functions
      of bounded variation are the integrators of [Riemann--Stieltjes
      integration](riemann-stieltjes-integration.html).
    topics:
      - Differentiation
      - Mean Value Theorem
      - Variation
      - Calculus
