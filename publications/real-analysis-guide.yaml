  - slug: metric-spaces
    title: Metric spaces, compactness and completeness
    parent: sequences-and-series-of-numbers
    lede: >-
      For a metric space $X$, compactness (every open cover has a finite subcover), sequential
      compactness, and completeness together with total boundedness are equivalent. The
      Heine--Borel theorem: a subset of $\RR^n$ is compact if and only if it is closed and
      bounded. In $\QQ$ the set $[0,2]\cap\QQ$ is closed and bounded and not compact, and in
      $C([0,1])$ with the supremum norm the closed unit ball is closed and bounded and not
      compact. The Baire category theorem: in a complete metric space, every countable
      intersection of dense open sets is dense.
    topics:
