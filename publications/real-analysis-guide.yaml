  - slug: the-lebesgue-integral
    title: The Lebesgue integral
    parent: measure-and-measurable-functions
    lede: >-
      For measurable $f\ge0$, $\int f=\sup\{\int\varphi:\varphi\text{ simple},\ 0\le\varphi\le
      f\}$. The monotone convergence theorem: if $0\le f_n\uparrow f$, then $\int f_n\to\int
      f$. Fatou's lemma: for measurable $f_n\ge0$, $\int\liminf_nf_n\le\liminf_n\int f_n$. The
      dominated convergence theorem: if $f_n\to f$ almost everywhere and $\abs{f_n}\le g$ with
      $g$ integrable, then $\int\abs{f_n-f}\to0$. The sequence $n\chi_{(0,1/n)}$ converges to
      $0$ at every point while every integral is $1$, and it has no integrable dominating
      function. For $\sigma$-finite measure spaces, Tonelli's theorem equates the iterated
      integrals of a nonnegative measurable function on the product, and Fubini's theorem does
      the same for a function integrable on the product. Chebyshev's inequality:
      $m(\{\abs{f}\ge\lambda\})\le\lambda^{-1}\int\abs{f}$ for $\lambda>0$. For integrable $f$
      and every $\varepsilon>0$ there is $\delta>0$ such that $\int_E\abs{f}<\varepsilon$
      whenever $m(E)<\delta$.
    topics:
