  - slug: continuity
    title: Continuity
    parent: metric-spaces
    lede: >-
      Start from the four equivalent readings of continuity, because each later argument
      picks the one it needs: the sequential form for limits, the preimage form for
      topological arguments, and the epsilon-delta form for estimates. Compactness is what
      upgrades continuity into the two facts the rest of the path depends on: attained
      extrema and uniform continuity. The distinction between continuity and uniform
      continuity is where the exam problems live, so the section carries the standard
      witnesses that the two differ on a non-compact domain.
