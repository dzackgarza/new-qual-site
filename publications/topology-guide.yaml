  - slug: the-fundamental-group
    title: The fundamental group
    parent: connectedness-and-homotopy
    lede: >-
      The fundamental group, the first algebraic invariant of a space. The basepoint and simple-connectivity material comes first; the Seifert--van Kampen theorem is the main computational tool, and the free and amalgamated products that it needs are adjacent to it. The covering-spaces section computes the fundamental group from the other direction.
    topics:
      - Fundamental Group
      - van Kampen
      - Groups
