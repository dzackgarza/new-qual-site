schema: qual/publication@2
id: GUIDE-TOPOLOGY
kind: study-guide
title: Topology
lede: 'The qualifying exam syllabus in general and algebraic topology: point-set axioms, separation and countability, compactness and connectedness, quotient constructions, the fundamental group, covering spaces, CW complexes, and singular homology.'
sections:
  - slug: spaces-and-continuous-maps
    title: Spaces and continuous maps
    parent: GUIDE-TOPOLOGY
    lede: >-
      A topology on a set $X$ is a family of subsets of $X$, the open sets, that contains
      $\varnothing$ and $X$ and is closed under arbitrary unions and finite intersections. A
      basis $\mathcal B$ generates the topology whose open sets are the unions of elements of
      $\mathcal B$. Closed sets are complements of open sets; the closure $\overline A$ of $A$
      is the smallest closed set containing $A$, and $x\in\overline A$ if and only if every
      neighbourhood of $x$ meets $A$. A map $f\colon X\to Y$ is continuous if the preimage of
      every open set is open, equivalently if the preimage of every basis element is open,
      equivalently if the preimage of every closed set is closed, equivalently if $f(\overline
      A)\subseteq\overline{f(A)}$ for every $A\subseteq X$. A map is open if it sends open
      sets to open sets, and closed if it sends closed sets to closed sets. A homeomorphism is
      a continuous bijection with continuous inverse; a continuous bijection is a
      homeomorphism if and only if it is open.
    topics:
      - Point-Set Topology
      - Closure
      - Continuity
      - Limits
      - Bases
      - Homeomorphisms
