  - slug: manifolds-and-duality
    title: Manifolds and duality
    parent: homology
    lede: >-
      Orientation of manifolds through local homology, then the fundamental class, then the duality theorems it makes possible: Poincaré, Lefschetz, and Alexander duality, and the intersection form. The order matters: orientation gives the fundamental class, and the fundamental class gives the duality isomorphisms.
    topics:
      - Manifolds
      - Orientation
      - Cohomology
      - Poincaré Duality
