  - slug: surfaces
    title: Surfaces
    parent: homology
    lede: Connected compact surfaces are classified by orientability, genus, and number
      of boundary components. Their Euler characteristic is $2-2g-b$ in the orientable
      case and $2-k-b$ in the nonorientable case, where $b$ is the number of boundary
      components. Closed surfaces admit polygonal presentations and connected-sum
      decompositions. For finite cell complexes Euler characteristic is additive under
      suitable decompositions and multiplicative under finite-sheeted covering maps.
    topics:
      - Surfaces
      - Classification
      - Euler Characteristic
