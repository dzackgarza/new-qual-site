  - slug: surfaces
    title: Surfaces
    parent: homology
    lede: >-
      Dimension two is the case where the invariants above are a complete answer. Every
      compact surface is an identification space of a polygon with its edges paired, the
      connected sum makes the set of them a monoid, and the single relation
      $\RP^2 \# \RP^2 \# \RP^2 = \RP^2 \# T^2$ collapses that monoid to two families. The
      Euler characteristic is computed from any cell structure and is a homotopy invariant, so
      orientability together with $\chi$ classifies compact surfaces up to homeomorphism, with
      $\chi = 2 - 2g - b$ in the orientable case and $\chi = 2 - k - b$ in the nonorientable
      one. Inclusion-exclusion for $\chi$ over a cover and its multiplicativity under covering
      maps are what make most exam problems in this section one-line arguments.
    items:
