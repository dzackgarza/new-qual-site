  - slug: separation-and-countability
    title: Separation and Countability
    parent: spaces-and-continuous-maps
    lede: "The $T_1$ condition means that points are closed; the Hausdorff condition separates
      distinct points by disjoint neighborhoods. Urysohn's lemma separates disjoint closed
      subsets of a normal space by a continuous real-valued function. First countability gives
      countable neighborhood bases at points, and second countability gives a countable basis
      for the topology. Second countability implies separability; the converse need not hold
      for general spaces."
    topics:
      - Hausdorff Spaces
      - Separation Axioms
      - Countability
      - Density
