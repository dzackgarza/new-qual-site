schema: qual/publication@2
id: GUIDE-TOPOLOGY
kind: study-guide
title: Topology
lede: 'General and algebraic topology: topological spaces, homotopy, covering spaces, cell complexes, and homology.'
sections:
  - slug: spaces-and-continuous-maps
    title: Spaces and continuous maps
    parent: GUIDE-TOPOLOGY
    lede: >-
      The vocabulary that every later section uses: open and closed sets, bases, closure, continuity, and homeomorphisms. The equivalent forms of continuity are kept together, because a proof often changes between the open-set, closed-set, basis, and closure criteria as the problem requires.
    topics:
      - Point-Set Topology
      - Closure
      - Continuity
      - Limits
      - Bases
      - Homeomorphisms
