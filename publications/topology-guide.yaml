  - slug: constructions-of-spaces
    title: Constructions of Spaces
    parent: spaces-and-continuous-maps
    lede: >-
      Every space met after this section is built by one of three constructions, and each is
      fixed by asking which maps it makes continuous. The subspace topology is the coarsest
      making the inclusion continuous, the product topology the coarsest making every
      projection continuous, and the quotient topology the finest making the projection out
      continuous, which is why the first two are checked against maps in and the third against
      maps out. The box topology is the plausible alternative to the product that fails that
      test. Attaching one space to another along a map is the quotient case that builds cell
      complexes and surfaces later, and the orbit space of a group action is the same
      construction with the identifications supplied by the group.
