  - slug: separation-and-countability
    title: Separation and countability
    parent: spaces-and-continuous-maps
    lede: >-
      A space is $T_1$ if and only if its points are closed, and Hausdorff if distinct points
      have disjoint neighbourhoods. A $T_1$ space is regular if a point and a closed set not
      containing it have disjoint neighbourhoods, and normal if disjoint closed sets have
      disjoint neighbourhoods. Urysohn's lemma: if $X$ is normal and $A,B\subseteq X$ are
      disjoint closed sets, there is a continuous $f\colon X\to[0,1]$ with $f=0$ on $A$ and
      $f=1$ on $B$. A space is first countable if every point has a countable neighbourhood
      basis, second countable if its topology has a countable basis, and separable if it has a
      countable dense subset; a second countable space is first countable and separable.
    topics:
      - Hausdorff Spaces
      - Separation Axioms
      - Countability
      - Density
