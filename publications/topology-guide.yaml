  - slug: surfaces
    title: Surfaces
    parent: homology
    lede: >-
      Every compact connected surface without boundary is homeomorphic to $S^2$, to a
      connected sum of $g\ge1$ tori, or to a connected sum of $k\ge1$ projective planes, and
      each of these is a quotient of a polygon by a pairing of its edges; moreover
      $\RP^2\#\RP^2\#\RP^2\cong\RP^2\#T^2$. The Euler characteristic of a finite CW complex is
      the alternating count of its cells, equals $\sum_k(-1)^k\operatorname{rank}H_k$, and is
      a homotopy invariant. A compact connected surface with $b$ boundary circles is
      determined up to homeomorphism by $b$, orientability, and $\chi$, where $\chi=2-2g-b$ in
      the orientable case and $\chi=2-k-b$ in the nonorientable case. If a finite CW complex
      $X$ is the union of subcomplexes $A$ and $B$, then $\chi(X)=\chi(A)+\chi(B)-\chi(A\cap
      B)$, and an $n$-sheeted covering space $\tilde X$ of $X$ satisfies $\chi(\tilde
      X)=n\chi(X)$.
    topics:
      - Surfaces
      - Classification
      - Euler Characteristic
