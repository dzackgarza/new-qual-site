  - slug: homology
    title: Homology
    parent: cell-complexes
    lede: Singular homology is defined using continuous maps from simplices and is
      invariant under homotopy. For CW complexes, cellular homology computes the same
      groups from the cell structure, with boundary coefficients given by degrees of
      attaching maps. The long exact sequence of a pair relates absolute and relative
      homology. Excision permits removal of subsets whose closure lies in the interior
      of the subspace. Mayer–Vietoris relates the homology of an open cover, its
      intersection, and its union. Wedge decompositions and the Künneth theorem give
      further computations.
    topics:
      - Homology
      - Mayer-Vietoris
      - Homological Algebra
      - Modules
