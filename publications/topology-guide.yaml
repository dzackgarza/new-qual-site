  - slug: degree-and-fixed-points
    title: Degree and Fixed Points
    parent: homology
    lede: 'For $n\geq 1$, a self-map of $S^n$ induces multiplication by an integer on $H_n(S^n;\mathbb
      Z)$; that integer is its degree. Degree is invariant under homotopy and can be computed
      from local degrees under the relevant hypotheses. A fixed-point-free self-map of a sphere
      is homotopic to the antipodal map. Degree arguments give obstructions used in fixed-point
      and antipodal-point theorems; the Lefschetz number combines traces on homology.'
    topics:
      - Degree
      - Fixed Points
    items:
