  - slug: compactness
    title: Compactness
    parent: separation-and-countability
    lede: 'Compactness is the first hypothesis that turns the local statements above
      into global ones, because a finite subcover replaces an arbitrary indexing set
      by a maximum. Read the results in two groups. The first is what a continuous map
      does to a compact set: the image stays compact, a real-valued map attains its
      extremes, and against a Hausdorff target a continuous bijection is forced to be
      a homeomorphism, which is why the separation axioms had to come first. The second
      is what compactness does inside a product or a metric space, the tube lemma being
      the projection statement that makes products of compact spaces tractable, and
      completeness with total boundedness being the metric reformulation.'
    items:
      - ref: D-AOJG3
      - ref: D-EILKJ
