  - slug: constructions-of-spaces
    title: Constructions of spaces
    parent: spaces-and-continuous-maps
    lede: >-
      How new spaces are made from old ones: subspaces, products, quotients, adjunction spaces, and orbit spaces. Each of these topologies has a universal property, and that property, not a description of the open sets, is what proves a map into a product or out of a quotient continuous. The box topology is here as the standard warning about products. Cell complexes and the orbit spaces of covering-space actions are built from these constructions later in the guide.
    topics:
      - Subspace Topology
      - Product Topology
      - Quotient Spaces
