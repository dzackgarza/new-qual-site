  - slug: degree-and-fixed-points
    title: Degree and fixed points
    parent: homology
    lede: >-
      The degree of a map between spheres and its applications. The fixed point and zero theorems are grouped by their conclusion: when a question asks for a fixed point, a zero of a vector field, or a pair of antipodal points with the same image, one of the theorems in this section usually gives it.
    topics:
