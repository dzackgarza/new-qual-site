id: GUIDE-TOPOLOGY
kind: study-guide
title: Topology
lede: 'General and algebraic topology: topological spaces, homotopy, covering spaces, cell
  complexes, and homology.'
sections:
  - slug: spaces-and-continuous-maps
    title: Spaces and Continuous Maps
    parent: GUIDE-TOPOLOGY
    lede: 'A topology is a family of open sets closed under arbitrary unions and finite intersections.
      A basis produces such a family in practice, and the closed sets, the closure, and the
      limit points are the same data read through the complement. Continuity can be checked
      on basis elements; Munkres 18.1 collects the equivalent forms, and open and closed maps
      isolate the one-sided condition that continuity alone does not supply. A homeomorphism
      is a continuous bijection with continuous inverse.'
    topics:
      - Point-Set Topology
      - Closure
      - Continuity
      - Limits
      - Bases
      - Homeomorphisms
