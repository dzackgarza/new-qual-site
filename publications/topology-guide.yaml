  - slug: metric-spaces
    title: Metric Spaces
    parent: separation-and-countability
    lede: 'Every metric space is Hausdorff and normal. For metric spaces, separability is
      equivalent to second countability, and compactness is equivalent to completeness together
      with total boundedness. Completeness and total boundedness depend on the chosen metric.
      The Lebesgue number lemma gives a uniform ball size refining an open cover of a compact
      metric space.'
    topics:
      - Metric Spaces
      - Completeness
      - Euclidean Spaces
      - Convergence
