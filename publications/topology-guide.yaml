  - slug: cell-complexes
    title: Cell Complexes
    parent: constructions-of-spaces
    lede: >-
      Everything computed after this point is computed from a cell structure, so the spaces
      have to be built rather than merely described. A CW complex is assembled by induction on
      dimension, attaching $n$-cells to the $(n-1)$-skeleton along maps out of $S^{n-1}$ and
      giving the union the weak topology, which is the quotient construction from the second
      section applied one dimension at a time. The standard operations are all instances:
      the cone, the suspension, the wedge, the smash, the mapping cylinder and the mapping
      cone. Cellular approximation says no homotopy information is lost by insisting maps
      respect the skeleta, and the product of two complexes has the cells the generating
      function predicts, which is what makes the homology of a product computable.
