  - slug: covering-spaces
    title: Covering spaces
    parent: the-fundamental-group
    lede: >-
      A covering map $p\colon\tilde X\to X$ is a continuous surjection such that every point
      of $X$ has an open neighbourhood $U$ for which $p^{-1}(U)$ is a disjoint union of open
      sets, each mapped homeomorphically onto $U$ by $p$. Paths and homotopies in $X$ lift
      uniquely to $\tilde X$ once the starting point of the lift is chosen, and
      $p_*\colon\pi_1(\tilde X,\tilde x_0)\to\pi_1(X,x_0)$ is injective. The lifting
      criterion: for $Y$ path-connected and locally path-connected, a map
      $f\colon(Y,y_0)\to(X,x_0)$ lifts to $(\tilde X,\tilde x_0)$ if and only if
      $f_*\pi_1(Y,y_0)\subseteq p_*\pi_1(\tilde X,\tilde x_0)$. For $X$ path-connected,
      locally path-connected, and semilocally simply connected, isomorphism classes of based
      path-connected covering spaces correspond to subgroups $H\le\pi_1(X,x_0)$; the deck
      transformation group of the cover corresponding to $H$ is isomorphic to $N(H)/H$, where
      $N(H)$ is the normalizer of $H$, and the cover is normal if and only if
      $H\trianglelefteq\pi_1(X,x_0)$. If a group $G$ acts on $Y$ so that every point has a
      neighbourhood $U$ with $gU\cap U=\varnothing$ for all $g\ne1$, then $Y\to Y/G$ is a
      covering map. Applying the correspondence to graphs shows that every subgroup of a free
      group is free.
    topics:
      - Covering Spaces
      - Group Actions
      - Conjugacy
