  - slug: connectedness-and-homotopy
    title: Connectedness and homotopy
    parent: spaces-and-continuous-maps
    lede: >-
      Connectedness and path-connectedness, then homotopy of maps and homotopy equivalence of spaces. The two topics are together because path components are the first homotopy invariant of a space. Retracts, deformation retracts, and contractible spaces are the tools that the fundamental-group and homology computations use to replace a space by a simpler one.
    topics:
      - Connectedness
      - Homotopy
      - Retracts
      - Counterexamples
