  - slug: compactness
    title: Compactness
    parent: separation-and-countability
    lede: >-
      A space is compact if every open cover has a finite subcover. For continuous $f\colon
      X\to Y$ with $X$ compact, $f(X)$ is compact; for $Y=\RR$, $f$ attains its maximum and
      minimum; and if $Y$ is Hausdorff and $f$ is bijective, $f$ is a homeomorphism. Closed
      subsets of compact spaces are compact, and compact subsets of Hausdorff spaces are
      closed. The tube lemma: if $Y$ is compact and $N$ is an open subset of $X\times Y$
      containing $\{x_0\}\times Y$, then $N$ contains $W\times Y$ for some neighbourhood $W$
      of $x_0$. The tube lemma shows that a product of two compact spaces is compact, and
      Tychonoff's theorem extends this to arbitrary products. A metric space is compact if and
      only if it is complete and totally bounded.
    topics:
      - Compactness
      - Tube Lemma
      - Paracompactness
