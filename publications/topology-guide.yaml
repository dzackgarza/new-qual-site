  - slug: metric-spaces
    title: Metric Spaces
    parent: separation-and-countability
    lede: >-
      A metric produces a topology, and the questions above all have sharper answers inside
      one. A metric space is automatically Hausdorff and normal, so the separation axioms cost
      nothing here, and separability and second countability become equivalent. Two conditions
      that are invisible to the topology alone appear at this level: completeness, which is a
      statement about Cauchy sequences and not about open sets, and total boundedness, which
      bounds how many balls of a fixed radius are needed. Their conjunction is exactly
      compactness for metric spaces, which is the reason the next section can be read twice,
      once by covers and once by sequences. The Lebesgue number lemma is the technical bridge
      between the two readings.
