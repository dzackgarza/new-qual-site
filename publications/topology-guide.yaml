  - slug: metric-spaces
    title: Metric spaces
    parent: separation-and-countability
    lede: >-
      A metric $d$ on $X$ induces the topology with basis the open balls. Metric spaces are
      Hausdorff and normal, and a metric space is separable if and only if it is second
      countable. A metric space is complete if every Cauchy sequence converges, and totally
      bounded if for every $\varepsilon>0$ it is covered by finitely many balls of radius
      $\varepsilon$. Neither property is a topological invariant: $\RR$ is complete and not
      totally bounded, $(0,1)$ is totally bounded and not complete, and the two are
      homeomorphic. A metric space is compact if and only if it is complete and totally
      bounded. The Lebesgue number lemma: for every open cover $\mathcal U$ of a compact
      metric space there is $\delta>0$ such that every subset of diameter less than $\delta$
      lies in some member of $\mathcal U$.
    topics:
      - Metric Spaces
      - Completeness
      - Euclidean Spaces
      - Convergence
