  - slug: compactness
    title: Compactness
    parent: separation-and-countability
    lede: 'A continuous image of a compact space is compact. Continuous real-valued functions
      on a compact space attain their extrema, and a continuous bijection from a compact space
      to a Hausdorff space is a homeomorphism. The tube lemma gives product neighborhoods
      around a compact factor. In metric spaces, compactness is equivalent to completeness
      and total boundedness.'
    topics:
      - Compactness
      - Tube Lemma
      - Paracompactness
