  - slug: separation-and-countability
    title: Separation and countability
    parent: spaces-and-continuous-maps
    lede: >-
      The separation axioms and the countability axioms. Exam questions ask which axioms a given space satisfies and which implications fail, so each definition is adjacent to the facts that relate it to the others, and to the counterexamples in the metric and compactness sections that separate them.
    topics:
      - Hausdorff Spaces
      - Separation Axioms
      - Countability
      - Density
