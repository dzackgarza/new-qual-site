  - slug: homology
    title: Homology
    parent: cell-complexes
    lede: >-
      Singular and cellular homology, and the tools that compute them: the long exact sequence of a pair, excision, the Mayer--Vietoris sequence, and the Künneth formula. The tools are adjacent so that a problem can be matched to the sequence that solves it. The homology of spheres is the first computation and the input to the degree section.
    topics:
      - Homology
      - Mayer-Vietoris
      - Homological Algebra
      - Modules
