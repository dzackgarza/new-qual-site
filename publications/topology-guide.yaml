  - slug: homology-degree-and-duality
    title: Homology, Degree, and Duality
    parent: covering-spaces
    lede: >-
      The fundamental group is nonabelian and hard to compute above dimension one, so the
      remaining invariants are the homology groups, taken here as given and used through
      their two computational tools. Mayer-Vietoris is the exact sequence attached to a cover
      by two open sets, the homological counterpart of van Kampen, and wedges split; together
      they give the homology of spheres by induction on dimension. Degree is what that
      calculation makes possible, since a self-map of $S^n$ acts on an infinite cyclic group
      and is therefore recorded by a single integer. The fixed-point theorems are all
      applications of that integer or of its alternating-sum refinement, the Lefschetz
      number. Poincaré duality is the last structural statement, pairing $H^k$ against
      $H_{n-k}$ on a closed orientable manifold via cap product with the fundamental class,
      and the classification of surfaces is the dimension-two case where the Euler
      characteristic and orientability are a complete invariant.
    items:
