  - slug: connectedness-and-homotopy
    title: Connectedness and Homotopy
    parent: spaces-and-continuous-maps
    lede: 'A connected space has no separation into disjoint nonempty open sets, equivalently
      no nonempty proper clopen subset. Path-connectedness requires a path between each pair
      of points. Both properties are preserved by continuous surjections. Homotopies are continuous
      maps $X\times I\to Y$ and define an equivalence relation on continuous maps $X\to Y$.
      A deformation retraction gives a homotopy equivalence. A space is contractible when
      its identity map is homotopic to a constant map.'
    topics:
      - Connectedness
      - Homotopy
      - Retracts
      - Counterexamples
