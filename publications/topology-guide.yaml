  - slug: the-fundamental-group
    title: The Fundamental Group
    parent: connectedness-and-homotopy
    lede: >-
      Homotopy classes of maps form only a set; restricting to loops at a basepoint makes
      concatenation a group law, and that is the whole content of the construction. Simple
      connectedness is then the statement that this group is trivial, which is where
      path-connectedness from the previous section is needed for the basepoint to be
      immaterial. Convexity supplies the one family of spaces whose homotopies can be written
      down directly, and Seifert-van Kampen converts an open cover by path-connected sets
      into an amalgamated free product, so the group of a union is computed from the groups
      of the pieces and their intersection. The wedge is the case where the intersection is a
      point.
    items:
