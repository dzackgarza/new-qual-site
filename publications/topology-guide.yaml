  - slug: cell-complexes
    title: Cell Complexes
    parent: constructions-of-spaces
    lede: 'A CW complex is built by attaching $n$-cells to its $(n-1)$-skeleton along maps
      from $S^{n-1}$, with the weak topology on the resulting union. This uses the quotient
      constructions in [Constructions of Spaces](constructions-of-spaces.html). Cones, suspensions,
      mapping cylinders, and mapping cones provide examples. Cellular approximation states
      that every map between CW complexes is homotopic to a cellular map.'
    topics:
      - Cell Complexes
      - Category Theory
