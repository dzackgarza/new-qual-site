  - slug: cell-complexes
    title: Cell complexes
    parent: constructions-of-spaces
    lede: >-
      A CW complex $X$ is built by induction on dimension: the $0$-skeleton $X^0$ is a
      discrete space, and $X^n$ is obtained from $X^{n-1}$ by attaching $n$-cells along maps
      $S^{n-1}\to X^{n-1}$, the adjunction construction of [constructions of
      spaces](constructions-of-spaces.html). The space $X=\bigcup_nX^n$ has the weak topology:
      a subset is closed if and only if its intersection with every $X^n$ is closed. Cones,
      suspensions, wedge sums, mapping cylinders, and mapping cones of CW complexes and
      cellular maps are CW complexes. The cellular approximation theorem: every map between CW
      complexes is homotopic to a cellular map, one sending $X^n$ into $Y^n$ for every $n$. If
      $X$ or $Y$ is locally compact, $X\times Y$ is a CW complex whose $n$-cells are the
      products $e^i\times e^j$ of cells with $i+j=n$.
    topics:
      - Cell Complexes
      - Category Theory
