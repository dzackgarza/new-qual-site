  - slug: surfaces
    title: Surfaces
    parent: homology
    lede: >-
      The classification of compact surfaces and the Euler characteristic. Together they identify a surface from a polygon presentation, a cell structure, or a covering, so the Euler characteristic formulas for unions and covers are adjacent to the classification.
