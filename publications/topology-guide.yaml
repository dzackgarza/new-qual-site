  - slug: separation-and-countability
    title: Separation and Countability
    parent: spaces-and-continuous-maps
    lede: "The axioms so far permit spaces in which distinct points share every neighborhood,
      so nothing yet forces limits to be unique or points to be closed. The separation
      axioms are the graded repair: each $T_n$ condition says which pair of disjoint
      objects can be pulled apart by open sets, with $T_1$ exactly the condition that
      points are closed and $T_2$ the hypothesis that later compactness arguments use.
      Urysohn's lemma is the statement that normality is already enough to separate
      closed sets by a function rather than merely by open sets. The countability axioms
      bound the size of the same data instead of its separation, first countability
      through neighborhood bases at a point and second countability through a basis
      for the whole topology; separability asks the weaker question of a countable dense
      subset, stated in terms of the closure above."
    items:
