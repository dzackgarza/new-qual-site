  - slug: the-fundamental-group
    title: The fundamental group
    parent: connectedness-and-homotopy
    lede: >-
      For a space $X$ and $x_0\in X$, $\pi_1(X,x_0)$ is the set of homotopy classes, relative
      to the endpoints, of loops at $x_0$, with the group operation induced by concatenation.
      A path $\gamma$ from $x_0$ to $x_1$ induces an isomorphism
      $\pi_1(X,x_0)\to\pi_1(X,x_1)$, $[\alpha]\mapsto[\overline\gamma\cdot\alpha\cdot\gamma]$,
      which depends on $\gamma$ only through its homotopy class; different paths give
      isomorphisms that differ by conjugation. A path-connected space is simply connected if
      its fundamental group is trivial, and convex subsets of $\RR^n$ are simply connected
      through straight-line homotopies. The Seifert--van Kampen theorem: if $X=U\cup V$ with
      $U$ and $V$ open, and $U$, $V$, and $U\cap V$ path-connected and containing $x_0$, then
      $\pi_1(X,x_0)\cong\pi_1(U,x_0)*_{\pi_1(U\cap V,x_0)}\pi_1(V,x_0)$. The fundamental group
      of the wedge of $n$ circles is the free group on $n$ generators.
    topics:
      - Fundamental Group
      - van Kampen
      - Groups
