  - slug: constructions-of-spaces
    title: Constructions of spaces
    parent: spaces-and-continuous-maps
    lede: >-
      For $A\subseteq X$, the subspace topology is the coarsest topology on $A$ for which the
      inclusion is continuous; the product topology on $\prod_\alpha X_\alpha$ is the coarsest
      for which every projection $\pi_\alpha$ is continuous; and for a surjection $q\colon
      X\to Y$, the quotient topology is the finest on $Y$ for which $q$ is continuous. Hence
      $f\colon Z\to\prod_\alpha X_\alpha$ is continuous if and only if every $\pi_\alpha\circ
      f$ is continuous, and $g\colon Y\to W$ is continuous if and only if $g\circ q$ is
      continuous. For the box topology on $\RR^\omega$ the first criterion fails: the diagonal
      map $t\mapsto(t,t,\ldots)$ has continuous components and is not continuous, since the
      preimage of $\prod_n(-1/n,1/n)$ is $\{0\}$. For $A\subseteq X$ and $f\colon A\to Y$, the
      adjunction space $Y\cup_fX$ is the quotient of $X\sqcup Y$ by $a\sim f(a)$ for $a\in A$;
      attaching cells is the case $X=D^n$, $A=S^{n-1}$. For a group $G$ acting on $X$ by
      homeomorphisms, the orbit space $X/G$ has the quotient topology from $X\to X/G$.
    topics:
      - Subspace Topology
      - Product Topology
      - Quotient Spaces
