  - slug: covering-spaces
    title: Covering Spaces
    parent: the-fundamental-group
    lede: A covering map has evenly covered neighborhoods. Paths and homotopies lift
      uniquely once the initial lift is fixed, and the induced homomorphism on
      fundamental groups is injective. For a path-connected, locally path-connected,
      semilocally simply connected base, connected based covering spaces correspond to
      subgroups of its fundamental group. The deck group is the normalizer quotient, and
      normal subgroups correspond to regular covers. Coverings of graphs give a proof
      that subgroups of free groups are free.
    topics:
      - Covering Spaces
      - Group Actions
      - Conjugacy
