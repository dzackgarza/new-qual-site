  - slug: connectedness-and-homotopy
    title: Connectedness and homotopy
    parent: spaces-and-continuous-maps
    lede: >-
      A space $X$ is connected if its only subsets that are both open and closed are
      $\varnothing$ and $X$, and path-connected if any two points are joined by a continuous
      path $[0,1]\to X$. Continuous images of connected spaces are connected, continuous
      images of path-connected spaces are path-connected, and path-connected spaces are
      connected; the topologist's sine curve is connected and not path-connected. A homotopy
      from $f\colon X\to Y$ to $g\colon X\to Y$ is a continuous $H\colon X\times[0,1]\to Y$
      with $H(x,0)=f(x)$ and $H(x,1)=g(x)$, and homotopy is an equivalence relation on
      continuous maps $X\to Y$. The spaces $X$ and $Y$ are homotopy equivalent if there are
      continuous $f\colon X\to Y$ and $g\colon Y\to X$ with $g\circ f\simeq\id_X$ and $f\circ
      g\simeq\id_Y$; homeomorphic spaces are homotopy equivalent, and $\RR^n$ is homotopy
      equivalent to a point. A subspace $A\subseteq X$ is a deformation retract if there is a
      homotopy from $\id_X$ to a retraction $X\to A$ that fixes every point of $A$ at all
      times. A space is contractible if $\id_X$ is homotopic to a constant map; any two maps
      from a space into a contractible space are homotopic.
    topics:
      - Connectedness
      - Homotopy
      - Retracts
      - Counterexamples
