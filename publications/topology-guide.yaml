  - slug: homology
    title: Homology
    parent: cell-complexes
    lede: >-
      Singular homology $H_n(X)$ is the homology of the chain complex of formal sums of maps
      $\Delta^n\to X$, and homotopic maps induce equal maps on homology. For a CW complex $X$,
      cellular homology is the homology of the chain complex with $n$th group
      $H_n(X^n,X^{n-1})$, free on the $n$-cells, whose differentials are given by the degrees
      of attaching maps composed with collapse maps $S^{n-1}\to S^{n-1}$; it is isomorphic to
      singular homology. A pair $(X,A)$ has a long exact sequence $\cdots\to H_n(A)\to
      H_n(X)\to H_n(X,A)\to H_{n-1}(A)\to\cdots$. Excision: for $Z\subseteq A\subseteq X$ with
      $\overline Z$ contained in the interior of $A$, the inclusion induces isomorphisms
      $H_n(X\setminus Z,A\setminus Z)\cong H_n(X,A)$. If $X$ is the union of the interiors of
      $A$ and $B$, the Mayer--Vietoris sequence $\cdots\to H_n(A\cap B)\to H_n(A)\oplus
      H_n(B)\to H_n(X)\to H_{n-1}(A\cap B)\to\cdots$ is exact. For a wedge of spaces whose
      basepoints have neighbourhoods deformation retracting onto them, $\tilde
      H_n(\bigvee_\alpha X_\alpha)\cong\bigoplus_\alpha\tilde H_n(X_\alpha)$, and the Künneth
      formula computes $H_n(X\times Y)$ from the homology of $X$ and $Y$. These tools give
      $\tilde H_n(S^k)\cong\ZZ$ for $n=k$ and $\tilde H_n(S^k)=0$ for $n\ne k$.
    topics:
      - Homology
      - Mayer-Vietoris
      - Homological Algebra
      - Modules
