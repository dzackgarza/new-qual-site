  - slug: covering-spaces
    title: Covering Spaces
    parent: the-fundamental-group
    lede: >-
      Van Kampen computes the fundamental group from a cover by open sets; covering spaces
      invert the question and recover spaces from the subgroups of that group. A covering map
      is a local homeomorphism with evenly covered neighborhoods, so paths and homotopies
      lift uniquely once a starting lift is fixed, and the induced map on $\pi_1$ is
      injective. The lifting criterion states exactly which maps factor through a cover in
      terms of the image subgroup, and the fundamental theorem makes the correspondence with
      subgroups precise for spaces that are path-connected, locally path-connected, and
      semilocally simply connected, with deck transformations realizing the normalizer
      quotient and Galois covers the normal case. A free properly discontinuous action
      produces such covers directly, and the subgroups of free groups are the payoff.
