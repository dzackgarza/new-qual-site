  - slug: connectedness-and-homotopy
    title: Connectedness and Homotopy
    parent: compactness
    lede: >-
      Connectedness is the other property preserved by continuous surjections, and it is
      stated by what cannot happen: no decomposition into two disjoint nonempty open sets, or
      equivalently no proper clopen subset. Path-connectedness replaces that negative
      condition with a map out of the interval, which is the first time a space is probed by
      maps in rather than by covers. Homotopy makes those probing maps themselves the object
      of study: a continuous deformation through $X \times I$, an equivalence relation on
      $\hom(X,Y)$, and hence a notion of equivalence for spaces that is strictly weaker than
      homeomorphism. Retracts and deformation retracts are the computable case, and a
      contractible space is one where the identity is nullhomotopic, so every map into it
      carries no information.
    items:
