  - slug: degree-and-fixed-points
    title: Degree and Fixed Points
    parent: homology
    lede: >-
      Degree is what the homology calculation makes possible: a self-map of $S^n$ acts on an
      infinite cyclic group and is therefore recorded by a single integer, which depends only
      on the homotopy class and is computable as a sum of local degrees. Every fixed-point
      theorem in the qualifying exams is an application of that integer or of its
      alternating-sum refinement, the Lefschetz number. The pattern is always the same: assume
      no fixed point, use the assumption to write down a homotopy to the antipodal map, and
      contradict the degree that homotopy would force. Brouwer, the hairy ball theorem and
      Borsuk-Ulam are the three standard conclusions.
    items:
