schema: qual/publication@2
id: GUIDE-TOPOLOGY
kind: study-guide
title: Topology
lede: >-
  Follow one dependency-ordered path from the open-set axioms to the algebraic invariants:
  which separation and countability hypotheses a space needs before its points behave,
  what compactness and connectedness give a continuous map, and how homotopy, covering
  spaces, and homology turn those spaces into groups that can be computed.
sections:
  - slug: spaces-and-continuous-maps
    title: Spaces and Continuous Maps
    parent: GUIDE-TOPOLOGY
    lede: >-
      One structure carries the whole subject: a family of open sets closed under arbitrary
      unions and finite intersections. A basis is how such a family is produced in practice,
      and the closed sets, the closure, and the limit points are the same data read through
      the complement. Continuity is defined by preimages rather than by points, which is what
      makes it checkable against a basis; Munkres 18.1 collects the equivalent forms, and open
      and closed maps isolate the one-sided condition that continuity alone does not supply.
      A homeomorphism is the two-sided case, a bijection on points and on open sets at once,
      and it is the equivalence this subject is trying to decide.
