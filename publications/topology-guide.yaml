  - slug: homology
    title: Homology
    parent: cell-complexes
    lede: The fundamental group is nonabelian and hard to compute above dimension one,
      so the remaining invariants are the homology groups. Singular homology is defined
      from maps of simplices and is manifestly a homotopy invariant; cellular homology
      computes the same groups from the cell structure of the previous section, with
      the differentials given by degrees of maps between spheres. Three tools do all
      the work. The long exact sequence of a pair converts a subspace into a correction
      term, excision says the relative groups do not see what is cut out well inside
      the subspace, and Mayer-Vietoris is the sequence attached to a cover by two open
      sets, the homological counterpart of van Kampen. Wedges split and the Kunneth
      formula handles products, so the homology of the standard spaces follows by induction
      on dimension.
    items:
