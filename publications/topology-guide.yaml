  - slug: degree-and-fixed-points
    title: Degree and fixed points
    parent: homology
    lede: >-
      A map $f\colon S^n\to S^n$ with $n\ge1$ induces multiplication by an integer $\deg f$ on
      $H_n(S^n)\cong\ZZ$. The degree depends only on the homotopy class of $f$, is
      multiplicative under composition, and equals $(-1)^{n+1}$ for the antipodal map; if
      $y\in S^n$ has finite preimage, $\deg f$ is the sum of the local degrees of $f$ at the
      points of $f^{-1}(y)$. A map $S^n\to S^n$ without fixed points is homotopic to the
      antipodal map, which gives Brouwer's fixed point theorem, that every continuous map
      $D^n\to D^n$ has a fixed point, and the hairy ball theorem, that $S^n$ has a continuous
      nowhere-vanishing tangent vector field if and only if $n$ is odd. The Borsuk--Ulam
      theorem: every continuous map $S^n\to\RR^n$ sends some pair of antipodal points to the
      same point. For a retract $X$ of a finite simplicial complex and continuous $f\colon
      X\to X$, if the Lefschetz number $\tau(f)=\sum_k(-1)^k\operatorname{tr}\big(f_*\colon
      H_k(X;\QQ)\to H_k(X;\QQ)\big)$ is nonzero, then $f$ has a fixed point.
    topics:
      - Degree
      - Fixed Points
