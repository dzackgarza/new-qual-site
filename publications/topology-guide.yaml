  - slug: manifolds-and-duality
    title: Manifolds and Duality
    parent: homology
    lede: At an interior point of an $n$-manifold, the local homology with integer
      coefficients is $\mathbb Z$ in degree $n$. An orientation is a compatible choice
      of local generators. For a connected manifold without boundary, the orientation
      double cover is disconnected precisely when the manifold is orientable. A closed
      connected oriented manifold has a fundamental class, and cap product with it gives
      Poincaré duality. Poincaré–Lefschetz duality treats manifolds with boundary;
      Alexander duality relates subsets of a sphere to their complements. On a closed
      oriented even-dimensional manifold, cup product defines the middle-dimensional
      intersection pairing.
    topics:
      - Manifolds
      - Orientation
      - Cohomology
      - Poincaré Duality
