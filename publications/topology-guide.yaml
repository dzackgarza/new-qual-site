  - slug: compactness
    title: Compactness
    parent: separation-and-countability
    lede: >-
      Compactness and its consequences: images, extreme values, closed maps into Hausdorff spaces, and products. The tube lemma is adjacent to the product theorems because it is the main step in their proofs. Read this section with the metric-spaces section, which gives the metric criteria for compactness.
    topics:
      - Compactness
      - Tube Lemma
      - Paracompactness
