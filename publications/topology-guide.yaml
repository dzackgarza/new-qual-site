  - slug: manifolds-and-duality
    title: Manifolds and Duality
    parent: homology
    lede: A manifold is locally Euclidean, so its local homology is the local homology
      of $\RR^n$ and each point carries two generators of $H_n(M, M \sm \ts{x})$. An
      orientation is a consistent global choice of one of them, the orientation double
      cover is the space of all such choices, and orientability is exactly the statement
      that this cover is disconnected. A closed connected oriented manifold then carries
      a fundamental class, and cap product with it is Poincaré duality, pairing $H^k$
      against $H_{n-k}$; the relative form for a manifold with boundary is Lefschetz
      duality and the complement form is Alexander duality. In the middle dimension
      the pairing becomes the intersection form, symmetric or symplectic according to
      parity, which is the invariant that separates four-manifolds.
    items:
