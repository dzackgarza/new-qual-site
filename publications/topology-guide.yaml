  - slug: metric-spaces
    title: Metric spaces
    parent: separation-and-countability
    lede: >-
      Metric spaces, the motivating examples for the separation and countability axioms. Completeness and total boundedness are metric properties, not topological ones; they are adjacent to the metric characterization of compactness and the Lebesgue number lemma, which together answer most compactness questions about metric spaces.
    topics:
      - Metric Spaces
      - Completeness
      - Euclidean Spaces
      - Convergence
