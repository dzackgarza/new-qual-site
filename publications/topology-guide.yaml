  - slug: manifolds-and-duality
    title: Manifolds and duality
    parent: homology
    lede: >-
      For an $n$-manifold $M$ and $x\in M$, $H_n(M,M\setminus\{x\};\ZZ)\cong\ZZ$. An
      orientation of $M$ is a choice of generator $\mu_x$ of this group for every $x$ that is
      locally consistent: each $x$ has a ball neighbourhood $B$ and a class in
      $H_n(M,M\setminus B;\ZZ)$ restricting to $\mu_y$ for every $y\in B$. The orientation
      double cover $\tilde M\to M$ has fibre over $x$ the two generators of
      $H_n(M,M\setminus\{x\};\ZZ)$, and a connected $M$ is orientable if and only if $\tilde
      M$ is disconnected. A closed connected orientable $n$-manifold has a fundamental class
      $[M]$ generating $H_n(M;\ZZ)\cong\ZZ$, and Poincaré duality states that $H^k(M;\ZZ)\to
      H_{n-k}(M;\ZZ)$, $\varphi\mapsto[M]\frown\varphi$, is an isomorphism for every $k$. For
      a compact orientable $n$-manifold $M$ with boundary, Lefschetz duality gives
      $H^k(M;\ZZ)\cong H_{n-k}(M,\partial M;\ZZ)$ and $H^k(M,\partial M;\ZZ)\cong
      H_{n-k}(M;\ZZ)$. For a compact, locally contractible, nonempty proper subspace
      $K\subseteq S^n$, Alexander duality gives $\tilde H_i(S^n\setminus K;\ZZ)\cong\tilde
      H^{n-i-1}(K;\ZZ)$. For a closed oriented $2m$-manifold,
      $(\alpha,\beta)\mapsto\langle\alpha\smile\beta,[M]\rangle$ on $H^m(M;\ZZ)$ modulo
      torsion is the intersection form, a unimodular bilinear form that is symmetric for $m$
      even and skew-symmetric for $m$ odd.
    topics:
      - Manifolds
      - Orientation
      - Cohomology
      - Poincaré Duality
