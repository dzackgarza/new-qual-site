  - slug: constructions-of-spaces
    title: Constructions of Spaces
    parent: spaces-and-continuous-maps
    lede: The subspace and product topologies are initial topologies for inclusions and
      projections, respectively. The quotient topology is final for the quotient map.
      Thus continuity into a product is checked componentwise, and continuity out of a
      quotient is checked after composition with the quotient map. For infinite
      products, the box topology can be strictly finer than the product topology.
      Attaching spaces and forming orbit spaces give examples of quotient constructions.
    topics:
      - Subspace Topology
      - Product Topology
      - Quotient Spaces
