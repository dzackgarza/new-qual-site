  - slug: the-fundamental-group
    title: The Fundamental Group
    parent: connectedness-and-homotopy
    lede: The fundamental group $\pi_1(X,x_0)$ consists of based loops modulo based
      homotopy, with concatenation as its group operation. A simply connected space is
      path-connected and has trivial fundamental group. A path between basepoints
      induces an isomorphism of fundamental groups. For an open cover by path-connected
      sets with path-connected nonempty intersection, Seifert–van Kampen describes the
      fundamental group of the union as a pushout. For based connected CW complexes, the
      fundamental group of a wedge is a free product.
    topics:
      - Fundamental Group
      - van Kampen
      - Groups
