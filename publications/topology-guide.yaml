  - slug: cell-complexes
    title: Cell complexes
    parent: constructions-of-spaces
    lede: >-
      CW complexes and the constructions on them: cones, suspensions, wedge sums, mapping cylinders, mapping cones, and products. A cell structure is what makes homology computable, so this section is the prerequisite for cellular homology. Cellular approximation is here because it lets a problem replace a map between complexes by a cellular map.
    topics:
      - Cell Complexes
      - Category Theory
