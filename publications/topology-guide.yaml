  - slug: covering-spaces
    title: Covering spaces
    parent: the-fundamental-group
    lede: >-
      Covering maps, used to compute fundamental groups and to classify spaces over a base. The lifting properties of paths and homotopies lead to the lifting criterion, and the lifting criterion leads to the classification of covers by subgroups of the fundamental group and to deck transformations. Covering-space actions give the standard quotients with a known fundamental group, and covers of graphs give the applications to free groups.
    topics:
      - Covering Spaces
      - Group Actions
      - Conjugacy
