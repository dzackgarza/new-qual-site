  - slug: harmonic-functions
    title: Harmonic functions
    parent: holomorphy-and-analyticity
    lede: >-
      A twice continuously differentiable $u\colon\Omega\to\RR$ is harmonic if $\Delta
      u=u_{xx}+u_{yy}=0$. The real part of a holomorphic function is harmonic. On a simply
      connected domain every harmonic $u$ is the real part of a holomorphic function, unique
      up to an imaginary constant: the form $-u_y\,dx+u_x\,dy$ is closed, so
      $v(z)=\int_{z_0}^{z}(-u_y\,dx+u_x\,dy)$ is independent of the path and $u+iv$ is
      holomorphic. Harmonic functions satisfy the mean value property
      $u(a)=\frac{1}{2\pi}\int_0^{2\pi}u(a+re^{i\theta})\,d\theta$ for every closed disc
      $\abs{z-a}\le r$ in $\Omega$, and hence the maximum and minimum principles. For
      $\varphi$ continuous on the unit circle, the Poisson integral
      $u(re^{i\theta})=\frac{1}{2\pi}\int_0^{2\pi}\frac{1-r^2}{1-2r\cos(\theta-t)+r^2}\,\varphi(e^{it})\,dt$
      solves the Dirichlet problem on the unit disc: $u$ is harmonic on $\DD$ and extends
      continuously to the closed disc with boundary values $\varphi$.
    topics:
      - Harmonic Functions
      - PDEs
      - Mean Value Property
