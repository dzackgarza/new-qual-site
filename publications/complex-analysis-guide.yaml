  - slug: problems-from-the-qualifying-exams
    title: Problems from the Qualifying Exams
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: 'A revision pass rather than a new traversal. The sections above reach their
      problems through the theory that answers them; these four panels reach the recurring
      shapes directly, one per family: a growth bound with the conclusion that the function
      is a polynomial, an expansion problem, a question about what survives a limit
      of holomorphic functions, and the counterexamples. Read after the theory, the
      point is that none of these announces which section it belongs to, which is the
      condition the exam imposes. Expect repeats. A panel selects on topic, and a problem
      carrying several topics is drawn by every panel that names one of them, so problems
      already met above appear here again, which is what a revision pass is for.'
