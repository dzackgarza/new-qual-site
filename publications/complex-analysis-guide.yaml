  - slug: argument-principle
    title: The Argument Principle
    parent: zeros-and-singularities
    lede: >-
      Zeros and poles now have orders, so they can be counted. The logarithmic derivative is
      the device that does it: it converts a zero or pole of any order into a simple pole whose
      residue is that order with sign, so a single contour integral returns the number of zeros
      minus the number of poles inside. Reading the same integral as a winding number of the
      image curve gives the index form, and the index form gives Rouche, since a dominated
      perturbation cannot change the winding number. Applying the count to the equation
      f(z) = w for w near a value already attained shows every nonconstant holomorphic map is
      open, and openness is a second and sharper proof of the modulus principles: no interior
      point can maximize the modulus, and applying that to a reciprocal handles the minimum.
    items:
      - ref: D-IA5FS
