  - slug: holomorphy-and-analyticity
    title: Holomorphy and Analyticity
    parent: series-and-convergence
    lede: 'Start with the complex derivative as a limit that must agree from every direction.
      That single requirement is the whole subject in compressed form: approaching along
      the real and imaginary axes and equating the two answers produces the Cauchy-Riemann
      equations, which say that the delbar derivative vanishes and that the real and
      imaginary parts are harmonic. The section closes by naming the other candidate
      definition, analyticity, and recording the one direction that needs no integration:
      a convergent power series is smooth on its disc, so analytic implies holomorphic.
      The converse is the debt the next section pays.'
    items:
