  - slug: special-functions-and-factorization
    title: Special Functions and Factorization
    parent: normal-families-and-omitted-values
    lede: 'Weierstrass factorization constructs entire functions with prescribed discrete
      zero sets and multiplicities. Two entire functions with the same zeros and multiplicities
      differ by a nonvanishing entire factor, which has an entire logarithm. Hadamard factorization
      restricts this factor for functions of finite order. The sine product connects infinite
      products with residue calculations. Gamma and zeta functions provide examples of meromorphic
      continuation.'
    topics:
      - Gamma Function
      - Riemann Zeta
      - Weierstrass Factorization
      - Riemann Surfaces
