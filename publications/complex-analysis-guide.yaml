  - slug: cauchy-theory
    title: Cauchy Theory
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: "Integration is what converts the pointwise derivative condition into global
      information. Cauchy-Goursat says a holomorphic function integrates to zero around
      any closed path in a simply connected region, and the Cauchy integral formula
      turns that vanishing into a reproducing formula: the values on a circle determine
      the value and every derivative at the center. Expanding the kernel in a geometric
      series proves the converse owed above, that holomorphic functions are analytic
      with coefficients read off the circle. Everything after is a consequence of that
      formula. Bounding the integrand gives Cauchy's estimate, which gives Liouville.
      Averaging gives the mean value property, which gives the maximum modulus principle.
      Reading the coefficient formula backwards gives the identity theorem, and Morera
      reverses the whole implication by promoting vanishing triangle integrals back
      to holomorphy."
    items:
      - ref: D-6DAXB
      - ref: T-2OVCI
      - ref: T-6DEUH
