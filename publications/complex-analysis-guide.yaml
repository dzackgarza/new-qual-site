  - slug: special-functions-and-factorization
    title: Special functions and factorization
    parent: normal-families-and-omitted-values
    lede: >-
      A nonvanishing holomorphic function on a simply connected domain is $e^g$ for a
      holomorphic $g$. Weierstrass factorization theorem: with $E_0(u)=1-u$ and
      $E_p(u)=(1-u)e^{u+u^2/2+\cdots+u^p/p}$, every entire function $f$ with a zero of order
      $m$ at $0$ and nonzero zeros $a_1,a_2,\ldots$, listed with multiplicity, is
      $f(z)=z^me^{g(z)}\prod_nE_n(z/a_n)$ for an entire function $g$, the product converging
      uniformly on compact sets. Hadamard's theorem: if $f$ has finite order $\rho$, the
      factors can be taken to be $E_p(z/a_n)$ with $p=\lfloor\rho\rfloor$ and $g$ a polynomial
      of degree at most $\rho$. Examples: $\sin\pi z=\pi z\prod_{n\ge1}(1-z^2/n^2)$, whose
      logarithmic derivative is $\pi\cot\pi z=\frac1z+\sum_{n\ge1}\frac{2z}{z^2-n^2}$, a
      partial fraction expansion also obtained from [residues and contour
      integration](residues.html); $\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\,dt$, defined for
      $\operatorname{Re}z>0$, which extends to a meromorphic function on $\CC$ with simple
      poles at $0,-1,-2,\ldots$; and $\zeta(s)=\sum_{n\ge1}n^{-s}$, defined for
      $\operatorname{Re}s>1$, which extends to a meromorphic function on $\CC$ with a single
      simple pole, at $s=1$.
    topics:
      - Gamma Function
      - Riemann Zeta
      - Weierstrass Factorization
      - Riemann Surfaces
