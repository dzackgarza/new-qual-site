schema: qual/publication@2
id: GUIDE-COMPLEX-ANALYSIS
kind: study-guide
title: Complex Analysis
lede: >-
  The qualifying exam syllabus in complex analysis: complex arithmetic and the elementary
  functions, power series, holomorphy and the Cauchy--Riemann equations, harmonic
  functions, Cauchy's theorem and integral formula, zeros and isolated singularities, the
  argument principle, residues and contour integration, conformal maps of the disc, normal
  families and the Riemann mapping theorem, and infinite products and special functions.
  The last section groups qualifying-exam problems by type.
sections:
  - slug: complex-arithmetic-and-elementary-functions
    title: Complex arithmetic and the elementary functions
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: >-
      For $z\in\CC$, $\cos z=\frac{e^{iz}+e^{-iz}}{2}$ and $\sin z=\frac{e^{iz}-e^{-iz}}{2i}$,
      and $\cosh z=\cos(iz)$ and $\sinh z=-i\sin(iz)$. No continuous branch of $\log z$ exists
      on $\CC\setminus\{0\}$. On the slit plane $\CC\setminus(-\infty,0]$ the principal branch
      $\Log z=\ln\abs{z}+i\Arg z$, with $\Arg z\in(-\pi,\pi)$, is holomorphic, and its limits
      from the two sides of the negative real axis differ by $2\pi i$. For $a\in\CC$ the power
      $z^a=e^{a\log z}$ depends on the branch of $\log z$: changing the branch multiplies
      $z^a$ by $e^{2\pi ika}$ for some $k\in\ZZ$.
    topics:
      - Geometry
      - Trigonometry
      - Hyperbolic Functions
      - Complex Logarithm
