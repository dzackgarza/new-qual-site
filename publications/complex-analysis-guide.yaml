  - slug: residues
    title: Residues and contour integration
    parent: argument-principle
    lede: >-
      Residue theorem: if $f$ is holomorphic on an open set $\Omega$ except at isolated
      singularities $a_1,\ldots,a_k$, and $\gamma$ is a closed curve in
      $\Omega\setminus\{a_1,\ldots,a_k\}$ that is homologous to zero in $\Omega$, then
      $\oint_\gamma f\,dz=2\pi i\sum_jn(\gamma,a_j)\Res_{a_j}f$. At a pole of order $n$,
      $\Res_af=\frac{1}{(n-1)!}\lim_{z\to a}\frac{d^{n-1}}{dz^{n-1}}\big((z-a)^nf(z)\big)$; if
      $g(a)\ne0$ and $h$ has a simple zero at $a$, then $\Res_a(g/h)=g(a)/h'(a)$. A real
      integral is evaluated by closing the contour with an arc whose integral tends to $0$.
      The ML inequality $\abs{\int_\gamma
      f\,dz}\le\sup_\gamma\abs{f}\cdot\operatorname{length}(\gamma)$ applies when $\abs{f(z)}$
      decays faster than $1/\abs{z}$. Jordan's lemma: for $a>0$ and the upper semicircle $C_R$
      of radius $R$ centred at $0$,
      $\abs{\int_{C_R}e^{iaz}g(z)\,dz}\le\frac{\pi}{a}\max_{C_R}\abs{g}$, which tends to $0$
      when $\max_{C_R}\abs{g}\to0$. If $a$ is a simple pole of $f$, the integral of $f$ over a
      positively oriented circular arc of angle $\theta$ centred at $a$ tends to
      $i\theta\Res_af$ as the radius tends to $0$. The residue at infinity is $\Res_\infty
      f=-\Res_0\big(z^{-2}f(1/z)\big)$, and if $f$ has finitely many singularities in $\CC$,
      the sum of all its residues, including the residue at infinity, is $0$.
    topics:
      - Residues
      - Contour Integration
      - Integrals
