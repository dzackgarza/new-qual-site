  - slug: harmonic-functions
    title: Harmonic Functions
    parent: holomorphy-and-analyticity
    lede: 'The real and imaginary parts of a holomorphic function are harmonic. On a disc,
      every harmonic function has a harmonic conjugate and is the real part of a holomorphic
      function. The mean-value property implies the maximum principle. The Dirichlet problem
      asks for a harmonic function with specified boundary values.'
    topics:
