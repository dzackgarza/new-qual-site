  - slug: zeros-and-singularities
    title: Zeros and singularities
    parent: cauchy-theory
    lede: >-
      If $f$ is holomorphic on a domain and not identically zero, each zero $a$ of $f$ has a
      finite order $m\ge1$, and $f(z)=(z-a)^mg(z)$ with $g$ holomorphic and $g(a)\ne0$; hence
      the zeros of $f$ are isolated. At an isolated singularity $a$, $f$ has a Laurent
      expansion $f(z)=\sum_{n\in\ZZ}c_n(z-a)^n$ on a punctured disc around $a$. The
      singularity is removable if $c_n=0$ for all $n<0$, a pole if $c_n\ne0$ for at least one
      and only finitely many $n<0$, and essential if $c_n\ne0$ for infinitely many $n<0$. The
      residue of $f$ at $a$ is $\Res_af=c_{-1}$. Riemann's theorem: the singularity is
      removable if and only if $f$ is bounded on a punctured neighbourhood of $a$. The
      Casorati--Weierstrass theorem: if $a$ is an essential singularity, the image of every
      punctured disc around $a$ is dense in $\CC$. A function is meromorphic on $\Omega$ if it
      is holomorphic on $\Omega$ except at isolated poles.
    topics:
      - Meromorphic Functions
      - Singularities
      - Removable Singularities
      - Essential Singularities
      - Casorati-Weierstrass
      - Laurent Series
      - Principal Parts
