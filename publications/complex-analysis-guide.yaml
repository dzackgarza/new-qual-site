  - slug: harmonic-functions
    title: Harmonic Functions
    parent: holomorphy-and-analyticity
    lede: 'The Cauchy-Riemann equations produced a pair of harmonic functions from every
      holomorphic one, and this section takes that seriously as a two-way street. Locally
      the construction reverses: a harmonic function on a disc is the real part of a
      holomorphic one, recovered by integrating its conjugate differential along any
      path, and the integral is path-independent for exactly the reason the equations
      say it is. Everything the modulus principles will do for holomorphic functions
      therefore has a real counterpart proved the same way, once through the mean value
      property and once by transporting the statement through the holomorphic function
      whose real part it is. The Dirichlet problem is the boundary-value question this
      makes it possible to ask, and it is where the subject touches partial differential
      equations rather than absorbing them.'
    items:
      - ref: D-CFBSA
      - ref: PR-UWGI6
      - ref: PR-6WOTK
