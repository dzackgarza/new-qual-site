  - slug: argument-principle
    title: The argument principle
    parent: zeros-and-singularities
    lede: >-
      Let $\gamma$ be a positively oriented simple closed piecewise smooth curve, and let $f$
      be meromorphic on an open set containing $\gamma$ and its interior, with no zeros or
      poles on $\gamma$. At a zero of order $m$ the logarithmic derivative $f'/f$ has a simple
      pole with residue $m$, and at a pole of order $m$ a simple pole with residue $-m$, so
      the argument principle gives $\frac{1}{2\pi i}\oint_\gamma\frac{f'}{f}\,dz=Z-P$, the
      numbers of zeros and poles inside $\gamma$ counted with multiplicity. The same integral
      is the winding number of the curve $f\circ\gamma$ about $0$. Rouché's theorem: if $f$
      and $g$ are holomorphic on an open set containing $\gamma$ and its interior and
      $\abs{g}<\abs{f}$ on $\gamma$, then $f$ and $f+g$ have the same number of zeros inside
      $\gamma$. Applying the argument principle to $f-w$ for $w$ near $f(z_0)$ proves the open
      mapping theorem: a nonconstant holomorphic function on a domain is an open map. The
      maximum modulus principle follows again, and applying it to $1/f$ gives the minimum
      modulus principle for nonvanishing $f$.
    topics:
      - Rouché
      - Argument Principle
      - Winding Number
      - Open Mapping Theorem
      - Zeros
      - Polynomials
