  - slug: residues
    title: Residues and Contour Integration
    parent: argument-principle
    lede: >-
      The argument principle was one instance of a general fact: only the coefficient of the
      inverse first power survives integration around a pole. The residue theorem states it in
      full, weighting each residue by the winding number of the contour. What remains is
      arithmetic and estimation. The residue at a pole of order n is a limit of a derivative of
      the function with the pole cleared, which specializes to a quotient rule when the pole
      comes from a simple zero of a denominator. To evaluate a real integral one closes the
      contour and discards the added arc, and that is what the ML bound and Jordan's lemma are
      for: the first bounds any contour integral by supremum times length, the second supplies
      the decay an oscillatory factor needs on a large semicircle. Indented arcs at a simple
      pole contribute a fraction of the residue proportional to the angle, and the residue at
      infinity closes off the count when all finite poles are enclosed.
    items:
