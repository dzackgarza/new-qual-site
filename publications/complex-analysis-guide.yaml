  - slug: series-and-convergence
    title: Series and Convergence
    parent: complex-arithmetic-and-elementary-functions
    lede: "A power series is the object the rest of the subject converges to, so the
      tests that decide when one converges come first. The root test is the one that
      matters, because it returns a radius rather than a verdict, and the radius is
      what makes a disc of convergence a domain. Inside that disc the convergence is
      uniform on compact subsets, which is the hypothesis every later interchange of
      limit and integral quotes. The boundary is where the tests separate: absolute
      convergence settles the circle in one stroke when the coefficients are summable,
      and when they are not, summation by parts and Dirichlet's test decide the circle
      point by point, which is why the same three series appear over and over as the
      standard examples of every possible behaviour. Abel's theorem then connects a
      boundary value back to the radial limit."
    items:
