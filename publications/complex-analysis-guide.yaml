  - slug: residues
    title: Residues and Contour Integration
    parent: argument-principle
    lede: "The residue theorem expresses a contour integral as a sum of residues weighted
      by winding numbers. For a pole of finite order, a derivative formula computes the residue;
      a simple zero of a denominator gives a quotient formula. The ML estimate and Jordan's
      lemma provide bounds for added contour segments in real-integral calculations. Small
      indented arcs around simple poles require their own limiting contributions. The residue
      at infinity relates the finite poles of a meromorphic function on the sphere."
    topics:
      - Residues
      - Contour Integration
      - Integrals
