schema: qual/publication@2
id: GUIDE-COMPLEX-ANALYSIS
kind: study-guide
title: Complex Analysis
lede: >-
  Follow one dependency-ordered path from the definition of a complex derivative to the
  theorems that only holomorphic functions satisfy: what contour integration proves about a
  function on the inside of a curve, how that forces the local shape of zeros and poles, what
  those poles compute, and which domains a holomorphic bijection can carry onto a disc.
sections:
  - slug: holomorphy-and-analyticity
    title: Holomorphy and Analyticity
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: >-
      Start with the complex derivative as a limit that must agree from every direction. That
      single requirement is the whole subject in compressed form: approaching along the real
      and imaginary axes and equating the two answers produces the Cauchy-Riemann equations,
      which say that the delbar derivative vanishes and that the real and imaginary parts are
      harmonic. The section closes by naming the other candidate definition, analyticity, and
      recording the one direction that needs no integration: a convergent power series is
      smooth on its disc, so analytic implies holomorphic. The converse is the debt the next
      section pays.
    items:
