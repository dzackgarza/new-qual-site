  - slug: series-and-convergence
    title: Series and Convergence
    parent: complex-arithmetic-and-elementary-functions
    lede: "The root test gives the radius of convergence of a power series. Convergence is
      uniform on compact subsets of its disc of convergence, permitting termwise integration
      and differentiation. Boundary convergence requires separate analysis: summation by parts
      and Dirichlet's test apply to particular boundary series, and Abel's theorem relates
      a convergent boundary series to its radial limit."
    topics:
      - Convergence Tests
      - Series of Numbers
      - Series of Functions
      - Power Series
