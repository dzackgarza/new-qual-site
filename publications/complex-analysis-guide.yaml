  - slug: conformal-maps-and-the-disc
    title: Conformal maps and the disc
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: >-
      A holomorphic function $f$ is locally injective near $z_0$ if and only if $f'(z_0)\ne0$,
      and then it is conformal at $z_0$; an injective holomorphic function on a domain has
      holomorphic inverse on its image. The Möbius transformations $z\mapsto\frac{az+b}{cz+d}$
      with $ad-bc\ne0$ act simply transitively on ordered triples of distinct points of
      $\CC\cup\{\infty\}$ and map circles and lines to circles and lines, and the Cayley
      transform $z\mapsto\frac{z-i}{z+i}$ maps the upper half-plane onto $\DD$. Schwarz lemma:
      if $f\colon\DD\to\DD$ is holomorphic with $f(0)=0$, then $\abs{f(z)}\le\abs{z}$ for all
      $z\in\DD$ and $\abs{f'(0)}\le1$, and if $\abs{f(z)}=\abs{z}$ for some $z\ne0$ or
      $\abs{f'(0)}=1$, then $f(z)=e^{i\theta}z$ for some $\theta\in\RR$. For $a\in\DD$,
      $\varphi_a(z)=\frac{a-z}{1-\bar az}$ is an automorphism of $\DD$ with
      $\varphi_a\circ\varphi_a=\id$ that exchanges $a$ and $0$, and
      $\Aut(\DD)=\{e^{i\theta}\varphi_a:\theta\in\RR,\ a\in\DD\}$.
    topics:
      - Conformal Maps
      - Fractional Linear Transformations
      - Schwarz Lemma
      - Blaschke Factors
