  - slug: zeros-and-singularities
    title: Zeros and Singularities
    parent: cauchy-theory
    lede: "A holomorphic function that is not identically zero on a connected domain has isolated
      zeros, each factoring locally as a power times a nonvanishing holomorphic function.
      Laurent series classify isolated singularities: an empty principal part gives a removable
      singularity, a nonzero finite principal part gives a pole, and an infinite principal
      part gives an essential singularity. The residue is the coefficient of $(z-a)^{-1}$.
      Riemann's removable-singularity theorem applies when the function is bounded near the
      isolated singularity; Casorati–Weierstrass describes dense images near an essential
      singularity."
    topics:
      - Meromorphic Functions
      - Singularities
      - Removable Singularities
      - Essential Singularities
      - Casorati-Weierstrass
      - Laurent Series
      - Principal Parts
