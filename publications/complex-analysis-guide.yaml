  - slug: argument-principle
    title: The Argument Principle
    parent: zeros-and-singularities
    lede: "The logarithmic derivative of a meromorphic function has residue equal to the order
      of a zero or the negative order of a pole. Its contour integral counts zeros minus poles,
      with winding-number weights. Rouché's theorem preserves the zero count under a sufficiently
      small boundary perturbation. Applying this count to nearby values gives the open mapping
      theorem and hence the maximum modulus principle."
    topics:
      - Rouché
      - Argument Principle
      - Winding Number
      - Open Mapping Theorem
      - Zeros
      - Polynomials
