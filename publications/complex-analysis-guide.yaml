  - slug: series-and-convergence
    title: Series and convergence
    parent: complex-arithmetic-and-elementary-functions
    lede: >-
      A power series $\sum_na_nz^n$ has radius of convergence $R$ given by
      $1/R=\limsup_n\abs{a_n}^{1/n}$ (Cauchy--Hadamard); it converges absolutely for
      $\abs{z}<R$, uniformly on compact subsets of $\{\abs{z}<R\}$, and diverges for
      $\abs{z}>R$. On the circle $\abs{z}=R$ the behaviour depends on the coefficients. If
      $\sum_n\abs{a_n}R^n<\infty$, the series converges absolutely at every point of the
      circle. By Dirichlet's test, if $R=1$ and $a_n$ decreases to $0$, the series converges
      at every point of $\abs{z}=1$ except possibly $z=1$. The series $\sum z^n$, $\sum
      z^n/n$, and $\sum z^n/n^2$ converge at no point, at every point except $z=1$, and at
      every point of $\abs{z}=1$, respectively. Abel's theorem: if $\sum_na_n$ converges, then
      $\lim_{r\to1^-}\sum_na_nr^n=\sum_na_n$.
    topics:
      - Convergence Tests
      - Series of Numbers
      - Series of Functions
      - Power Series
