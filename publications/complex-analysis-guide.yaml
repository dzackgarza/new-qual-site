  - slug: normal-families-and-omitted-values
    title: Normal Families and Omitted Values
    parent: conformal-maps-and-the-disc
    lede: "Explicit formulas classify maps between the model domains only. To produce
      a conformal map onto an arbitrary simply connected domain, one extracts it as
      a limit, and that requires compactness in a space of holomorphic functions. Morera
      supplies half of it: a locally uniform limit of holomorphic functions is holomorphic,
      and the derivatives converge too. Arzela-Ascoli supplies the other half for continuous
      functions, trading uniform boundedness and equicontinuity for a convergent subsequence.
      Montel's theorem is the complex-analytic upgrade, and it is where Cauchy's estimate
      is spent a second time: a locally bounded family of holomorphic functions is automatically
      equicontinuous, hence normal. That compactness is what lets an extremal argument
      converge, which is the Riemann mapping theorem. The same normality criterion,
      applied to families omitting values, strengthens Casorati-Weierstrass from dense
      image to an image omitting at most one point. This is the thinnest section in
      the exam record. Normal families, Montel, Picard and the Riemann mapping theorem
      carry five problems between them, and Hurwitz and Arzela-Ascoli carry none at
      all, so the problem panel below is short because the corpus is, not because the
      topic is small. Read the exercise panel instead: the technique is exercised there."
