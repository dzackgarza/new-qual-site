  - slug: normal-families-and-omitted-values
    title: Normal Families and Omitted Values
    parent: conformal-maps-and-the-disc
    lede: "Locally uniform limits of holomorphic functions are holomorphic, and their derivatives
      converge locally uniformly. Cauchy estimates give local equicontinuity for locally bounded
      families; Montel's theorem makes such families normal. Normal-family arguments enter
      the proof of the Riemann mapping theorem for proper simply connected plane domains.
      Omitted-value versions of Montel's theorem also lead to Picard's theorems."
    topics:
      - Normal Families
      - Montel
      - Picard
      - Riemann Mapping Theorem
      - Equicontinuity
      - Uniform Convergence
