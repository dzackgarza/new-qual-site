  - slug: cauchy-theory
    title: Cauchy Theory
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: "Cauchy's theorem gives vanishing integrals around closed paths in a simply connected
      domain. The Cauchy integral formula expresses values and derivatives inside a circle
      in terms of boundary values. Expanding its kernel gives local power-series expansions,
      and its derivative estimates imply Liouville's theorem. The mean-value property, maximum
      modulus principle, and identity theorem follow from these local properties. Morera's
      theorem gives a criterion for holomorphy from vanishing triangle integrals."
    topics:
      - Liouville's Theorem
      - Entire Functions
      - Cauchy Estimates
      - Identity Theorem
      - Morera
      - Maximum Modulus Principle
      - Cauchy Integral Formula
      - Cauchy Integral Theorem
