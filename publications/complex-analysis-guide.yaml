  - slug: normal-families-and-omitted-values
    title: Normal families and omitted values
    parent: conformal-maps-and-the-disc
    lede: >-
      A family $\mathcal F$ of holomorphic functions on $\Omega$ is normal if every sequence
      in $\mathcal F$ has a subsequence converging uniformly on compact subsets of $\Omega$.
      If holomorphic $f_n$ converge to $f$ uniformly on compact subsets of $\Omega$, then $f$
      is holomorphic by Morera's theorem, and $f_n'\to f'$ uniformly on compact subsets by
      Cauchy's integral formula. The Arzelà--Ascoli theorem: a family of continuous functions
      on $\Omega$ that is uniformly bounded and equicontinuous on each compact subset has the
      property that every sequence in it has a subsequence converging uniformly on compact
      subsets. Montel's theorem: a family of holomorphic functions that is uniformly bounded
      on each compact subset of $\Omega$ is normal, because Cauchy's estimate makes it
      equicontinuous on compact subsets. Riemann mapping theorem: every simply connected
      domain $\Omega\subsetneq\CC$ is biholomorphic to $\DD$; the map is obtained by
      maximizing $\abs{f'(z_0)}$ over the injective holomorphic $f\colon\Omega\to\DD$ with
      $f(z_0)=0$, a maximum that Montel's theorem and Hurwitz's theorem show is attained.
      Montel's theorem for omitted values: a family of holomorphic functions on $\Omega$ that
      all omit the same two complex values is normal in the sense that every sequence has a
      subsequence converging uniformly on compact subsets either to a holomorphic function or
      to $\infty$. It implies Picard's great theorem: in every punctured neighbourhood of an
      essential singularity, a function takes every complex value, with at most one exception,
      infinitely often.
    topics:
