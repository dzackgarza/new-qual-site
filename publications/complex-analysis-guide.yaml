schema: qual/publication@2
id: GUIDE-COMPLEX-ANALYSIS
kind: study-guide
title: Complex Analysis
lede: 'Read the subject in three arcs and a problem bank. The first arc is what has
  to be in place before any integral is taken: the plane and its elementary functions,
  the convergence tests that make a power series a function on a disc, the complex
  derivative, and the harmonic pair the Cauchy-Riemann equations produce from it.
  The second arc is Cauchy theory and everything it forces, which is most of the subject:
  the integral formula, the local normal form it gives zeros and singularities, the
  count the argument principle extracts from that, and the residue calculus the count
  specialises to. The third arc is the geometric side, where the question is which
  domains a holomorphic bijection can carry onto a disc and what a limit of holomorphic
  functions can be. Each section closes with panels drawn from the qualifying exams,
  so the theory is read next to the problems it was built to answer, and the last
  section gathers the problems that belong to no single section.'
sections:
  - slug: complex-arithmetic-and-elementary-functions
    title: Complex Arithmetic and the Elementary Functions
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: 'Nothing here is yet about holomorphy. It is about having the plane and its
      standard functions at hand, because every later estimate is finally a computation
      in them. The exponential is the whole content: sine and cosine are its even and
      odd parts along the imaginary axis, the hyperbolic pair is the same combination
      along the real axis, and the two families therefore differ by a rotation, which
      is the identity every contour argument on a rectangle later runs on. Inverting
      the exponential is where the subject first refuses to cooperate. The logarithm
      cannot be defined continuously on a punctured plane, only on a slit one, and fixing
      a branch is a choice that later integrals pay for making: the monodromy factor
      a keyhole contour collects is exactly the discontinuity recorded here. Complex
      powers inherit the same ambiguity through the same definition.'
    items:
