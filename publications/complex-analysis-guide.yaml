sections:
  - slug: complex-arithmetic-and-elementary-functions
    title: Complex Arithmetic and the Elementary Functions
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: 'Complex exponentials define trigonometric and hyperbolic functions. A continuous
      logarithm does not exist on the punctured plane; choosing a branch on a slit plane defines
      complex powers there. The boundary values of that branch determine the jump across the
      slit in a keyhole-contour integral.'
    topics:
      - Geometry
      - Trigonometry
      - Hyperbolic Functions
      - Complex Logarithm
