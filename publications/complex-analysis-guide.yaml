  - slug: conformal-maps-and-the-disc
    title: Conformal Maps and the Disc
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: 'A holomorphic map is locally injective where its derivative is nonzero. An injective
      holomorphic map has holomorphic inverse on its image. Möbius transformations act on
      the Riemann sphere, and the Cayley transform identifies a half-plane with the unit disc.
      Schwarz''s lemma bounds disc self-maps fixing the origin; its equality case determines
      rotations. Composing with disc automorphisms that move a point to the origin gives the
      general automorphism formula and Schwarz–Pick inequalities.'
    topics:
      - Conformal Maps
      - Fractional Linear Transformations
      - Schwarz Lemma
      - Blaschke Factors
      - Biholomorphisms
