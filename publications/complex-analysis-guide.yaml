  - slug: zeros-and-singularities
    title: Zeros and Singularities
    parent: cauchy-theory
    lede: "The power series expansion from the last section is a local normal form,
      and this section reads it off. A nonzero function's zero has a finite order because
      some coefficient is the first nonzero one, so zeros factor as a power times a
      nonvanishing function and are therefore isolated. Allowing negative powers classifies
      an isolated singularity by its principal part: none makes it removable, which
      Riemann's theorem shows is detected by mere boundedness; finitely many makes
      it a pole, whose leading coefficient is the residue; infinitely many makes it
      essential, where Casorati-Weierstrass shows the image of every punctured neighborhood
      is dense. Meromorphic means the only singularities are poles, which is the hypothesis
      the next two sections run on."
    items:
      - ref: PR-5A64G
      - ref: PR-EWOP5
      - ref: T-4XPWL
