  - slug: cauchy-theory
    title: Cauchy theory
    parent: GUIDE-COMPLEX-ANALYSIS
    lede: >-
      Cauchy's theorem: if $f$ is holomorphic on a simply connected domain $\Omega$, then
      $\oint_\gamma f\,dz=0$ for every closed piecewise smooth curve $\gamma$ in $\Omega$.
      Cauchy's integral formula: if $f$ is holomorphic on an open set containing the closed
      disc $\abs{w-a}\le r$, then $f^{(n)}(z)=\frac{n!}{2\pi
      i}\oint_{\abs{w-a}=r}\frac{f(w)}{(w-z)^{n+1}}\,dw$ for $\abs{z-a}<r$ and $n\ge0$.
      Expanding $\frac{1}{w-z}$ as a geometric series in $\frac{z-a}{w-a}$ shows that $f$
      equals its Taylor series on $\abs{z-a}<r$, so holomorphic functions are analytic. If
      $\abs{f}\le M$ on $\abs{w-a}=r$, Cauchy's estimate gives $\abs{f^{(n)}(a)}\le
      n!\,M/r^n$, and Liouville's theorem follows: a bounded entire function is constant. The
      case $n=0$ gives the mean value property
      $f(a)=\frac{1}{2\pi}\int_0^{2\pi}f(a+re^{i\theta})\,d\theta$, from which the maximum
      modulus principle follows: if $\abs{f}$ attains a maximum at a point of a domain, then
      $f$ is constant. Identity theorem: two holomorphic functions on a domain that agree on a
      set with a limit point in the domain are equal. Morera's theorem: a continuous function
      on $\Omega$ whose integral over the boundary of every closed triangle in $\Omega$
      vanishes is holomorphic.
    topics:
      - Liouville's Theorem
      - Entire Functions
      - Cauchy Estimates
      - Identity Theorem
      - Morera
      - Maximum Modulus Principle
      - Cauchy Integral Formula
      - Cauchy Integral Theorem
