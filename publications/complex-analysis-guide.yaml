  - slug: special-functions-and-factorization
    title: Special Functions and Factorization
    parent: normal-families-and-omitted-values
    lede: 'A holomorphic function is determined by its zeros up to a nonvanishing factor,
      and a nonvanishing entire function is an exponential, so an entire function should
      be reconstructible from its zero set. Weierstrass makes that literal with convergence
      factors that let an infinite product over infinitely many zeros converge, and
      Hadamard sharpens it for functions of finite order, where the exponential factor
      is a polynomial of bounded degree. The classical functions are what the machinery
      was built for: the product for sine is the identity behind the summation formulas
      evaluated by residues two sections back, and Gamma and zeta are the standard examples
      of meromorphic continuation past the half-plane where their integral and series
      converge. This section is under-filled relative to the others and should be read
      as a pointer rather than a treatment. The corpus carries the definitions and the
      statements but almost no worked problems, several of its Gamma and zeta cards
      are images with no text, and the Weierstrass elliptic function has no statement
      at all; those gaps are recorded on issue #2.'
    items:
