  - slug: holomorphy-and-analyticity
    title: Holomorphy and Analyticity
    parent: series-and-convergence
    lede: 'Complex differentiability implies the Cauchy–Riemann equations. Conversely, continuously
      differentiable real and imaginary parts satisfying those equations define a holomorphic
      function. A convergent power series is holomorphic in its disc of convergence. [Cauchy
      Theory](cauchy-theory.html) proves that holomorphic functions have local power-series
      expansions; their real and imaginary parts are harmonic.'
    topics:
      - Cauchy-Riemann
      - Holomorphic Functions
