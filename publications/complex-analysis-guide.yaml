  - slug: holomorphy-and-analyticity
    title: Holomorphy and analyticity
    parent: series-and-convergence
    lede: >-
      A function $f=u+iv$ on an open set $\Omega\subseteq\CC$ is holomorphic if
      $f'(z)=\lim_{h\to0}\frac{f(z+h)-f(z)}{h}$ exists at every $z\in\Omega$. Taking the limit
      along real and along imaginary $h$ gives the Cauchy--Riemann equations $u_x=v_y$,
      $u_y=-v_x$, equivalently $\partial f/\partial\bar z=0$; conversely, if $u$ and $v$ are
      continuously differentiable and satisfy these equations, then $f$ is holomorphic. A
      function is analytic on $\Omega$ if it is given by a convergent power series on a
      neighbourhood of each point. A power series is holomorphic on its disc of convergence,
      with derivative the termwise derivative, so analytic functions are holomorphic; the
      converse follows from the Cauchy integral formula ([Cauchy theory](cauchy-theory.html)).
      If $u$ and $v$ are twice continuously differentiable, the Cauchy--Riemann equations give
      $\Delta u=\Delta v=0$.
    topics:
      - Cauchy-Riemann
      - Holomorphic Functions
