  - slug: conformal-maps-and-the-disc
    title: Conformal Maps and the Disc
    parent: residues
    lede: >-
      Openness and the local factorization of zeros say when a holomorphic map is locally
      injective: exactly where the derivative does not vanish, which is the definition of
      conformal, and injectivity then makes the inverse holomorphic for free. So the question
      becomes which domains are biholomorphic. Mobius transformations answer it for the model
      domains, since a cross-ratio construction sends any three points to any other three and
      the Cayley transform identifies the half-plane with the disc. For the disc itself the
      Schwarz lemma is the constraint: a self-map fixing the origin cannot expand, and equality
      anywhere forces a rotation. Composing with the Blaschke factors, which are the involutions
      moving a chosen point to the origin, removes the fixing hypothesis and pins down the
      automorphism group exactly.
    items:
