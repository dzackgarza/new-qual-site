      - Minimal and Characteristic Polynomials
      - Linear Transformations
      - Multilinear Algebra
    items: []
  - slug: representation-theory
    title: Representation theory
    parent: matrix-analysis
    lede: >-
      A complex representation of a finite group $G$ is a homomorphism $\rho\colon G\to\GL(V)$
      for a finite-dimensional complex vector space $V$. Averaging an inner product on $V$
      over $G$ gives a $G$-invariant inner product, for which every $\rho(g)$ is unitary, and
      by Maschke's theorem $V$ is a direct sum of irreducible representations. The character
      $\chi_V(g)=\operatorname{tr}\rho(g)$ is constant on conjugacy classes. The irreducible
      characters form an orthonormal basis of the space of class functions for
      $\inner{\chi}{\psi}=\frac{1}{\abs{G}}\sum_{g\in G}\chi(g)\overline{\psi(g)}$, so the
      multiplicity of an irreducible representation $W$ in $V$ is $\inner{\chi_V}{\chi_W}$.
      The number of irreducible characters equals the number of conjugacy classes, and
      $\sum_W(\dim W)^2=\abs{G}$, the sum taken over the irreducible representations. For a
      subgroup $H\le G$, induction and restriction satisfy Frobenius reciprocity,
      $\inner{\operatorname{Ind}_H^G\psi}{\chi}_G=\inner{\psi}{\operatorname{Res}^G_H\chi}_H$.
    topics:
      - Representation Theory
      - Character Theory
      - Group Algebras
      - Group Theory
      - Group Actions
      - p-Groups
      - Abelian Groups
      - Classification
      - Modules
    items: []
  - slug: symmetric-functions
    title: Symmetric functions and the symmetric group
    parent: representation-theory
    lede: >-
      The conjugacy classes of $S_n$ are indexed by the partitions of $n$ through cycle type,
      and so are its irreducible complex representations, the Specht modules $S^\lambda$. The
      dimension of $S^\lambda$ is the number of standard Young tableaux of shape $\lambda$,
      and the Murnaghan--Nakayama rule evaluates the character $\chi^\lambda$ on a class as a
      signed sum over successive removals of rim hooks. The Frobenius characteristic map is an
      isometry from the class functions on $S_n$, with the character inner product, to the
      homogeneous symmetric functions of degree $n$, with the Hall inner product; it sends
      $\chi^\lambda$ to the Schur function $s_\lambda$ and the character of
      $\operatorname{Ind}_{S_m\times S_k}^{S_{m+k}}(V\boxtimes W)$ to the product of the
      images of $V$ and $W$. The Littlewood--Richardson coefficients $c^\nu_{\lambda\mu}$ in
      $s_\lambda s_\mu=\sum_\nu c^\nu_{\lambda\mu}s_\nu$ count Littlewood--Richardson
      tableaux. Pólya enumeration counts the orbits of a finite permutation group on
      colourings by Burnside's lemma, through the cycle index of the group.
    topics:
      - Symmetric Functions
      - Tableaux
      - Littlewood-Richardson Rule
      - Permutations
      - Combinatorics
      - Generating Functions
      - Pólya Enumeration
    items: []
  - slug: grobner-bases-and-varieties
    title: Gröbner bases and varieties
    parent: GUIDE-APPLIED-ALGEBRA
    lede: >-
      Fix a monomial order on $k[x_1,\ldots,x_n]$. A Gröbner basis of an ideal $I$ is a finite
      subset of $I$ whose leading terms generate the initial ideal $\operatorname{in}(I)$, and
      Buchberger's algorithm computes one from any finite generating set. The remainder of $f$
      on division by a Gröbner basis is unique, and $f\in I$ if and only if that remainder is
      $0$. For the lexicographic order with $x_1>\cdots>x_n$ and a Gröbner basis $G$ of $I$,
      $G\cap k[x_{j+1},\ldots,x_n]$ is a Gröbner basis of the elimination ideal $I\cap
      k[x_{j+1},\ldots,x_n]$, which solves a polynomial system one variable at a time. For any
      field, $f\in\sqrt{I}$ if and only if $1\in I+(1-yf)\subseteq k[x_1,\ldots,x_n,y]$ (the
      Rabinowitsch trick). For $k$ algebraically closed, Hilbert's Nullstellensatz states that
      $f$ vanishes on $V(I)$ if and only if $f\in\sqrt{I}$, and $V(I)$ is finite if and only
      if $\dim_kk[x_1,\ldots,x_n]/I<\infty$; the monomials not in $\operatorname{in}(I)$ form
      a $k$-basis of $k[x_1,\ldots,x_n]/I$.
    topics:
      - Gröbner Bases
      - Ideals
      - Commutative Algebra
      - Integral Domains
      - Polynomial Systems
    items: []
  - slug: invariant-theory
    title: Invariant theory
    parent: grobner-bases-and-varieties
    lede: >-
      Let a finite group $G$ act linearly on $\CC^n$ through a representation $\rho$, and so
      on $\CC[x_1,\ldots,x_n]$. The invariant ring $\CC[x_1,\ldots,x_n]^G$ is finitely
      generated, and the Reynolds operator $f\mapsto\frac{1}{\abs{G}}\sum_{g\in G}g\cdot f$ is
      a projection onto it; by Noether's bound, its values on the monomials of degree at most
      $\abs{G}$ generate the invariant ring, and a Gröbner basis computation finds the
      relations among generators. Molien's formula expresses the Hilbert series through
      $\rho$:
      $\sum_{d\ge0}\dim_\CC\big(\CC[x_1,\ldots,x_n]^G\big)_d\,t^d=\frac{1}{\abs{G}}\sum_{g\in
      G}\frac{1}{\det(I-t\rho(g))}$. The Hilbert series depends on $\rho$ and not only on the
      abstract group: the subgroups $\{\pm I\}$ and $\{I,\operatorname{diag}(1,-1)\}$ of
      $\GL_2(\CC)$ are both cyclic of order $2$, with Hilbert series $\frac{1+t^2}{(1-t^2)^2}$
      and $\frac{1}{(1-t)(1-t^2)}$.
    topics:
      - Invariant Theory
    items: []
