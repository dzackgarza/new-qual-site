schema: qual/publication@2
id: GUIDE-APPLIED-ALGEBRA
kind: study-guide
title: Applied Algebra
lede: >-
  Applied algebra: matrix analysis, representations of finite groups, symmetric functions,
  polynomial ideals, and invariant theory.
sections:
  - slug: matrix-analysis
    title: Matrix Analysis
    parent: GUIDE-APPLIED-ALGEBRA
    lede: >-
      Hermitian matrices have real eigenvalues, characterized by Rayleigh quotients and the
      Courant–Fischer theorem. Interlacing gives inequalities for eigenvalues of principal
      submatrices. Complex normal matrices are unitarily diagonalizable, while every complex
      matrix has a singular value decomposition. Polar decomposition factors a square matrix
      as a unitary matrix times a positive semidefinite matrix. Rank sequences determine the
      sizes of Jordan blocks for a nilpotent operator.
    topics:
      - Linear Algebra
      - Inner Product Spaces
      - Norms
      - Hermitian Matrices
      - Positive Definite Matrices
      - Normal Operators
      - Singular Values
      - Diagonalization
      - Jordan Canonical Form
      - Minimal and Characteristic Polynomials
      - Linear Transformations
      - Multilinear Algebra
    items: []
  - slug: representation-theory
    title: Representation Theory
    parent: matrix-analysis
    lede: >-
      Averaging a Hermitian inner product over a finite group makes a complex representation
      unitary. Maschke's theorem decomposes it into irreducibles. Characters are traces and
      hence class functions; their inner products give multiplicities. The number of irreducible
      characters equals the number of conjugacy classes, and the sum of squared irreducible
      dimensions is the group order. Induction and restriction connect representations of
      a group and a subgroup, with Frobenius reciprocity expressing their adjunction.
    topics:
      - Representation Theory
      - Character Theory
      - Group Algebras
      - Group Theory
      - Group Actions
      - p-Groups
      - Abelian Groups
      - Classification
      - Modules
    items: []
  - slug: symmetric-functions
    title: Symmetric Functions and the Symmetric Group
    parent: representation-theory
    lede: >-
      For complex representations of $S_n$, partitions index the irreducible Specht modules
      and standard Young tableaux count their dimensions. The Murnaghan–Nakayama rule computes
      character values by removing rim hooks. The Frobenius characteristic map sends irreducible
      characters to Schur functions and identifies the character inner product with the Hall
      inner product. Induction from products of symmetric groups corresponds to multiplication
      of symmetric functions; the Littlewood–Richardson rule gives the coefficients in the
      Schur basis. Pólya counting and generating functions give related enumeration methods.
    topics:
      - Symmetric Functions
      - Tableaux
      - Littlewood-Richardson Rule
      - Permutations
      - Combinatorics
      - Generating Functions
      - Pólya Enumeration
    items: []
  - slug: grobner-bases-and-varieties
    title: Gröbner Bases and Varieties
    parent: GUIDE-APPLIED-ALGEBRA
    lede: >-
      For a polynomial ring over a field, a monomial order and a Gröbner basis give a division
      procedure that decides ideal membership. Elimination orders compute elimination ideals.
      Over an algebraically closed field, the Nullstellensatz identifies the ideal of the
      zero set with the radical of the original ideal. The Rabinowitsch trick reduces radical
      membership to ideal membership in an enlarged polynomial ring. For a zero-dimensional
      ideal, the monomials outside the initial ideal form a finite basis of the quotient as
      a vector space.
    topics:
      - Gröbner Bases
      - Ideals
      - Commutative Algebra
      - Integral Domains
      - Polynomial Systems
    items: []
  - slug: invariant-theory
    title: Invariant Theory
    parent: grobner-bases-and-varieties
    lede: >-
      A linear action of a finite group on a complex polynomial ring defines a finitely generated
      invariant subring. Averaging gives the Reynolds operator, and Molien's formula computes
      the Hilbert series from the matrices of the action. These constructions connect [Representation
      Theory](representation-theory.html) with [Gröbner Bases and Varieties](grobner-bases-and-varieties.html).
      The Hilbert series depends on the representation: isomorphic abstract groups can have
      actions with different invariant rings.
    topics:
      - Invariant Theory
    items: []
