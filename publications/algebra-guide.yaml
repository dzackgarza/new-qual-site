  - slug: structure-theorem
    title: The structure theorem over a PID
    parent: modules
    lede: >-
      Let $R$ be a principal ideal domain and $M$ a finitely generated $R$-module. Then
      $M\cong R^r\oplus R/(d_1)\oplus\cdots\oplus R/(d_s)$ for nonzero nonunits $d_1\mid
      d_2\mid\cdots\mid d_s$ (invariant factors), and $M\cong
      R^r\oplus\bigoplus_iR/(p_i^{e_i})$ for primes $p_i$ (elementary divisors); the rank $r$,
      the ideals $(d_j)$, and the multiset of ideals $(p_i^{e_i})$ are determined by $M$. The
      Smith normal form of a presentation matrix of $M$ computes the invariant factors. For
      $R=\ZZ$ the theorem classifies finitely generated abelian groups. For $R=F[x]$ with $F$
      a field, a finite-dimensional $F$-vector space with an operator $T$ is an $F[x]$-module
      on which $x$ acts as $T$, and the theorem gives the [canonical
      forms](canonical-forms.html) of $T$.
    topics:
      - Structure Theorem
      - Smith Normal Form
