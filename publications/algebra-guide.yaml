  - slug: galois-theory
    title: Galois theory
    parent: fields-and-extensions
    lede: >-
      A finite extension $L/K$ is Galois if it is normal and separable, equivalently if the
      fixed field of $\Aut(L/K)$ is $K$, equivalently if $\abs{\Aut(L/K)}=[L:K]$. For $L/K$
      finite Galois with group $G$, $H\mapsto L^H$ is an inclusion-reversing bijection from
      the subgroups of $G$ to the intermediate fields, with $[L:L^H]=\abs{H}$; the extension
      $L^H/K$ is Galois if and only if $H\trianglelefteq G$, and then $\Gal(L^H/K)\cong G/H$.
      The Galois group of a separable polynomial of degree $n$ embeds in $S_n$ through its
      action on the roots, as a transitive subgroup when the polynomial is irreducible; in
      characteristic different from $2$ it lies in $A_n$ if and only if the discriminant is a
      square in $K$. For an irreducible separable quartic, the factorization of the resolvent
      cubic and whether the discriminant is a square determine the Galois group among $S_4$,
      $A_4$, $V_4$, and $\{D_4,C_4\}$.
