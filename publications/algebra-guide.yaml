  - slug: permutation-groups
    title: Permutation groups
    parent: group-actions-and-counting
    lede: >-
      By Cayley's theorem, left multiplication embeds a group $G$ in the symmetric group on
      the set $G$. The sign $\operatorname{sgn}\colon S_n\to\{\pm1\}$ is a homomorphism, and a
      cycle of length $\ell$ has sign $(-1)^{\ell-1}$. Two permutations in $S_n$ are conjugate
      if and only if they have the same cycle type, so the conjugacy classes of $S_n$
      correspond to the partitions of $n$. The alternating group $A_n$ is simple for $n\ge5$,
      so $S_n$ is not solvable for $n\ge5$. The Galois group of an irreducible separable
      polynomial of degree $n$ is a transitive subgroup of $S_n$.
    topics:
      - Permutations
      - Simple Groups
      - Partitions
