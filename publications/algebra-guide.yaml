  - slug: galois-theory
    title: Galois Theory
    parent: fields-and-extensions
    lede: 'For a finite extension, being Galois is equivalent to being normal and separable,
      and to having as many base-field automorphisms as its degree. The Galois correspondence
      is an inclusion-reversing bijection between intermediate fields and subgroups. Field
      degrees over the base correspond to subgroup indices. Normal intermediate extensions
      correspond to normal subgroups, with the quotient group acting as their Galois group.
      The Galois group of an irreducible separable polynomial acts transitively on its roots.
      In characteristic different from two, the discriminant detects whether this group lies
      in the alternating group. Resolvents provide further information for quartics.'
    topics:
      - Galois Theory
