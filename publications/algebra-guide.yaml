  - slug: canonical-forms
    title: Canonical Forms
    parent: structure-theorem
    lede: 'A linear operator on a finite-dimensional vector space defines a module over the
      polynomial ring in one variable. The [structure theorem](structure-theorem.html) gives
      rational canonical form through invariant factors and Jordan form when the characteristic
      polynomial splits. For each eigenvalue, its exponent in the minimal polynomial is the
      largest Jordan-block size; its exponent in the characteristic polynomial is the sum
      of those sizes; its eigenspace dimension is the number of blocks. An operator is diagonalizable
      precisely when its minimal polynomial is a product of distinct linear factors.'
    topics:
      - Canonical Forms
      - Minimal and Characteristic Polynomials
      - Jordan Canonical Form
      - Rational Canonical Form
