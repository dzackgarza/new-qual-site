  - slug: fields-and-extensions
    title: Fields and Extensions
    parent: factorization-and-polynomials
    lede: 'Field degrees multiply in finite towers. An algebraic element generates a finite
      extension whose degree is that of its minimal polynomial. A finite normal extension
      is a splitting field; separability requires the minimal polynomials to have distinct
      roots. The derivative criterion detects repeated roots. Every algebraic extension of
      a perfect field is separable. Finite fields of the same order are isomorphic, and their
      finite extensions are Galois.'
    topics:
