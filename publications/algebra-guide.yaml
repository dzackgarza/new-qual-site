  - slug: group-actions-and-counting
    title: Group Actions and Counting
    parent: groups-and-subgroups
    lede: "An action turns a group into arithmetic. Orbit-stabilizer says an orbit has
      the size of the index of any of its stabilizers, so every orbit count divides
      the order of the group. Conjugation is the action of a group on itself: its orbits
      are the conjugacy classes, its stabilizers are the centralizers, and reading orbit-stabilizer
      for it gives the class equation. Two consequences carry the rest of finite group
      theory. A p-group has a nontrivial center, because every nontrivial class has
      size divisible by p and the identity is not enough to make the count work; and
      Burnside's lemma counts orbits as the average number of fixed points, which is
      what makes colouring problems finite computations."
