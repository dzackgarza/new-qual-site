  - slug: commutative-algebra
    title: Commutative algebra
    parent: factorization-and-polynomials
    lede: >-
      For a multiplicative submonoid $S$ of a commutative ring $R$, the localization $S^{-1}R$
      is the initial ring under $R$ in which every element of $S$ is a unit. For a prime ideal
      $\mathfrak p$, $R_\mathfrak p=(R\setminus\mathfrak p)^{-1}R$ is a local ring with
      maximal ideal $\mathfrak pR_\mathfrak p$. Nakayama's lemma: for a finitely generated
      module $M$ over a local ring $(R,\mathfrak m)$, $\mathfrak mM=M$ implies $M=0$. The
      nilradical of $R$, the set of nilpotent elements, is the intersection of all prime
      ideals; the Jacobson radical is the intersection of all maximal ideals; and for a
      finitely generated algebra over a field the two coincide. A ring is Noetherian if every
      ideal is finitely generated, and by Hilbert's basis theorem $R[x]$ is Noetherian when
      $R$ is Noetherian.
    topics:
