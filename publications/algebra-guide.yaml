  - slug: linear-algebra
    title: Linear Algebra
    parent: modules
    lede: "Vector spaces are modules over a field. In finite dimension, rank and nullity sum
      to the dimension, and nondegeneracy of a bilinear form is equivalent to invertibility
      of its Gram matrix. In characteristic different from two, polarization identifies quadratic
      forms with symmetric bilinear forms. Over the reals, symmetric matrices are orthogonally
      diagonalizable, and signature classifies nondegenerate symmetric forms up to change
      of basis. Classical matrix groups preserve specified forms; ordered-basis counts give
      their orders over finite fields. This section also includes problems on Toeplitz operators,
      polar decomposition, and the spectral theorem on a Hilbert space."
    topics:
