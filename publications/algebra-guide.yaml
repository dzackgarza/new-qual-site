  - slug: fields-and-extensions
    title: Fields and Extensions
    parent: factorization-and-polynomials
    lede: 'An extension of fields is a vector space over the base, and its degree is
      multiplicative in towers, which converts questions about roots into arithmetic.
      An element is algebraic exactly when it generates a finite extension, and the
      degree of that extension is the degree of its minimal polynomial. Two conditions
      on an extension then matter separately: normal, meaning every irreducible with
      one root has all of them, which is the same as being a splitting field; and separable,
      meaning no minimal polynomial has a repeated root, which the derivative test detects
      and which is automatic over a perfect field. Finite fields are the case where
      both hold for free and everything is determined by the order.'
