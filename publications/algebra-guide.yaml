  - slug: commutative-algebra
    title: Commutative Algebra
    parent: factorization-and-polynomials
    lede: "Localization inverts a submonoid of the multiplicative monoid of a ring. Localization
      at a prime gives a local ring $(R_{\\mathfrak p},\\mathfrak pR_{\\mathfrak p})$. For
      a finitely generated module over a local ring, Nakayama's lemma gives $M=0$ if $\\mathfrak
      mM=M$. The nilradical is the intersection of the prime ideals; the Jacobson radical
      is the intersection of the maximal ideals. They agree for a finitely generated algebra
      over a field. Hilbert's basis theorem states that a polynomial ring over a Noetherian
      ring is Noetherian."
    topics:
