  - slug: canonical-forms
    title: Canonical forms
    parent: structure-theorem
    lede: >-
      A linear operator $T$ on a finite-dimensional vector space $V$ over a field $F$ makes
      $V$ a finitely generated torsion $F[x]$-module, to which [the structure
      theorem](structure-theorem.html) applies. The invariant factors $d_1\mid\cdots\mid d_s$
      give the rational canonical form, the block diagonal matrix of their companion matrices,
      which exists over every field; $d_s$ is the minimal polynomial of $T$ and $d_1\cdots
      d_s$ its characteristic polynomial. When the characteristic polynomial splits over $F$,
      the elementary divisors $(x-\lambda)^e$ give the Jordan form. For an eigenvalue
      $\lambda$, the exponent of $x-\lambda$ in the minimal polynomial is the size of the
      largest Jordan block for $\lambda$, its exponent in the characteristic polynomial is the
      sum of the sizes of the Jordan blocks for $\lambda$, and $\dim\ker(T-\lambda)$ is the
      number of those blocks. $T$ is diagonalizable if and only if its minimal polynomial is a
      product of distinct linear factors in $F[x]$.
    topics:
      - Canonical Forms
      - Minimal and Characteristic Polynomials
      - Jordan Canonical Form
      - Rational Canonical Form
