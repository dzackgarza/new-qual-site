id: GUIDE-ALGEBRA
kind: study-guide
title: Algebra
lede: 'The core topics of graduate qualifying algebra: counting arguments and Sylow theorems on finite groups, ideal theory and factorization in commutative rings, module structure over PIDs with applications to canonical forms, and Galois theory for field extensions.'
sections:
  - slug: preliminaries
    title: Preliminaries
    parent: GUIDE-ALGEBRA
    lede: >-
      Zorn's lemma: a nonempty partially ordered set in which every chain has an upper bound
      has a maximal element. It gives a maximal ideal containing any proper ideal of a ring
      with $1$, an algebraic closure of every field, and a basis of every vector space.
      Euler's totient $\varphi(n)$ is the number of generators of a cyclic group of order $n$
      and the degree $[\QQ(\zeta_n):\QQ]$ of the $n$th cyclotomic field. The Chinese remainder
      theorem gives $R/(I\cap J)\cong R/I\times R/J$ for comaximal ideals $I,J$ of a
      commutative ring $R$, in particular $\ZZ/mn\ZZ\cong\ZZ/m\ZZ\times\ZZ/n\ZZ$ for coprime
      $m,n$. Euler's theorem $a^{\varphi(n)}\equiv1\pmod{n}$ for $\gcd(a,n)=1$ is Lagrange's
      theorem in $(\ZZ/n\ZZ)^\times$, and Fermat's little theorem is its case $n=p$ prime.
    topics:
      - Zorn's Lemma
      - Number Theory
      - Chinese Remainder Theorem
