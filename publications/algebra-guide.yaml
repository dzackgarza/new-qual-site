  - slug: sylow-theory
    title: Sylow theory
    parent: group-actions-and-counting
    lede: >-
      Let $G$ be a finite group with $\abs{G}=p^km$, $p$ prime and $p\nmid m$. The Sylow
      theorems, proved with the actions of [group actions and
      counting](group-actions-and-counting.html): $G$ has a subgroup of order $p^k$; every
      $p$-subgroup of $G$ is contained in one, and any two are conjugate; and their number
      $n_p$ divides $m$ and satisfies $n_p\equiv1\pmod{p}$. A Sylow $p$-subgroup is normal if
      and only if $n_p=1$. Frattini's argument: if $N\trianglelefteq G$ and $P$ is a Sylow
      $p$-subgroup of $N$, then $G=N_G(P)\,N$.
    topics:
      - Sylow Theory
      - p-Groups
