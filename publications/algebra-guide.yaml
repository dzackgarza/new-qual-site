  - slug: series-and-solvability
    title: Series, solvability, and nilpotence
    parent: group-actions-and-counting
    lede: >-
      A composition series of a finite group $G$ is a chain $1=G_0\trianglelefteq
      G_1\trianglelefteq\cdots\trianglelefteq G_r=G$ with every factor $G_{i+1}/G_i$ simple;
      by the Jordan--Hölder theorem, the factors, with multiplicity and up to isomorphism, do
      not depend on the series. A group is solvable if its derived series
      $G\trianglerighteq[G,G]\trianglerighteq[[G,G],[G,G]]\trianglerighteq\cdots$ reaches $1$;
      a finite group is solvable if and only if its composition factors are cyclic of prime
      order. A group is nilpotent if its lower central series
      $G\trianglerighteq[G,G]\trianglerighteq[G,[G,G]]\trianglerighteq\cdots$ reaches $1$.
      Nilpotent groups are solvable, and $S_3$ is solvable and not nilpotent. A finite group
      is nilpotent if and only if every Sylow subgroup is normal, if and only if it is the
      direct product of its Sylow subgroups. The symmetric group $S_n$ is solvable if and only
      if $n\le4$.
    topics:
      - Subgroup Series
      - Solvable Groups
      - Nilpotent Groups
      - Commutators
