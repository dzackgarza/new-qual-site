  - slug: rings-and-ideals
    title: Rings and ideals
    parent: preliminaries
    lede: >-
      Let $R$ be a commutative ring with $1$. The ideals of $R$ are exactly the kernels of
      ring homomorphisms out of $R$, and the isomorphism theorems hold for quotient rings. An
      ideal $P$ is prime if and only if $R/P$ is an integral domain, and maximal if and only
      if $R/P$ is a field; so every maximal ideal is prime, and $(0)\subseteq\ZZ$ is prime and
      not maximal. By Zorn's lemma ([preliminaries](preliminaries.html)), every proper ideal
      of $R$ is contained in a maximal ideal.
    topics:
