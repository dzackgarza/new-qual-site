  - slug: structure-theorem
    title: The Structure Theorem over a PID
    parent: modules
    lede: One theorem subsumes two apparently unrelated classifications. A finitely
      generated module over a principal ideal domain is a free part plus a torsion part,
      and the torsion part is a sum of cyclic modules recorded either by invariant factors,
      each dividing the next, or by elementary divisors, the prime powers. Over the
      integers this is the classification of finitely generated abelian groups. Over
      the polynomial ring in one variable it is the classification of linear operators,
      because a vector space with an operator is exactly a module over that ring --
      which is why the next-to-last section of this guide is about canonical forms.
