  - slug: factorization-and-polynomials
    title: Factorization and Polynomials
    parent: rings-and-ideals
    lede: "Every field is a Euclidean domain, every Euclidean domain is a principal ideal
      domain, and every principal ideal domain is a unique factorization domain. In a domain
      every prime element is irreducible; the converse holds in a unique factorization domain
      but can fail in $\\mathbb Z[\\sqrt{-5}]$. Gauss's lemma relates factorization of primitive
      integer polynomials to factorization over the rationals. Eisenstein's criterion and
      degree-preserving reduction modulo a prime give sufficient conditions for irreducibility."
    topics:
