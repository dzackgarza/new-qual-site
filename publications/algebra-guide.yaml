id: GUIDE-ALGEBRA
kind: study-guide
title: Algebra
lede: 'Algebra: finite groups, commutative rings, modules, field extensions, and linear algebra.'
sections:
  - slug: preliminaries
    title: Preliminaries
    parent: GUIDE-ALGEBRA
    lede: "Zorn's lemma gives maximal elements in nonempty posets whose chains have upper
      bounds. Applications include maximal ideals containing a proper ideal and bases of vector
      spaces. Euler's totient counts generators of a finite cyclic group. The Chinese remainder
      theorem decomposes cyclic groups of composite order into factors of coprime orders.
      Fermat's little theorem and Euler's theorem give congruences from multiplicative orders."
    topics:
      - Zorn's Lemma
      - Number Theory
      - Chinese Remainder Theorem
