  - slug: factorization-and-polynomials
    title: Factorization and Polynomials
    parent: rings-and-ideals
    lede: "Unique factorization is not automatic, and the chain fields, Euclidean domains,
      principal ideal domains, unique factorization domains, integral domains records
      exactly how much of it survives each weakening. Prime and irreducible are the
      two notions that come apart: prime always implies irreducible, and the converse
      holds in a unique factorization domain and fails in the ring of integers adjoined
      a square root of minus five, which is the standard witness. For polynomials the
      questions become effective: Gauss's lemma moves irreducibility between the integers
      and the rationals, Eisenstein certifies it from a single prime, and reduction
      modulo a prime certifies it by finite computation."
