  - slug: factorization-and-polynomials
    title: Factorization and polynomials
    parent: rings-and-ideals
    lede: >-
      Among integral domains, fields $\subsetneq$ Euclidean domains $\subsetneq$ principal
      ideal domains $\subsetneq$ unique factorization domains $\subsetneq$ integral domains.
      In an integral domain every prime element is irreducible, and in a unique factorization
      domain every irreducible element is prime. In $\ZZ[\sqrt{-5}]$ the element $2$ is
      irreducible and not prime: it divides $(1+\sqrt{-5})(1-\sqrt{-5})=6$ and neither factor.
      Gauss's lemma: a primitive polynomial of positive degree in $\ZZ[x]$ is irreducible in
      $\ZZ[x]$ if and only if it is irreducible in $\QQ[x]$. Eisenstein's criterion: if a
      prime $p$ divides every coefficient of $f\in\ZZ[x]$ except the leading one, does not
      divide the leading coefficient, and $p^2$ does not divide the constant term, then $f$ is
      irreducible in $\QQ[x]$. If $p$ does not divide the leading coefficient of $f\in\ZZ[x]$
      and the reduction of $f$ in $\FF_p[x]$ is irreducible, then $f$ is irreducible in
      $\QQ[x]$.
    topics:
