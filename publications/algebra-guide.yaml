  - slug: commutative-algebra
    title: Commutative Algebra
    parent: factorization-and-polynomials
    lede: "Localization inverts a multiplicative set and is how a ring is studied one
      prime at a time: localizing at a prime produces a local ring, whose single maximal
      ideal is what makes Nakayama's lemma -- a finitely generated module killed by
      its maximal ideal is zero -- into the workhorse it is. The nilradical and the
      Jacobson radical are the two intersections that measure different defects, the
      first of all primes and the second of all maximal ideals, and they agree for a
      finitely generated algebra over a field. The Noetherian condition is what keeps
      all of this finite, and Hilbert's basis theorem is what says polynomial rings
      inherit it.

      This section is where the guide leans hardest on the flashcard layer: several
      of these results appear in the corpus only as a stated fact with its geometric
      reading and no worked problem, which is honest about what the source pages contain."
