schema: qual/publication@2
id: GUIDE-ALGEBRA
kind: study-guide
title: Algebra
lede: Follow one dependency-ordered path from finite-group counting through actions
  and Sylow theory, then apply the results without leaving the subject traversal.
sections:
- slug: finite-groups
  title: Finite Groups
  parent: GUIDE-ALGEBRA
  lede: Begin with subgroup indices and prime-order existence. These results constrain
    what a finite group can contain before an action is chosen.
  items:
  - ref: T-SZRXI
  - ref: T-XDMK2
- slug: actions-and-counting
  title: Actions and Counting
  parent: finite-groups
  lede: 'Turn actions into arithmetic: orbit-stabilizer counts orbits, fixed-point
    congruences exploit p-power orbit sizes, and conjugation produces the class equation.'
  items:
  - ref: D-WYC7C
  - ref: T-OBPSZ
  - ref: L-DJKXL
  - ref: T-4CDTT
- slug: sylow-theory
  title: Sylow Theory
  parent: actions-and-counting
  lede: 'Combine prime-power subgroups with the action tools: existence, conjugacy,
    and the numerical constraints on the number of Sylow subgroups.'
  items:
  - ref: D-7TQ2M
  - ref: T-4RADG
  - ref: T-RRK4J
  - ref: T-3X5FF
- slug: applications-and-problems
