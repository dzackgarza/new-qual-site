  - slug: series-and-solvability
    title: Series, Solvability, and Nilpotence
    parent: group-actions-and-counting
    lede: The Jordan–Hölder theorem identifies the composition factors of a finite group
      up to isomorphism and permutation. A group is solvable when its derived series
      reaches the identity. A finite group is nilpotent precisely when all its Sylow
      subgroups are normal. Nilpotence implies solvability. The symmetric group $S_n$ is
      solvable precisely when $n\leq 4$.
    topics:
      - Subgroup Series
      - Solvable Groups
      - Nilpotent Groups
      - Commutators
