  - slug: structure-theorem
    title: The Structure Theorem over a PID
    parent: modules
    lede: A finitely generated module over a principal ideal domain is a direct sum of a
      free module and cyclic torsion modules. Invariant factors or elementary divisors
      determine its isomorphism class. Over the integers this classifies finitely
      generated abelian groups. A linear operator makes a vector space a module over a
      polynomial ring, giving the applications in [Canonical
      Forms](canonical-forms.html).
    topics:
      - Structure Theorem
      - Smith Normal Form
