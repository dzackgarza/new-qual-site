  - slug: sylow-theory
    title: Sylow Theory
    parent: group-actions-and-counting
    lede: Sylow theory applies [Group Actions and
      Counting](group-actions-and-counting.html) to subgroups of prime-power order. If
      $|G|=p^a m$ with $p\nmid m$, then $G$ has a subgroup of order $p^a$, all such
      subgroups are conjugate, and their number divides $m$ and is congruent to $1$
      modulo $p$. A unique Sylow subgroup is normal. Frattini's argument relates a
      normal subgroup to the normalizer of one of its Sylow subgroups.
    topics:
      - Sylow Theory
      - p-Groups
