  - slug: semisimplicity-and-representations
    title: Semisimplicity and representations
    parent: modules
    lede: >-
      A [representation](../../wiki/algebra/representations/index.html) of a finite group $G$
      over a field $k$ is a finite-dimensional left $k[G]$-module. A module is
      [semisimple](../../tag/D-CYAJI.html) if it is a direct sum of simple modules. Maschke's
      theorem: if the characteristic of $k$ does not divide $\abs{G}$, every $k[G]$-module is
      semisimple. By the Artin--Wedderburn theorem, a semisimple ring is a finite product of
      matrix rings $M_{n_i}(D_i)$ over division rings $D_i$. Schur's lemma: over an
      algebraically closed field, the $G$-equivariant endomorphisms of an irreducible
      representation are the scalars. Complex characters of $G$ are class functions, and the
      number of irreducible complex characters of $G$ equals the number of conjugacy classes.
    topics:
      - Semisimplicity
      - Algebras
      - Group Rings
      - Representation Theory
      - Character Theory
