  - slug: modules
    title: Modules
    parent: rings-and-ideals
    lede: >-
      Over a commutative ring $R$, free modules are projective, and over an integral domain
      projective modules are torsion-free. Neither implication reverses in general: the ideal
      $(2,1+\sqrt{-5})$ of $\ZZ[\sqrt{-5}]$ is a projective module that is not free, and $\QQ$
      is a torsion-free $\ZZ$-module that is not projective. A short exact sequence $0\to A\to
      B\to C\to0$ of $R$-modules splits if $C$ is projective. The tensor product $M\otimes_RN$
      represents $R$-bilinear maps out of $M\times N$, and $-\otimes_RN$ is right exact and in
      general not left exact: applying $-\otimes_\ZZ\ZZ/2\ZZ$ to the injection
      $\ZZ\xrightarrow{2}\ZZ$ gives the zero map $\ZZ/2\ZZ\to\ZZ/2\ZZ$.
    topics:
