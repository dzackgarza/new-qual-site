  - slug: groups-and-subgroups
    title: Groups and subgroups
    parent: preliminaries
    lede: >-
      Two left cosets of a subgroup $H\le G$ are equal or disjoint, so for finite $G$,
      $\abs{G}=[G:H]\,\abs{H}$ (Lagrange's theorem). A subgroup $N\le G$ is normal if and only
      if $(aN)(bN)=abN$ is well defined on cosets, and then $G/N$ is a group. The isomorphism
      theorems: a homomorphism $\varphi\colon G\to G'$ induces $G/\ker\varphi\cong\im\varphi$;
      for $H\le G$ and $N\trianglelefteq G$, $HN/N\cong H/(H\cap N)$; for normal subgroups
      $N\le M$ of $G$, $(G/N)/(M/N)\cong G/M$; and $M\mapsto M/N$ is a bijection from the
      subgroups of $G$ containing $N$ to the subgroups of $G/N$. Every subgroup of a cyclic
      group is cyclic, and a cyclic group of order $n$ has exactly one subgroup of each order
      dividing $n$. Cauchy's theorem: if a prime $p$ divides $\abs{G}$, then $G$ has an
      element of order $p$.
    topics:
      - Groups
      - Subgroups
      - Cosets and Lagrange
      - Cyclic Groups
      - Normal Subgroups
      - Homomorphisms
      - Isomorphism Theorems
