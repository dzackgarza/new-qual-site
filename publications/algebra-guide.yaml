  - slug: group-actions-and-counting
    title: Group actions and counting
    parent: groups-and-subgroups
    lede: >-
      For an action of a group $G$ on a set $X$ and $x\in X$, the orbit-stabilizer theorem
      gives a bijection $G/G_x\to G\cdot x$, $gG_x\mapsto g\cdot x$, so $\abs{G\cdot
      x}=[G:G_x]$, which divides $\abs{G}$ when $G$ is finite. For the conjugation action of
      $G$ on itself, the orbits are the conjugacy classes and the stabilizer of $g$ is its
      centralizer $C_G(g)$, which gives the class equation
      $\abs{G}=\abs{Z(G)}+\sum_i[G:C_G(g_i)]$ over representatives $g_i$ of the noncentral
      conjugacy classes. For a nontrivial finite $p$-group each $[G:C_G(g_i)]$ is a positive
      power of $p$, so $p$ divides $\abs{Z(G)}$ and $Z(G)\ne1$. Burnside's lemma: for a finite
      group $G$ acting on a finite set $X$, the number of orbits is
      $\frac{1}{\abs{G}}\sum_{g\in G}\abs{X^g}$, where $X^g$ is the set of points fixed by
      $g$.
    topics:
      - Group Actions
      - Orbit-Stabilizer
      - Conjugacy
      - Centralizers and Normalizers
      - Class Equation
      - Burnside's Lemma
