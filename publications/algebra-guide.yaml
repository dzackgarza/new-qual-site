  - slug: rings-and-ideals
    title: Rings and Ideals
    parent: preliminaries
    lede: "A ring is a group with a second operation, and an ideal is the subobject
      the second operation forces: the kernels of ring maps are exactly the ideals,
      so the isomorphism theorems transfer verbatim. Two kinds of ideal control everything
      downstream, and both are recognised by their quotients: an ideal is prime exactly
      when the quotient is a domain, and maximal exactly when the quotient is a field,
      which makes maximal imply prime and shows the converse fails already in the integers
      at the zero ideal. Zorn's lemma from the first section is what produces maximal
      ideals in the first place."
