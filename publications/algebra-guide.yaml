  - slug: canonical-forms
    title: Canonical Forms
    parent: structure-theorem
    lede: 'This is the structure theorem over a principal ideal domain, read for the
      polynomial ring in one variable. A linear operator makes its space a module over
      that ring; the invariant factors give the rational canonical form, a block diagonal
      of companion matrices, which exists over any field; the elementary divisors give
      the Jordan form, which needs the characteristic polynomial to split. The dictionary
      is worth memorising in one direction: the exponent in the minimal polynomial is
      the size of the largest block for that eigenvalue, the exponent in the characteristic
      polynomial is the total size of all of them, and the dimension of the eigenspace
      is how many there are. An operator is diagonalisable exactly when its minimal
      polynomial is a product of distinct linear factors, which is the separability
      condition of the Galois sections said about a matrix.'
