  - slug: linear-algebra
    title: Linear Algebra
    parent: modules
    lede: "Linear algebra returns here as the case of module theory where the ring is
      a field, so bases exist, rank and nullity add to the dimension, and every short
      exact sequence splits. What is left is the geometry a form puts on the space.
      A bilinear form is recorded by its Gram matrix, nondegeneracy is invertibility
      of that matrix, and a symmetric form in characteristic other than two is the same
      data as a quadratic form; over the reals the spectral theorem diagonalises it
      orthogonally and Sylvester's law says the signature is the only invariant. The
      matrix groups are the stabilizers of these forms, and counting their elements
      over a finite field is the standard application of choosing an ordered basis one
      vector at a time.

      The three operator-theory questions at the end of this section reach past finite
      dimensions -- Toeplitz operators, polar decomposition, and the spectral theorem
      on a Hilbert space -- because the oral exams asked them; they are collected here
      rather than dropped."
