  - slug: group-actions-and-counting
    title: Group Actions and Counting
    parent: groups-and-subgroups
    lede: "For a finite group action, an orbit's size is the index of its stabilizer and therefore
      divides the group order. Conjugation has conjugacy classes as orbits and centralizers
      as stabilizers, giving the class equation. In a nontrivial finite $p$-group every noncentral
      conjugacy class has size divisible by $p$, so $p$ divides the order of the center. Burnside's
      lemma counts orbits by averaging fixed-point counts."
    topics:
      - Group Actions
      - Orbit-Stabilizer
      - Conjugacy
      - Centralizers and Normalizers
      - Class Equation
      - Burnside's Lemma
