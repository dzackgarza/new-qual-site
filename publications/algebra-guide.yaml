  - slug: modules
    title: Modules
    parent: rings-and-ideals
    lede: 'Over a domain, free modules are projective and projective modules are torsion-free;
      the converse implications need not hold. Every short exact sequence with a projective
      quotient splits. Conversely, a module is projective if every short exact sequence having
      it as quotient splits. Tensor products represent bilinear maps and are right exact;
      tensoring with a flat module is exact.'
    topics:
