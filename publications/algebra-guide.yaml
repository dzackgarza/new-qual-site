  - slug: groups-and-subgroups
    title: Groups and Subgroups
    parent: preliminaries
    lede: 'The subject begins with one object and one relation: a group and its subgroups.
      Lagrange supplies the first constraint -- the order of a subgroup divides the
      order of the group -- and it rests on the single fact about cosets that everything
      else reuses, that two cosets are either equal or disjoint. Normality is exactly
      the condition that makes the coset space a group again, and the four isomorphism
      theorems are its consequences: a homomorphism factors through its kernel, a subgroup
      and a normal subgroup meet in a diamond, nested quotients cancel, and the subgroups
      of a quotient are the subgroups containing the kernel. Cyclic groups are the case
      where all of it is visible at once, and Cauchy is the first partial converse to
      Lagrange: a prime dividing the order really is realised by an element.'
