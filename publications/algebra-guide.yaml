  - slug: series-and-solvability
    title: Series, Solvability, and Nilpotence
    parent: group-actions-and-counting
    lede: A composition series breaks a finite group into simple pieces, and Jordan-Holder
      says the multiset of pieces does not depend on how the breaking was done. Two
      conditions on the pieces name the two classes that matter. Solvable means the
      factors are abelian, equivalently that the derived series -- iterate the commutator
      subgroup -- reaches the identity; nilpotent means the central series does, which
      is strictly stronger and equivalent for a finite group to every Sylow subgroup
      being normal. The symmetric groups are solvable exactly up to degree four, which
      is where the classical formulas for the cubic and the quartic stop.
