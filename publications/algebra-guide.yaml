  - slug: semisimplicity-and-representations
    title: Semisimplicity and Representations
    parent: modules
    lede: "A representation is a module over the group algebra, which puts the last
      two sections to work on groups. Maschke says that when the characteristic does
      not divide the order of the group the group algebra is semisimple, so every representation
      splits into irreducibles; Artin-Wedderburn then says a semisimple ring is a finite
      product of matrix rings over division rings, which is why the irreducibles are
      finite in number and their dimensions square-sum to the order of the group. Schur's
      lemma is the local statement that makes the character theory work, and characters
      are class functions, so the character table is square: as many irreducibles as
      conjugacy classes."
    items:
