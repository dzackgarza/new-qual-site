  - slug: products-and-classification
    title: Presentations, Products, and Classification
    parent: sylow-theory
    lede: 'If $G=HK$ and $H\cap K=\{1\}$, then $G$ is an internal direct product when both
      subgroups are normal and an internal semidirect product when $H$ is normal. An action
      $K\to\operatorname{Aut}(H)$ defines an external semidirect product. Sylow theory can
      establish normality of a subgroup. The structure theorem classifies finite abelian groups
      by invariant factors or elementary divisors; presentations specify generators and relations
      for further finite-group examples.'
    topics:
