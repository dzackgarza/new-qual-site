  - slug: permutation-groups
    title: Permutation Groups
    parent: group-actions-and-counting
    lede: 'Every group embeds in a symmetric group, so the symmetric groups are where
      abstract statements get tested. The sign homomorphism is the first invariant:
      a cycle of even length is an odd permutation, conjugation preserves cycle type,
      and the conjugacy classes of the symmetric group on n letters are therefore the
      partitions of n. The alternating groups are simple from degree five onwards, which
      is the fact that later obstructs solvability by radicals, and the transitive subgroups
      of the small symmetric groups are the list a Galois group of a polynomial of that
      degree must come from.'
    items:
