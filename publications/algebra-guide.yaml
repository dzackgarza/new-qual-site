  - slug: products-and-classification
    title: Presentations, products, and classification
    parent: sylow-theory
    lede: >-
      Let $H,K\le G$ with $H\cap K=1$ and $HK=G$. If $H$ and $K$ are both normal, then $G\cong
      H\times K$; if $H$ is normal, then $G\cong H\rtimes_\varphi K$ with
      $\varphi(k)(h)=khk^{-1}$. For $K$ cyclic and homomorphisms $\varphi_1,\varphi_2\colon
      K\to\Aut(H)$ whose images are conjugate in $\Aut(H)$, $H\rtimes_{\varphi_1}K\cong
      H\rtimes_{\varphi_2}K$; and $\Aut(\ZZ/n\ZZ)\cong(\ZZ/n\ZZ)^\times$. The fundamental
      theorem of finite abelian groups writes a finite abelian group uniquely as
      $\ZZ/d_1\ZZ\times\cdots\times\ZZ/d_r\ZZ$ with $1<d_1\mid d_2\mid\cdots\mid d_r$
      (invariant factors), and uniquely up to order as a product of cyclic groups of
      prime-power order (elementary divisors). A presentation $\langle S\mid R\rangle$ is the
      quotient of the free group on $S$ by the normal subgroup generated by $R$.
    topics:
