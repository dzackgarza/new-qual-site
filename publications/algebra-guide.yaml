  - slug: linear-algebra
    title: Linear algebra
    parent: modules
    lede: >-
      A vector space is a module over a field: every vector space has a basis, every short
      exact sequence of vector spaces splits, and $\dim\ker T+\dim\im T=\dim V$ for a linear
      map $T$ on a finite-dimensional space $V$. A bilinear form $b$ on $V$ with ordered basis
      $e=(e_1,\ldots,e_n)$ has Gram matrix $G_e=(b(e_i,e_j))_{i,j}$; for $e'=eP$ with
      $P\in\GL_n(F)$, $G_{e'}=P^tG_eP$, so $b$ is nondegenerate if and only if $\det G_e\ne0$,
      a condition independent of $e$. In characteristic different from $2$, $q(v)=b(v,v)$ and
      $b(v,w)=\frac12\big(q(v+w)-q(v)-q(w)\big)$ identify symmetric bilinear forms with
      quadratic forms. A real symmetric matrix is orthogonally diagonalizable (the spectral
      theorem), and by Sylvester's law of inertia a real symmetric bilinear form is determined
      up to change of basis by its rank and signature. The groups $\GL_n(F)$,
      $\operatorname{O}(q)$, and $\operatorname{Sp}(b)$ are the automorphism groups of $V$, of
      a quadratic form $q$, and of an alternating form $b$; counting ordered bases one vector
      at a time gives $\abs{\GL_n(\FF_q)}=\prod_{i=0}^{n-1}(q^n-q^i)$.

      The section also lists problems on operators on infinite-dimensional spaces: Toeplitz
      operators, the polar decomposition, and the spectral theorem for operators on a Hilbert
      space.
