schema: qual/publication@2
id: GUIDE-ALGEBRA
kind: study-guide
title: Algebra
lede: 'Follow one dependency-ordered path through the subject: the counting arguments
  that constrain a finite group, the ideal theory that constrains a ring, the module
  theory that unifies abelian groups with linear operators, and the Galois correspondence
  that turns a field extension back into a group. Each section assumes only what the
  sections above it establish.'
sections:
  - slug: preliminaries
    title: Preliminaries
    parent: GUIDE-ALGEBRA
    lede: "Two things get used everywhere and proved nowhere else. Zorn's lemma is
      where every maximality argument bottoms out -- the existence of a maximal ideal
      containing a given proper ideal, and with it the existence of algebraic closures
      and of bases for infinite-dimensional spaces -- so it is worth seeing once in
      the form the rest of the subject calls: a poset in which every chain has an upper
      bound has a maximal element. The arithmetic of the integers is the other. The
      totient counts the generators of a cyclic group and, later, the degree of a cyclotomic
      extension; the Chinese remainder theorem splits a cyclic group into its prime-power
      parts and returns as the decomposition of a module over a principal ideal domain;
      Fermat and Euler are the multiplicative-order statements that finite field theory
      will generalise."
    items:
      - ref: D-P6XOT
