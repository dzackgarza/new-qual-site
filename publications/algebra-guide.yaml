  - slug: groups-and-subgroups
    title: Groups and Subgroups
    parent: preliminaries
    lede: 'Cosets of a subgroup partition a group; for finite groups this gives Lagrange''s
      theorem. A normal subgroup defines a quotient group. The isomorphism theorems describe
      kernels, images, products of subgroups, and successive quotients. Subgroups of a quotient
      correspond to subgroups containing the kernel. Cauchy''s theorem gives an element of
      order $p$ for every prime $p$ dividing the order of a finite group.'
    topics:
      - Groups
      - Subgroups
      - Cosets and Lagrange
      - Cyclic Groups
      - Normal Subgroups
      - Homomorphisms
      - Isomorphism Theorems
