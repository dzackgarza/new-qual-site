  - slug: fields-and-extensions
    title: Fields and extensions
    parent: factorization-and-polynomials
    lede: >-
      For fields $K\subseteq L\subseteq M$, $[M:K]=[M:L][L:K]$. An element $\alpha\in L$ is
      algebraic over $K$ if and only if $[K(\alpha):K]$ is finite, and then $[K(\alpha):K]$ is
      the degree of the minimal polynomial of $\alpha$. An algebraic extension $L/K$ is normal
      if every irreducible polynomial in $K[x]$ with a root in $L$ splits into linear factors
      in $L[x]$; a finite extension is normal if and only if it is the splitting field of a
      polynomial in $K[x]$. It is separable if the minimal polynomial of every element of $L$
      has distinct roots. A polynomial $f$ has a repeated root in its splitting field if and
      only if $\gcd(f,f')\ne1$, and every algebraic extension of a perfect field, such as a
      field of characteristic $0$ or a finite field, is separable. For each prime power $q$
      there is a field $\FF_q$ with $q$ elements, unique up to isomorphism, and every finite
      extension of a finite field is normal and separable.
    topics:
      - Field Extensions
      - Fields
      - Splitting Fields
      - Separability
      - Finite Fields
      - Roots of Unity
      - Transcendence
