  - slug: products-and-classification
    title: Presentations, Products, and Classification
    parent: sylow-theory
    lede: 'Classifying the groups of a given order is the exercise that uses everything
      above. The recognition theorems say when a group is a product: a direct product
      when both factors are normal and meet trivially, a semidirect product when only
      one is, and the semidirect products are then counted by homomorphisms into the
      automorphism group of the normal factor, which for a cyclic group is its unit
      group. Sylow supplies the normal factor, the fundamental theorem of finite abelian
      groups supplies the abelian possibilities in both invariant-factor and elementary-divisor
      form, and a presentation is how the nonabelian answer gets written down.'
