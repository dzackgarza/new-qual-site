  - slug: sylow-theory
    title: Sylow Theory
    parent: group-actions-and-counting
    lede: Sylow is the counting of the previous section applied to the set of p-subgroups.
      The first theorem says a subgroup of order the full power of p dividing the group
      order exists; the second says any two are conjugate, so there is really only one
      up to the action; the third says their number divides the complementary factor
      and is congruent to one modulo p. The third is the one that does the work on an
      exam, because those two conditions together usually leave a single possibility,
      and a unique Sylow subgroup is normal. Frattini's argument and the p-group results
      are how Sylow feeds back into the structure theory that follows.
