  - slug: rings-and-ideals
    title: Rings and Ideals
    parent: preliminaries
    lede: "Ideals are exactly kernels of ring maps, so quotient rings carry the isomorphism
      theorems. Prime and maximal ideals are recognised by their quotients: an ideal is prime
      exactly when the quotient is a domain, and maximal exactly when the quotient is a field,
      which makes maximal imply prime and shows the converse fails already in the integers
      at the zero ideal. [Preliminaries](preliminaries.html) supplies Zorn's lemma, which
      produces maximal ideals in the first place."
    topics:
