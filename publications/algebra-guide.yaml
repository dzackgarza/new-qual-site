  - slug: semisimplicity-and-representations
    title: Semisimplicity and Representations
    parent: modules
    lede: >-
      A finite-dimensional [representation](../../wiki/algebra/representations/index.html)
      of a finite group $G$ over a field $k$ is a finite-dimensional left $k[G]$-module. A
      module is [semisimple](../../tag/D-CYAJI.html) when it is a direct sum of simple modules.
      If the characteristic of $k$ does not divide $|G|$, Maschke's theorem gives decomposition
      into irreducibles. A semisimple Artinian ring is a finite product of matrix rings over
      division rings. Over an algebraically closed field, equivariant endomorphisms of a finite-dimensional
      irreducible representation are scalar. Over $\mathbb C$, the number of irreducible characters
      equals the number of conjugacy classes.
    topics:
      - Semisimplicity
      - Algebras
      - Group Rings
      - Representation Theory
      - Character Theory
    items:
