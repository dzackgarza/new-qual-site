  - slug: modules
    title: Modules
    parent: rings-and-ideals
    lede: 'A module is a vector space over a ring, and dropping the field is exactly
      what makes the subject interesting: bases need not exist, so free, projective,
      and torsion-free become three different conditions instead of one. Free implies
      projective implies torsion-free over a domain, and none of the arrows reverse.
      Exactness is the language for comparing modules, a short exact sequence splits
      precisely when the quotient is projective, and the tensor product is the construction
      that turns bilinear data into linear data and fails to be exact on the left.'
