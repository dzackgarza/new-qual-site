  - slug: permutation-groups
    title: Permutation Groups
    parent: group-actions-and-counting
    lede: 'Cayley''s theorem embeds each group in a symmetric group. Conjugacy classes in
      $S_n$ are determined by cycle type and indexed by partitions of $n$. The sign homomorphism
      has kernel $A_n$, which is simple for $n\geq 5$. The Galois group of an irreducible
      separable polynomial acts transitively on its roots.'
    topics:
      - Permutations
      - Simple Groups
      - Partitions
