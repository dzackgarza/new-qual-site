  - slug: galois-theory
    title: Galois Theory
    parent: fields-and-extensions
    lede: 'Galois means normal and separable, equivalently that the fixed field of the
      automorphism group is exactly the base, equivalently that the number of automorphisms
      equals the degree. The correspondence is then an inclusion-reversing bijection
      between intermediate fields and subgroups of the Galois group, under which degrees
      over the base become indices, and an intermediate field is normal over the base
      exactly when its subgroup is normal, with quotient the Galois group of the smaller
      extension. Everything computational follows: the Galois group of a polynomial
      is a transitive subgroup of the symmetric group on its roots, the discriminant
      decides whether it lands in the alternating group, and the resolvent decides the
      quartic.'
