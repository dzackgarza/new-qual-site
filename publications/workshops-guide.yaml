  - slug: real-analysis-sittings
    title: Real Analysis Workshop Sittings
    parent: real-analysis
    lede: >-
      The seven days of the Real Analysis workshop, extracted from the worksheets rather
      than from the wiki week pages above, and the reason this branch is not just those
      pages: each day is a sitting card whose route lists that day's problems in the order
      they were set, with every problem linking to its canonical card in the Real Analysis
      branch. The run is Day 2 through Day 8; there is no Day 1 among the extracted
      worksheets. Metric spaces and topology come first because the rest of the subject is
      stated in their language, then sequences and series, then the three calculus days,
      then sequences and series of functions, where uniform convergence separates what the
      earlier days could assume. The twenty numbered results the worksheets state and then
      set problems against follow the sittings: they carry no occurrence, so no sitting
      page lists them, and this is the only place in the branch they can be read. Their
      numbering runs 3.1 to 6.7 with 6.6 absent, which is how the source has it.
    items:
