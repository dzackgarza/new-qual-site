  - slug: topology-workshop-packets
    title: Topology Workshop Packets
    parent: topology
    lede: >-
      Two topology workshop packets. The numbered-day packet runs through compactness,
      connectedness, separation axioms, counterexamples, then fundamental groups,
      covering spaces and homology, with no Day 5 or Day 6 among the source worksheets.
      The May 2020 packet runs the same ground again in one week. Problems remain in
      day or worksheet order.
    items:
      - ref: SRC-TOP-WORKSHOP
      - ref: SRC-TOP-WORKSHOP-2020
