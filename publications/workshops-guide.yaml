    title: Real analysis workshop packet
    parent: real-analysis
    lede: >-
      The UNL real-analysis workshop packet, by day. Days 1, 9, and 10 are the May 2016, January 2019, and May 2018 qualifying exams, and Days 2--8 are topic sheets. The worksheets state results and definitions on convergence of sequences and series of functions, and problems on the sheets apply them.
