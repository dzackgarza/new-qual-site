schema: qual/publication@2
id: GUIDE-WORKSHOPS
kind: study-guide
title: Workshops
lede: >-
  The qual workshops as a practice track across all four subjects. Every problem here is
  a card the subject branches already own, met in the order the workshop met it rather than
  in dependency order, so this reads as a companion to those branches and not as a second
  copy of them.
sections:
  - slug: algebra
    title: Algebra
    parent: GUIDE-WORKSHOPS
    lede: >-
      Four sittings that run the Algebra branch's results as practice: subgroup and index
      counting first, then the finite-group structure the counting supports, then Sylow
      applied, and finally rings. These are the same canonical problems the Algebra guide
      lands on, met here in the order the workshop met them rather than in dependency order.
      Two later sittings, on representation theory and linear algebra, left pages but no
      problems.
