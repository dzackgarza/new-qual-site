  - slug: real-analysis
    title: Real Analysis
    parent: GUIDE-WORKSHOPS
    lede: >-
      Two sittings against the Real Analysis branch. The first works the preliminaries the
      continuity section assumes; the second is measure theory, which the branch's
      Riemann-Stieltjes section does not reach, so this is the only route to that material in
      a reading order.
