  - slug: topology-sittings
    title: Topology Workshop Sittings
    parent: topology
    lede: >-
      Fifteen Topology sittings, in two runs that cover the subject twice at different
      depths. The numbered days follow the Topology branch's own order -- compactness,
      connectedness, separation axioms, counterexamples, then fundamental groups, covering
      spaces and homology -- with no Day 5 or Day 6 among the extracted worksheets. The
      eight worksheets of the May 2020 workshop run the same ground again in one week,
      pairing a warm-up sheet with a problem sheet at each stage. Each sitting's route
      lists its problems in the order they were set and links each to its canonical card in
      the Topology branch.
    items:
