schema: qual/publication@2
id: GUIDE-WORKSHOPS
kind: study-guide
title: Workshops
lede: >-
  The qual workshops as a practice track across all four subjects. Problems appear in
  the order the workshops met them rather than in dependency order, so this is a
  companion practice sequence to the subject guides rather than a second traversal of
  the theory.
sections:
