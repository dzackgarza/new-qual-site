  - slug: real-analysis-workshop-packet
    title: Real analysis workshop packet
    parent: real-analysis
    lede: >-
      The UNL real-analysis workshop packet, by day. Days 1, 9, and 10 are the May 2016,
      January 2019, and May 2018 qualifying exams, and Days 2--8 are topic sheets. The
      worksheets state numbered results 3.1--3.5, 4.1--4.3, 5.1--5.5, and 6.1--6.7, with no
      result 6.6 in the source, and a definition of pointwise and uniform convergence of
      sequences and series of functions; problems on the sheets apply them.
    items:
      - ref: SRC-RA-WORKSHOP
