  - slug: real-analysis-workshop-packet
    title: Real Analysis Workshop Packet
    parent: real-analysis
    lede: >-
      The UNL real-analysis workshop packet, organized by day from the worksheets.
      Days 1, 9, and 10 are the May 2016, January 2019, and May 2018 qualifying
      exams; Days 2–8 are the topic sheets. The packet states twenty numbered results
      and then sets problems against them. Their numbering runs 3.1 to 6.7 with 6.6
      absent, matching the source.
